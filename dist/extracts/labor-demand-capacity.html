blended CapEx %, allocates to work (story points) or towers (fixed capacity), and generates the SAP-ready CapEx/OpEx actuals file that deprecates time writing. A monthly tie-out and variance report keeps the standard-rate portfolio view reconciled with the actual-cost accounting view.","cadence":"Monthly","lanes":["Targetprocess / ATP","Costing / TBM Studio","ERP (SAP)"],"steps":[{"n":"14","type":"Task","lane":"Targetprocess / ATP","task":"Maintain involvements %, job profiles, CapEx/OpEx & IT-tower mappings","note":"Three ingredients: job profiles, involvements, protected rates","l2":["04.1.2","04.1.3"]},{"n":"15","type":"Send task (ADM)","lane":"Targetprocess / ATP","task":"Send workforce & completed work data to Costing (TBM Studio)","l2":["04.5.3","06.4.6"]},{"n":"16","type":"Service task","lane":"Costing / TBM Studio","task":"Calculate monthly team cost & blended CapEx % (protected rates)","l2":["06.4.7"]},{"n":"17","type":"XOR gateway","lane":"Costing / TBM Studio","task":"Team work visible?","note":"Yes: story-point allocation; No: fixed-capacity","l2":["06.4.8"],"decision":"labor-effort-signal"},{"n":"17a","type":"Task","lane":"Costing / TBM Studio","task":"Allocate team costs to completed work (story points, weightage)","note":"Same allocation principles as TBM","l2":["06.4.8"],"when":{"labor-effort-signal":["story-points","story-count","timesheet","work-effort-unit"]}},{"n":"17b","type":"Task","lane":"Costing / TBM Studio","task":"Allocate team costs to IT towers / apps (fixed capacity)","note":"Ops teams without visible backlog (e.g. ServiceNow)","l2":["06.4.8"],"when":{"labor-effort-signal":["fixed-capacity"]}},{"n":"18","type":"Service task","lane":"Costing / TBM Studio","task":"Generate SAP-ready monthly actuals - CapEx / OpEx by user","note":"Deprecates time writing; join gateway before this step","l2":["06.4.9"]},{"n":"19","type":"Task","lane":"Costing / TBM Studio","task":"Tie out team x month; report rate & volume variance (standard vs actual); raise mid-year rate revisions","note":"Portfolio view at standard, books at actual - reconciled, never forced to agree","l2":["06.4.10"]}],"upstream":["UC2"],"downstream":[],"kind":null}],"glossary":[["ADM","Apptio Data Management - the \"data highway\" that moves data between the four products"],["ART","Agile Release Train - a long-lived team of agile teams (SAFe)"],["ATP","Apptio Targetprocess"],["ATUM","Apptio TBM Unified Model - the standard cost taxonomy (cost pools > towers > services)"],["BAU","Business as usual - run work, as opposed to change"],["BU","Business unit"],["CapEx / OpEx","Capital vs operating expenditure - affects how labor and assets are accounted for"],["CFD","Customer-facing deck (internal evidence shorthand)"],["CUD","Committed use discount (Google Cloud)"],["EAP","Enterprise Agile Planning"],["EBM","Enterprise Business Management - extending TBM costing beyond IT"],["FinOps","Cloud financial management practice and framework"],["FOCUS","FinOps Open Cost and Usage Specification - a common billing data format"],["FP&A","Financial planning & analysis"],["FTE","Full-time equivalent"],["GL","General ledger"],["HPM","Hybrid Portfolio Management (Targetprocess solution area)"],["IIP","Integrated Investment Planning (Planning feature)"],["ITFM","IT financial management"],["KPI","Key performance indicator"],["LPM","Lean Portfolio Management (SAFe)"],["OKR","Objectives and key results"],["PI","Planning Interval (formerly Program Increment) - an 8-12 week SAFe planning cadence"],["PMO","Project/portfolio management office"],["RI / SP","Reserved instances / savings plans - cloud commitment discounts"],["ROAM","Resolved, Owned, Accepted, Mitigated - SAFe risk handling"],["RTE","Release Train Engineer"],["SAFe","Scaled Agile Framework"],["SPM","Strategic Portfolio Management"],["TBM","Technology Business Management - the framework for IT cost transparency and value"],["TCO","Total cost of ownership"],["VSM","Value stream management"],["WFM","Workforce management"],["WSJF","Weighted shortest job first - a SAFe prioritization formula"],["ZBB / ZBx","Zero-based budgeting / zero-based mindset as a continuous practice"]],"changelog":[{"version":"0.8.0","date":"2026-10-01","items":["Extract “Labor Rates, Demand & Capacity Management”: 30 of the catalog’s 153 processes (02.1, 02.2, 04.1, 04.2, 04.3, 04.4, 04.5, 06.4), 4 of 7 flows and 7 of 11 design decisions. Group 04.1 is narrowed to the processes relevant here. Records, diagrams and decisions are identical to the full catalog at this version."]},{"version":"0.8.0","date":"2026-10-01","items":["Labor rate card build: three new processes at the head of 06.4 - 06.4.1 Define the labor rate structure (P-0150), 06.4.2 Compute fully loaded labor rates (P-0151), 06.4.3 Approve, effective-date & publish the rate card (P-0152). They start from the labor roster already loaded in Costing (salary + benefits, or contract rates) and produce the protected rate tables that blending starts from. Rate dimensions: band/level, role family, location, employment type; components: base pay, benefits/burden, overhead uplift, productive hours.","06.4.1-06.4.6 renumbered to 06.4.4-06.4.9 (P-0091-P-0096 unchanged; each record shows its former id). All cross-references, D-01/D-02 scope, UC1/UC2 steps and the operating calendar updated.","UC2 Rates back gains step 10, the annual rate-card build, ahead of blending.","D-02 Rate exposure now also shapes 06.4.1, 06.4.3 and 06.4.10; D-01 Labor effort signal shapes 06.4.2 (the rate divisor).","06.4.10 Reconcile standard vs actual labor cost & trigger rate revisions (P-0153): the monthly team x month tie-out and rate/volume variance report that keeps the standard-rate portfolio view and the actual-cost accounting view in sync and triggers mid-year cell revisions. UC1 gains step 19.","docs/labor-rates.md: method note on the three kinds of rate, the calculation with a worked example, data sources, refresh cadence vs turnover, and the four reconciliation mechanisms."]},{"version":"0.7.0","date":"2026-09-15","items":["Design-decision register added (decisions[]): 11 choices a customer makes once - labor effort signal (story points / item count / timesheets / work-effort units / fixed capacity), labor rate exposure, budget build method, portfolio funding model, investment governance, prioritization method, capacity basis, demand intake channel, cloud commitment mode, IT cost recovery model and team tool of record - each with options, fit, prerequisites, trade-offs and the L2s and flows it affects.","L2 variants: the same process done a different way under an option of a decision (variants[] on 21 L2s, e.g. 06.4.8 has one variant per labor effort signal). Variant fields override the base record; the base stays method-neutral.","L2 applicability (applies_when) marks processes that only exist under certain options, e.g. 04.5.2 Approve timesheets, 05.8.x under ZBB, 07.5.4 under Savings Automation.","Flow-step conditions (when / decision) on UC1 steps 17-17b and ZBB z0-z9 so gateways are labeled from the register and the profile view dims steps that are off-path.","Site: Decisions page (#/decisions) doubles as a customer-profile picker; records show approach tabs; register gains a Decision facet and an 'Approaches' column; flow pages show step conditions. Docs and the Excel master gain Decisions and Variants outputs.","Base text of 04.5.1, 04.5.3, 06.4.8 and 02.2.2 rewritten method-neutral; the 'alternative' prose moved into variants. budgeting_method tags are retained and now documented by decision D-03."]},{"version":"0.6.0","date":"2026-09-15","items":["Repository build: data/catalog.json is now the single source of truth; the GitHub Pages site, docs, Mermaid, BPMN XML, SVG snapshots and Excel master are all regenerated from it by scripts/generate.py.","BPMN 2.0 swimlane diagrams for every process area (9), every process group (45) and every cross-tool flow (7), both in the site and as importable .bpmn files with SVG snapshots.","Folded in the PI Planning / Enterprise Value Delivery agent requirements that only lived in the old YAML catalog: 03.1 renamed to quarterly planning on the SAFe PI cadence, two new L2s (03.1.5 ROAM & confidence vote, 03.1.6 System demo & Inspect and Adapt), enriched 01.1.2, 01.2.1, 02.1.2, 02.2.1, 02.3.2, 02.3.3, 03.1.1, 03.1.4, 05.7.2, and a new group 10.7 AI-assisted planning & delivery intelligence (10.7.1-10.7.3).","Structure is now 9 L0 · 45 L1 · 149 L2 · 7 flows."]},{"version":"0.5.0","date":"2026-09-15","items":["BPMN 2.0 swimlane diagram on every flow page, generated from the step table, with BPMN XML export."]},{"version":"0.5.0","date":"2026-09-15","items":["BPMN 2.0 swimlane diagram rendered on every flow page (UC3, UC2, UC1, UC4, CLD, INV, ZBB), generated from the step table: lanes per system/role, task types (user, service, send/ADM), exclusive gateways with Yes/No branches, rejection end events and rework loops. Tasks link to the catalog process they invoke.","BPMN 2.0 XML export (with diagram interchange) per flow, copyable for Camunda, bpmn.io, Visio, Signavio or Draw.io."]},{"version":"0.4.0","date":"2026-09-15","items":["L0-09 \"Cross-tool end-to-end flows\" converted from a process area into seven flow overlays (UC3, UC2, UC1, UC4, CLD, INV, ZBB). Its L2 rows 09.1.1-09.7.1 are retired; the flow pages carry their content.","06.7 Investment mix analysis merged into 06.2 (06.7.1 is now 06.2.3).","07.7 Cloud sustainability merged into 07.3 (07.7.1 is now 07.3.4).","08.2 Demand shaping, 08.3 EBM and 08.4 Executive rhythm merged into 08.2 \"Engage the business & steer value\" (08.3.1 is now 08.2.2, 08.4.1 is now 08.2.3).","Permanent element IDs (P-0001 ...) added to every L2; group IDs (G-011 ...) to every L1.","10.4.1 Configure FinOps tooling split into 10.4.1 (data, mappings & views) and 10.4.2 (budgets, alerts, optimization & governance) so 10.4 has two children.","L1 names linted to verb-noun.","Every L2 gains a plain-language outcome line, a normalized persona vocabulary (16 roles), a cadence bucket and a completeness count.","Review layer added: status per L2, verdict per L1, comments anchored to element ID."]},{"version":"0.3.0","date":"2026-09-02","items":["Zero-based budgeting added as a selectable budgeting method (05.8, flow ZBB, Budgeting-method tags)."]},{"version":"0.2.0","date":"2026-08-18","items":["Initial L0-L2 catalog built from framework research, IBM product documentation and the cross-tool E2E BPMN."]}],"decisions":[{"id":"D-01","key":"labor-effort-signal","name":"Labor effort signal","domain":"Labor costing & capitalization","question":"How is labor effort captured and attached to work so it can be costed, capitalized and rolled into App TCO?","why":"Drives which Targetprocess entities carry effort, what crosses the ADM feed to Costing, how team cost is spread over work and towers, and what the auditors see behind the CapEx file. Most customers mix approaches by team kind (e.g. story points for product teams, fixed capacity for ops queues), so this decision is normally made per team type.","multi":true,"default":"story-points","options":[{"id":"story-points","name":"Cost per story point","summary":"Monthly team cost divided by story points completed gives a cost per point; cost lands on epics, features and applications in proportion to the points delivered against them. Effort is never typed in - it comes from the backlog.","fit":"Agile teams with a visible, well-groomed backlog in Targetprocess or a synced Jira/ADO. The Apptio reference pattern ('deprecates time writing').","prereqs":"Involvements % (04.1.2), job profiles with CapEx/OpEx split (04.1.3), protected rates (06.4.4), completed-work feed to Costing (UC1), a capitalization policy signed off with Finance/audit.","tradeoffs":"Points are only comparable within a team - always normalize per team, never enterprise-wide. Un-estimated or carried-over work distorts the month. Needs backlog hygiene and a documented policy for auditors.","evidence":"E2E BPMN g_vis/t_work; e2e script UC1"},{"id":"story-count","name":"Cost per completed work item","summary":"Same mechanism as story points but every completed story/work item weighs the same. Team cost divided by items done.","fit":"Kanban / no-estimates teams, support and enhancement teams whose items are of similar size.","prereqs":"As story points, minus estimation discipline.","tradeoffs":"A one-line fix and a two-week story cost the same; acceptable only where item sizes are homogeneous.","evidence":"Costing labor allocation options (06.4.8 config)"},{"id":"timesheet","name":"Timesheets (hours x rate)","summary":"People log hours against work items or projects in the Time entity; managers approve weekly; approved hours x rate is the labor cost attached to work and the basis for CapEx.","fit":"Traditional and hybrid delivery, professional-services and contractor billing, regulated environments that require hours as the capitalization evidence, or where Finance already runs a timesheet regime.","prereqs":"Time Tracking solution + Timesheet approval workflow (04.5.1-04.5.2), rate source (job-profile or blended rate), timesheet compliance reporting.","tradeoffs":"Highest burden and the classic accuracy decay (end-of-week estimates, 'other' buckets). Needs chasing and compliance metrics. Strongest audit trail.","evidence":"TP Time Tracking; 2026.03 Timesheet with Approval Workflow solution sheet"},{"id":"work-effort-unit","name":"Planned work-effort units (allocation-based)","summary":"Work Allocations (% or man-days per person/team per period) are treated as the effort signal; no hours are recorded. Cost = allocation x rate, trued up periodically against actual completion.","fit":"Hybrid organizations that plan resourcing carefully but will not run timesheets; project-based funding where the plan is the contract.","prereqs":"Demand & Capacity solution with Work Allocations (04.3.1 / 04.3.4), a true-up rule (quarterly or at project close), blended rates (UC2).","tradeoffs":"Planned is not actual - variance hides until true-up. Weaker capitalization evidence than hours; usually paired with a sign-off step.","evidence":"LFM demo (requested man-days); WFM deck"},{"id":"fixed-capacity","name":"Fixed capacity (team to tower/app)","summary":"No work-level attribution at all: the team's monthly cost is allocated to applications or IT towers by a standing rule (team->tower mapping, % splits).","fit":"Run/operations teams without a visible backlog (ServiceNow queues, infrastructure ops, service desk), platform teams charged as shared services.","prereqs":"Team->IT tower / application mapping (04.1.3), allocation strategy in Model Studio (06.1.2).","tradeoffs":"No run-vs-change split from data; capitalization only via a fixed % if policy allows. Simplest to operate.","evidence":"E2E BPMN t_tower; e2e script (ServiceNow example)"}],"affects":["06.4.2","04.1.3","04.5.1","04.5.2","04.5.3","06.4.6","06.4.8","06.4.9"],"flows":["UC1"],"related":["rate-exposure","capacity-basis"]},{"id":"D-02","key":"rate-exposure","name":"Labor rate exposure","domain":"Labor costing & capitalization","question":"Which labor rate is allowed to leave Costing and be used in Targetprocess to cost work?","why":"Individual compensation is sensitive; the level at which rates are blended sets who can see what, how accurate costed allocations are, and whether a true-up is needed between the rate used in the portfolio and actuals in Costing.","multi":false,"default":"blended-team","options":[{"id":"blended-team","name":"Blended team / ART rate","summary":"Costing computes one blended rate per team, ART or solution train from protected individual rates and publishes only that. Portfolio costs work at the team rate.","fit":"Most enterprises; the Apptio reference pattern.","prereqs":"Team structure with involvements (04.1.2), ATP CM Rate Transform (06.4.4), ADM rate feed (06.4.5).","tradeoffs":"Costed allocations drift from actuals when team mix changes - define a true-up (monthly or quarterly).","evidence":"E2E BPMN t_rates/t_send4; e2e script UC2"},{"id":"role-location","name":"Job-profile rate (role x location)","summary":"Standard rate card per job profile (role x location, optionally employment type) published to Targetprocess; individuals inherit their profile's rate.","fit":"Organizations with a mature rate card, project-based estimating, PS/contractor mixes, or where teams are too fluid to blend.","prereqs":"Job Profile entities with rate linkage (04.1.3), rate card governance (annual refresh).","tradeoffs":"More granular than a team rate and still non-identifying, but a rate card needs owning and refreshing.","evidence":"E2E BPMN t_data; Planning labor rate cards (05.7.2)"},{"id":"individual","name":"Individual (actual) rates","summary":"Actual loaded cost per person leaves Costing and is used to cost allocations and time.","fit":"Small IT organizations, PS firms, or where Finance already exposes comp to project accounting.","prereqs":"Restricted-access roles in Targetprocess, HR/works-council approval, field-level permissions.","tradeoffs":"Most accurate, but exposes compensation in a delivery tool; usually blocked by HR/privacy. Not the default.","evidence":"06.4.4 rate-exposure design decision"}],"affects":["06.4.1","06.4.3","04.1.3","06.4.4","06.4.5","04.3.1","06.4.10"],"flows":["UC2"],"related":["labor-effort-signal"]},{"id":"D-04","key":"funding-model","name":"Portfolio funding model","domain":"Demand & portfolio investment","question":"Is change work funded per project, per value stream/product, or both during a transition?","why":"Decides the shape of the Budgeting solution in Targetprocess, whether budgets attach to Projects or to Portfolios/ARTs, what the investment loop with Planning carries, and how top-down targets are applied.","multi":false,"default":"hybrid","options":[{"id":"project-based","name":"Project-based funding","summary":"Money is approved per project/initiative with a business case and a defined scope; actuals are tracked per project.","fit":"Traditional and regulated PMOs, capital-project cultures, organizations early on the SPM journey.","prereqs":"Project entities with budgets, stage-gate governance (D-05), investment tags in Planning (05.7.1).","tradeoffs":"Re-planning is slow; funding follows projects rather than capacity; encourages large batches.","evidence":"EAP CFD (annual -> continuous); TP Budgeting"},{"id":"value-stream","name":"Value-stream / product funding (Lean Budgets)","summary":"Capacity is funded per value stream, ART or product with guardrails; epics are approved inside the envelope, not funded individually.","fit":"SAFe / LPM organizations, product operating models.","prereqs":"Value streams as Portfolios/Groups (03.4.1), Lean Budget guardrails (02.4.1), participatory budgeting forums.","tradeoffs":"Finance must accept capacity-based accounting; capitalization moves to the labor model (D-01).","evidence":"SAFe Lean Budgets; TP Budgeting solution"},{"id":"hybrid","name":"Hybrid (both, side by side)","summary":"Project-based and value-stream funding coexist - typically during a multi-year transition or where some domains stay project-shaped.","fit":"Most large enterprises today.","prereqs":"Common categorization (BAU vs change, CapEx/OpEx) across both (02.3.4), Hybrid Portfolio Management solution.","tradeoffs":"Two governance paths to keep consistent; reporting must reconcile both.","evidence":"WFM deck (hybrid programs); Customer PowerUp"}],"affects":["02.2.3"],"flows":["INV","UC3"],"related":["investment-governance"]},{"id":"D-05","key":"investment-governance","name":"Investment approval governance","domain":"Demand & portfolio investment","question":"How does an investment get approved - phase gates, lean portfolio flow, or both?","why":"Shapes entity workflows and per-state permissions in Targetprocess, which forums decide, and whether Portfolio Kanban states or gate reviews are the control points.","multi":false,"default":"hybrid","options":[{"id":"stage-gate","name":"Stage-gate","summary":"Initiatives pass formal gates (concept, business case, design, build, deploy) with documented approvals and criteria at each.","fit":"Traditional PMOs, regulated change, capital projects.","prereqs":"Entity states as gates with role permissions, milestone entities, gate evidence fields (03.3.3).","tradeoffs":"Predictable control, slow flow; encourages big up-front business cases.","evidence":"Traditional PM solution; stage-gate research"},{"id":"lean-lpm","name":"Lean portfolio flow (Portfolio Kanban)","summary":"Epics move Funnel > Reviewing > Analyzing > Backlog > Implementing with WIP limits; approval is the move to Backlog within the value-stream guardrails.","fit":"SAFe / LPM organizations with value-stream funding.","prereqs":"Portfolio Epic workflow, WSJF or scoring (D-06), Lean Budgets (D-04).","tradeoffs":"Needs trust in guardrails; auditors may want an explicit approval artifact.","evidence":"SAFe LPM; TP entity workflows (02.1.3)"},{"id":"hybrid","name":"Hybrid","summary":"Gates for large/regulated initiatives, lean flow for value-stream work - one governed portfolio view over both.","fit":"Enterprises running agile and traditional delivery together.","prereqs":"Hybrid Portfolio Management solution, common categorization (02.3.4).","tradeoffs":"Clear rules needed for which path an item takes.","evidence":"WFM deck; Customer PowerUp (hybrid)"}],"affects":["02.1.3","02.2.3"],"flows":["INV"],"related":["funding-model","prioritization-method"]},{"id":"D-06","key":"prioritization-method","name":"Prioritization method","domain":"Demand & portfolio investment","question":"How is the portfolio backlog ranked?","why":"Determines which custom and calculated fields exist on epics, what the ranking views show and how ZBB packages are ranked when 05.8 runs.","multi":false,"default":"wsjf","options":[{"id":"wsjf","name":"WSJF","summary":"Cost of delay (business value + time criticality + risk reduction/opportunity enablement) divided by job size, as a calculated field.","fit":"SAFe organizations; fast, relative ranking.","prereqs":"Numeric custom fields BV/TC/RR-OE/size, calculated field or metric, prioritized list views (02.2.2).","tradeoffs":"Relative, gameable, weak for compliance/mandatory work.","evidence":"SAFe WSJF; TP calculated fields"},{"id":"weighted-scoring","name":"Weighted objective scoring","summary":"Configurable criteria (strategic alignment, value, risk, cost, compliance) with weights; a score per item; often per portfolio.","fit":"Hybrid and traditional portfolios; organizations that must show a defensible model to a board.","prereqs":"Scoring custom fields, Portfolio Epic Score report, objective-scoring configuration.","tradeoffs":"Weights need governance; can become a spreadsheet exercise.","evidence":"WFM deck prioritization; TP Portfolio Epic Score"},{"id":"manual","name":"Manual / forum ranking","summary":"A governance forum ranks items by hand (drag-order or rank field) informed by business cases.","fit":"Small portfolios, early maturity.","prereqs":"Rank/order field, prioritized list views.","tradeoffs":"Opaque; depends on who is in the room.","evidence":"SPM maturity model (Foundational)"}],"affects":["02.2.2"],"flows":[],"related":["investment-governance"]},{"id":"D-07","key":"capacity-basis","name":"Capacity planning basis","domain":"Workforce & resource management","question":"Is capacity planned and allocated per team, per role/named individual, or both?","why":"Decides whether Work Allocations attach to teams or people, how demand is expressed (team % vs role man-days) and which capacity views and reports are configured.","multi":false,"default":"both","options":[{"id":"team-based","name":"Team-based","summary":"Long-lived teams are the unit of capacity; work is allocated to teams and ARTs by % or PI capacity.","fit":"Agile at scale; value-stream funding.","prereqs":"Team entities with involvements (04.1.2), team allocation views.","tradeoffs":"Named-resource requests (specialists) have no home.","evidence":"E2E BPMN t_alloc; SAFe capacity"},{"id":"role-individual","name":"Role / individual-based","summary":"Demand is expressed as roles and man-days; named individuals are assigned to projects with availability checks.","fit":"Project-based PMOs, PS organizations, shared specialist pools.","prereqs":"Role-based demand requests, Work Allocations at person level, availability / vacation integration (04.3.4).","tradeoffs":"Heavier to maintain; utilization chasing.","evidence":"LFM demo (requested man-days)"},{"id":"both","name":"Both (one capacity model)","summary":"Team-based for agile work and role/individual-based for project work in the same capacity model.","fit":"Hybrid organizations - the common case.","prereqs":"Both configurations plus a rule for which work type uses which.","tradeoffs":"Double-counting risk where a person is both in a team and on a project - involvements must sum to 100%.","evidence":"WFM deck; 04.2.1 / 04.3.4"}],"affects":["04.2.1","04.2.2","04.3.1","04.3.4"],"flows":["UC3"],"related":["labor-effort-signal"]},{"id":"D-08","key":"demand-intake-channel","name":"Demand intake channel","domain":"Demand & portfolio investment","question":"Where do ideas and requests enter - the Targetprocess Service Desk, a ServiceNow front end, or email/forms?","why":"Sets which portal is configured, whether an integration is needed, and where triage happens.","multi":true,"default":"tp-service-desk","options":[{"id":"tp-service-desk","name":"Targetprocess Service Desk portal","summary":"Requesters use the built-in portal; Request entities and request types with voting.","fit":"Organizations standardizing on Targetprocess for intake.","prereqs":"Service Desk portal, Request entity + types, automation rules for routing (02.1.1-02.1.2).","tradeoffs":"Another portal for business users if ServiceNow already exists.","evidence":"TP guide Service Desk"},{"id":"servicenow","name":"ServiceNow ideation / demand front end","summary":"Ideas are raised in ServiceNow; an integration creates Requests/epics in Targetprocess for qualification.","fit":"ServiceNow-centric enterprises.","prereqs":"ServiceNow integration (10.1.5), field mapping, status sync.","tradeoffs":"Two systems of record for the early lifecycle; sync rules matter.","evidence":"WFM deck (ServiceNow ideation front-end)"},{"id":"email-forms","name":"Email / forms","summary":"Requests arrive by email or a form and are created by automation or a triage team.","fit":"Small volumes, interim state.","prereqs":"Email integration, automation rules.","tradeoffs":"Low structure; manual triage.","evidence":"TP email integration"}],"affects":["02.1.1","02.1.2"],"flows":[],"related":[]}]}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const L0S = DATA.l0s, FLOWS = DATA.flows;
const L0 = Object.fromEntries(L0S.map(l=>[l.id,l]));
const L1 = {}, L2 = {}, L2BYEID = {};
L0S.forEach(l0=>l0.l1s.forEach(l1=>{L1[l1.id]=l1; l1.l0=l0.id; l1.l2s.forEach(l2=>{L2[l2.id]=l2; L2BYEID[l2.eid]=l2; l2.l1=l1.id; l2.l0=l0.id;});}));
const ALL_L2 = Object.values(L2);
const FLOW = Object.fromEntries(FLOWS.map(f=>[f.id,f]));
const DECISIONS = DATA.decisions||[];
const DEC = Object.fromEntries(DECISIONS.map(d=>[d.key,d]));
const OPT = (key,id)=>{ const d=DEC[key]; return d && d.options.find(o=>o.id===id); };
const STATUS ={draft:'Draft',review:'In review',changes:'Changes requested',confirmed:'Confirmed'};
const VERDICT = {'':'No verdict yet',confirmed:'Confirmed',updated:'Updated',flagged:'Flagged'};
const PCOLOR = {Targetprocess:'var(--tp)',Costing:'var(--co)',Planning:'var(--pl)',Cloudability:'var(--cl)','All four':'var(--all)'};
const BUSINESS_FIELDS = ['inputs','description','outcome','who','where','cadence'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,el=document)=>el.querySelector(s);
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- review state (shared via db when available, local otherwise) ----------
const review = {statuses:{}, verdicts:{}, owners:{}, comments:{}};   // by element id
let db = null, dbReady = false, shared = false;
let lens = ls.get('lens','business');
let reviewer = ls.get('reviewer','');
const localReview = ls.get('review',{statuses:{},verdicts:{},owners:{},comments:{}});
Object.assign(review, localReview);

function reviewDocName(eid){ return eid; }
async function saveReview(eid, patch){
  const cur = Object.assign({}, review.statuses[eid]?{status:review.statuses[eid]}:{}, review.verdicts[eid]||{}, review.owners[eid]?{owner:review.owners[eid]}:{});
  const body = Object.assign(cur, patch, {by:reviewer||'anonymous', at:new Date().toISOString()});
  applyReviewDoc(eid, body);
  if(db){ try{ await db.doc('review/'+eid).set(body);}catch(e){ console.warn('db write failed',e); } }
  else { ls.set('review', review); }
  renderProgress(); refreshInline(eid);
}
function applyReviewDoc(eid, d){
  if(!d) return;
  if(d.status) review.statuses[eid]=d.status;
  if('verdict' in d) review.verdicts[eid]={verdict:d.verdict||'',note:d.note||'',by:d.by,at:d.at};
  if('owner' in d) review.owners[eid]=d.owner||'';
}
async function addComment(eid, attr, text){
  const c = {by:reviewer||'anonymous', at:new Date().toISOString(), attr:attr||'', text};
  const list = (review.comments[eid]||[]).concat([c]);
  review.comments[eid]=list;
  if(db){ try{ await db.doc('comments/'+eid).set({items:list}); }catch(e){ console.warn(e);} }
  else ls.set('review', review);

function refreshInline(eid){

}
function statusOf(l2){ return review.statuses[l2.eid]||'draft'; }
function counts(l2s){ const c={draft:0,review:0,changes:0,confirmed:0}; l2s.forEach(x=>c[statusOf(x)]++); return c; }
function barHTML(l0){

// ---------- db wiring ----------
async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    db = null; // extract: review marks stay in this browser
    if(!db) return;
    shared = true;
    db.collection('review').onSnapshot(snap=>{
      snap.docs.forEach(d=>applyReviewDoc(d.id, d.data()));
      dbReady = true; renderProgress(); softRender();
    }, e=>{ console.warn('review subscription ended', e); });
    db.collection('comments').onSnapshot(snap=>{
      snap.docs.forEach(d=>{ review.comments[d.id]=(d.data()||{}).items||[]; });
      softRender();
    }, e=>{ console.warn('comments subscription ended', e); });
    renderProgress();
  }catch(e){ console.warn('db unavailable', e); }
}

let pendingRender=false;
function softRender(){
  const ae=document.activeElement;
  if(ae && /textarea|input/i.test(ae.tagName) && ae.closest('#main')){ pendingRender=true; ae.addEventListener('blur',()=>{ if(pendingRender){pendingRender=false; softRender();} },{once:true}); return; }
  const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y});
}

// ---------- customer profile (one choice per design decision) ----------
// profile = {decisionKey: [optionId,...]}; unset decisions fall back to the register default.
let profile = ls.get('profile', {});
const variantView = {};   // `${l2.id}|${decisionKey}` -> optionId the reader is looking at
function activeOpts(key){ const d=DEC[key]; if(!d) return []; const p=profile[key]; return (p && p.length)? p.filter(o=>OPT(key,o)) : [d.default]; }
function profileSet(){ return Object.keys(profile).filter(k=>DEC[k] && profile[k] && profile[k].length); }
function matches(when){ if(!when) return true; return Object.entries(when).every(([k,opts])=>{ if(!profileSet().includes(k)) return true; /* unset decision: everything stays on-path */ const a=activeOpts(k); return !a.length || opts.some(o=>a.includes(o)); }); }
function onPath(l2){ return matches(l2.applies_when); }
function variantsOf(l2,key){ return (l2.variants||[]).filter(v=>v.decision===key); }
function activeVariant(l2,key){
  const vs=variantsOf(l2,key); if(!vs.length) return null;
  const want=variantView[l2.id+'|'+key];
  if(want){ const v=vs.find(x=>x.option===want); if(v) return v; }
  for(const o of activeOpts(key)){ const v=vs.find(x=>x.option===o); if(v) return v; }
  return vs.find(x=>x.option===DEC[key].default) || vs[0];
}
function effective(l2){
  // base record with the active variant of each decision merged over it
  const eff=Object.assign({}, l2); const over={};
  (l2.decisions||[]).forEach(k=>{ const v=activeVariant(l2,k); if(v){ Object.entries(v).forEach(([f,val])=>{ if(f!=='decision'&&f!=='option'){ eff[f]=val; over[f]=k; } }); } });
  eff._over=over; return eff;
}
function condText(when){ return Object.entries(when||{}).map(([k,opts])=>`${DEC[k]?DEC[k].name:k}: ${opts.map(o=>{const x=OPT(k,o);return x?x.name:o;}).join(' / ')}`).join('; '); }
function setProf(){ const n=profileSet().length; const el=$('#prof'); el.classList.toggle('set',n>0); el.innerHTML=`<i></i>Profile: <b>${n?n+' choice'+(n>1?'s':''):'default'}</b>`; }
function saveProfile(){ ls.set('profile',profile); setProf(); }
function rerenderKeep(){ const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y}); }

function prodChips(l2){ return l2.products.map(p=>`<span class="chip prod" data-p="${p}">${p}</span>`).join('') || `<span class="chip prod" data-p="${esc(l2.primary_product)}">${esc(l2.primary_product)}</span>`; }
function flowChips(l2){ return l2.flows.map(f=>`<a class="chip flow" href="#/flow/${f}" title="${esc(FLOW[f].title)}">${f} · ${esc(FLOW[f].name)}</a>`).join(''); }
function np(v){ return v? esc(v) : '<span class="np">Not provided</span>'; }
function link(id){ const l2=L2[id]; return l2?`<a href="#/l0/${l2.l0}/${id}" title="${esc(l2.name)}">${id}</a>`:esc(id); }
function crossref(text){ return esc(text).replace(/\b(\d\d\.\d\.\d)\b/g,(m)=>L2[m]?`<a href="#/l0/${L2[m].l0}/${m}">${m}</a>`:m); }

// ---------- record ----------
function approachRows(l2, eff){
  // one "Approach" row per design decision the record is bound to
  const rows=[];
  (l2.decisions||[]).forEach(k=>{
    const d=DEC[k]; if(!d) return;
    const vs=variantsOf(l2,k); const act=activeVariant(l2,k); const chosen=activeOpts(k);
    if(vs.length){
      const tabs=vs.map(v=>{ const o=OPT(k,v.option); return `<button type="button" data-variant="${l2.id}|${k}|${v.option}" aria-pressed="${act&&act.option===v.option}" class="${chosen.includes(v.option)?'chosen':''}" title="${esc(o?o.summary:'')}">${esc(o?o.name:v.option)}</button>`; }).join('');
      const vname = act && act.name && act.name!==l2.name ? `<p class="vname">Under this approach: <b>${esc(act.name)}</b></p>` : '';
      rows.push(`<div><dt>Approach</dt><dd><div class="tabs"><span class="dk"><a href="#/decisions/${k}" title="${esc(d.question)}">${d.id} ${esc(d.name)}</a></span>${tabs}</div>${vname}${sme()?`<span class="raw">✓ = chosen in the current profile. Fields marked with a green edge come from this approach; the rest are common to every approach.</span>`:''}</dd></div>`);
    } else {
      rows.push(`<div><dt>Approach</dt><dd><span class="cond">Shaped by <a href="#/decisions/${k}">${d.id} ${esc(d.name)}</a></span> <span style="font-size:12.5px;color:var(--ink2)">— ${esc(d.question)}</span></dd></div>`);
    }
  });
  if(l2.applies_when) rows.push(`<div><dt>Applies when</dt><dd><span class="cond">${esc(condText(l2.applies_when))}</span>${onPath(l2)?'':' <span style="font-size:12px;color:var(--s-review)">— not selected in the current profile</span>'}</dd></div>`);
  return rows;
}
const sme = ()=>lens==='sme';
function recordHTML(l2, opts={}){

  <p class="count">${rows.length} of ${ALL_L2.length} processes</p>
  <div class="batch"><span>${selected.size} selected</span><select id="batch-status" aria-label="Status to apply to selected">${Object.entries(STATUS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button id="batch-apply" ${selected.size?'':'disabled'}>Apply to selected</button><button id="batch-clear" ${selected.size?'':'disabled'}>Clear selection</button></div>
  <div class="tablewrap"><table class="reg${compact?' compact':''}"><thead><tr><th style="cursor:default"><input type="checkbox" id="selall" aria-label="Select all shown"></th><th style="cursor:default"></th>${th('id','ID')}${th('name','Process')}${th('l1','Group')}${th('primary_product','Product')}${th('cadence_bucket','Cadence')}<th style="cursor:default">Who</th><th style="cursor:default" title="Design decisions that shape this process; number = variants on record">Approaches</th>${th('status','Status')}</tr></thead><tbody>
  ${rows.map(x=>`<tr data-row="${x.id}"${onPath(x)?'':' class="off"'}><td><input type="checkbox" data-sel="${x.eid}"${selected.has(x.eid)?' checked':''} aria-label="Select ${x.id}"></td><td class="exp"><button data-expand="${x.id}" aria-expanded="${expanded.has(x.id)}" aria-label="Expand ${x.id}">${expanded.has(x.id)?'▾':'▸'}</button></td><td class="id"><a href="#/l0/${x.l0}/${x.id}">${x.id}</a></td><td>${esc(x.name)}</td><td style="font-size:12.5px;color:var(--ink2)">${x.l1} ${esc(L1[x.l1].name)}</td><td><div class="chips">${prodChips(x)}</div></td><td>${esc(x.cadence_bucket)}</td><td><div class="chips">${x.persona_list.slice(0,2).map(p=>`<span class="chip">${esc(p)}</span>`).join('')}${x.persona_list.length>2?`<span class="chip">+${x.persona_list.length-2}</span>`:''}</div></td><td><div class="chips">${(x.decisions||[]).map(k=>`<a class="chip flow" href="#/decisions/${k}" title="${esc(DEC[k].name)}">${DEC[k].id}${variantsOf(x,k).length?' · '+variantsOf(x,k).length:''}</a>`).join('')}${x.applies_when?`<span class="chip" title="${esc(condText(x.applies_when))}">conditional</span>`:''}</div></td><td><span class="status" data-s="${statusOf(x)}">${STATUS[statusOf(x)]}</span></td></tr>${expanded.has(x.id)?`<tr class="detail"><td colspan="10">${recordHTML(x)}</td></tr>`:''}`).join('')}
  </tbody></table></div>`;
}
function filtered(){
  const f=facetState;
  let rows = ALL_L2.filter(x=>
    (!f.l0 || f.l0.startsWith('L0-'+x.l0)) && (!f.product || x.products.includes(f.product)) && (!f.persona || x.persona_list.includes(f.persona)) &&
    (!f.cadence || x.cadence_bucket===f.cadence) && (!f.flow || x.flows.includes(f.flow)) && (!f.framework || x.framework_tags.includes(f.framework)) &&
    (!f.method || x.budgeting_method===f.method) && (!f.decision || (x.decisions||[]).some(k=>f.decision.startsWith(DEC[k].id+' '))) && (!f.status || STATUS[statusOf(x)]===f.status));
  const key = sortKey==='status'? x=>Object.keys(STATUS).indexOf(statusOf(x)) : sortKey==='l1'? x=>x.l1 : x=>x[sortKey];
  rows.sort((a,b)=>{const ka=key(a),kb=key(b);return (ka>kb?1:ka<kb?-1:0)*sortDir;});
  return rows;
}

// ---------- BPMN: layout, SVG rendering, BPMN 2.0 XML export ----------
const BP = {laneHead:150, colW:208, nodeW:162, taskH:74, laneBase:122, slotH:96, padX:28, evR:18, gwR:24};

function bpmnKind(type){
  const t=(type||'').toLowerCase();
  if(t.startsWith('start')) return t.includes('timer')?'startTimer':'start';
  if(t.startsWith('end')) return 'end';
  if(t.includes('gateway')) return t.includes('parallel')?'gwPar':'gwXor';
  if(t.startsWith('user')) return 'user';
  if(t.startsWith('service')) return 'service';
  if(t.startsWith('send')) return 'send';
  if(t.startsWith('sub')) return 'sub';
  return 'task';
}
function bpmnLayout(f){
  const lanes = f.lanes.slice();
  const laneIx = Object.fromEntries(lanes.map((l,i)=>[l,i]));
  const nodes=[], edges=[], byN={};
  let col=-1, group=null, prevStep=null; // group: {base, members:[]}
  const isBranch = n => /^[a-z]?\d+[a-z]$/.test(n);
  const baseOf = n => n.slice(0,-1);
  const slotUse = {}; // `${lane}|${col}` -> count
  const place = (node)=>{ const k=node.lane+'|'+node.col; node.slot=slotUse[k]||0; slotUse[k]=node.slot+1; };
  const steps = f.steps.slice();
  if(!/^start/i.test(steps[0].type)) steps.unshift({n:'',type:'Start event',lane:steps[0].lane,task:'',l2:[],implicit:true});
  if(!/^end/i.test(steps[steps.length-1].type)) steps.push({n:'',type:'End event',lane:steps[steps.length-1].lane,task:'',l2:[],implicit:true});
  steps.forEach((s,i)=>{
    const kind=bpmnKind(s.type);
    const node={id:s.implicit?('n_'+kind+'_implicit'):('n_'+s.n.replace(/[^\w]/g,'_')), n:s.n, kind, label:s.task, lane:laneIx[s.lane]??0, l2:s.l2, note:s.note||'', type:s.type, href:s.href||null};
    // v0.7: profile awareness — a step with `when`, or a group-diagram task whose L2 has applies_when, is off-path when the profile doesn't select it
    const cond = s.when || (s.l2 && s.l2.length===1 && L2[s.l2[0]] && L2[s.l2[0]].applies_when) || null;
    if(cond){ node.cond=cond; node.off=!matches(cond); }
    if(s.decision && DEC[s.decision]){ node.decision=DEC[s.decision]; node.note=(node.note?node.note+' — ':'')+DEC[s.decision].id+' '+DEC[s.decision].name+': '+DEC[s.decision].question; }
    if(isBranch(s.n) && byN[baseOf(s.n)]){
      if(!group || group.base!==baseOf(s.n)){ group={base:baseOf(s.n), members:[]}; col++; }
      node.col=col; group.members.push(node);
    } else {
      col++; node.col=col;
      if(group && group.members.length){ group.members.forEach(m=>edges.push({from:m.id,to:node.id})); group=null; }
      else if(prevStep){ const prev=prevStep; const e={from:prev.id,to:node.id}; if(prev.kind.startsWith('gw')) e.label=prev.yesLabel||'Yes'; edges.push(e); }
    }
    place(node); nodes.push(node); if(s.n) byN[s.n]=node; prevStep=node;
    if(isBranch(s.n) && byN[baseOf(s.n)]){
      const gw=byN[baseOf(s.n)]; const labels=gw.branchLabels||[]; edges.push({from:gw.id,to:node.id,label:labels[group.members.length-1]||''});
    }
    if(kind.startsWith('gw')){
      const m=node.note.match(/(?:^|;\s*)(Yes|No)\s*:\s*([^;]+)/gi)||[];
      const lab=m.map(x=>x.match(/^(?:;\s*)?(Yes|No)/i)[1]);
      node.branchLabels=lab;                       // order of appearance for suffix branches
      node.yesLabel='Yes';
      const endM=node.note.match(/No:\s*end event\s*'([^']+)'/i);
      if(endM){ const en={id:node.id+'_no', n:'', kind:'end', label:endM[1], lane:node.lane, col:node.col, l2:[], note:'', type:'End event', extra:true}; place(en); nodes.push(en); edges.push({from:node.id,to:en.id,label:'No'}); }
      const loopM=node.note.match(/loop to\s+([\w.]+)/i);
      if(loopM && byN[loopM[1]]) edges.push({from:node.id,to:byN[loopM[1]].id,label:'No',loop:true});
    }
  });
  // geometry
  const laneSlots = lanes.map((_,li)=>Math.max(1,...nodes.filter(n=>n.lane===li).map(n=>n.slot+1)));
  const laneH = laneSlots.map(s=>BP.laneBase+(s-1)*BP.slotH);
  const laneY = []; let y=0; laneH.forEach(h=>{laneY.push(y); y+=h;});
  const H=y, W=BP.laneHead+(col+1)*BP.colW+BP.padX;
  nodes.forEach(n=>{
    n.cx = BP.laneHead + BP.padX + n.col*BP.colW + BP.nodeW/2;
    n.cy = laneY[n.lane] + BP.laneBase/2 + n.slot*BP.slotH;
    if(n.kind==='start'||n.kind==='startTimer'||n.kind==='end'){ n.w=BP.evR*2; n.h=BP.evR*2; }
    else if(n.kind.startsWith('gw')){ n.w=BP.gwR*2; n.h=BP.gwR*2; }
    else { n.w=BP.nodeW; n.h=BP.taskH; }
    n.x=n.cx-n.w/2; n.y=n.cy-n.h/2;
  });
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  edges.forEach(e=>{
    const a=byId[e.from], b=byId[e.to]; const pts=[];
    if(e.loop){ // route below source lane row back to target
      const yb = Math.max(a.y+a.h, b.y+b.h) + 18;
      pts.push([a.cx,a.y+a.h],[a.cx,yb],[b.cx,yb],[b.cx,b.y+b.h]);
    } else if(b.col===a.col){ // vertical drop (extra end event under a gateway)
      pts.push([a.cx,a.y+a.h],[a.cx,b.y]);
    } else if(Math.abs(a.cy-b.cy)<1){ pts.push([a.x+a.w,a.cy],[b.x,b.cy]); }
    else { const mx=a.x+a.w+(b.x-(a.x+a.w))/2; pts.push([a.x+a.w,a.cy],[mx,a.cy],[mx,b.cy],[b.x,b.cy]); }
    e.pts=pts;
  });
  return {lanes,laneY,laneH,nodes,edges,W,H,byId};
}
function wrapText(s, maxChars, maxLines){
  const words=String(s).split(/\s+/), lines=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxChars && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ lines.length=maxLines; lines[maxLines-1]=lines[maxLines-1].replace(/.{2}$/,'')+'…'; }
  return lines;
}
function bpmnIcon(kind,x,y){

  if(kind==='user') return `<g transform="translate(${x},${y})" ${c}><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g>`;
  if(kind==='service') return `<g transform="translate(${x},${y})" ${c}><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="6" r="5.2" stroke-dasharray="2 1.6"/></g>`;
  if(kind==='send') return `<g transform="translate(${x},${y})"><rect width="13" height="9" rx="1" fill="currentColor"/><path d="M0.5 1l6 4.5 6-4.5" stroke="var(--surface)" stroke-width="1.2" fill="none"/></g>`;
  return '';
}
function bpmnSVG(f, laneColor){
  const L=bpmnLayout(f);
  const laneEls = L.lanes.map((name,i)=>{
    const y=L.laneY[i], h=L.laneH[i], lines=wrapText(name,18,3);
    return `<g><rect x="0" y="${y}" width="${L.W}" height="${h}" fill="${i%2?'var(--surface2)':'var(--surface)'}" stroke="currentColor" stroke-opacity=".35"/>
      <rect x="0" y="${y}" width="6" height="${h}" fill="${laneColor[name]||'currentColor'}"/>
      <text x="${BP.laneHead/2+3}" y="${y+h/2-(lines.length-1)*7}" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">${lines.map((t,k)=>`<tspan x="${BP.laneHead/2+3}" dy="${k?14:0}">${esc(t)}</tspan>`).join('')}</text>
      <line x1="${BP.laneHead}" y1="${y}" x2="${BP.laneHead}" y2="${y+h}" stroke="currentColor" stroke-opacity=".35"/>${L.nodes.some(n=>n.lane===i)?'':`<text x="${BP.laneHead+BP.padX}" y="${y+h/2+4}" font-size="11" font-style="italic" fill="currentColor" fill-opacity=".55">Receiving system — no catalog step modeled in this lane</text>`}</g>`;
  }).join('');
  const nodeEls = L.nodes.map(n=>{
    const href = n.href || (n.l2 && n.l2.length && L2[n.l2[0]] ? `#/l0/${L2[n.l2[0]].l0}/${n.l2[0]}` : null);
    let body='';
    const title=`<title>${esc((n.n?n.n+' · ':'')+n.label+(n.type?' ('+n.type+')':''))}${n.note?esc(' — '+n.note):''}</title>`;
    if(n.kind==='start'||n.kind==='startTimer'||n.kind==='end'){
      const thick=n.kind==='end'?3:1.5;
      body=`<circle cx="${n.cx}" cy="${n.cy}" r="${BP.evR}" fill="var(--ground)" stroke="currentColor" stroke-width="${thick}"/>`;
      if(n.kind==='startTimer') body+=`<circle cx="${n.cx}" cy="${n.cy}" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M${n.cx} ${n.cy-7}v7h5" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
      const lines=wrapText(n.label,22,2);
      body+=`<text x="${n.cx}" y="${n.cy+BP.evR+13}" text-anchor="middle" font-size="10.5" fill="currentColor">${lines.map((t,k)=>`<tspan x="${n.cx}" dy="${k?12:0}">${esc(t)}</tspan>`).join('')}</text>`;
    } else if(n.kind.startsWith('gw')){

      const lines=wrapText(n.label,24,2);
      body+=`<text x="${n.cx}" y="${n.cy-r-8-(lines.length-1)*12}" text-anchor="middle" font-size="10.5" font-weight="600" fill="currentColor">${lines.map((t,k)=>`<tspan x="${n.cx}" dy="${k?12:0}">${esc(t)}</tspan>`).join('')}</text>`;
      body+=`<text x="${n.cx+r+4}" y="${n.cy+r+2}" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="var(--mono)">${esc(n.n)}</text>`;
    } else {
      const lines=wrapText(n.label,26,3);
      body=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="var(--ground)" stroke="currentColor" stroke-width="${n.kind==='sub'?2.2:1.5}"/>`;
      if(n.kind==='sub') body+=`<rect x="${n.cx-6}" y="${n.y+n.h-14}" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M${n.cx-3} ${n.y+n.h-8}h6M${n.cx} ${n.y+n.h-11}v6" stroke="currentColor" stroke-width="1.2"/>`;
      if(n.kind==='send') body+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" transform="translate(3,3)" opacity=".5"/>`;
      body+=bpmnIcon(n.kind,n.x+8,n.y+7);
      body+=`<text x="${n.x+n.w-7}" y="${n.y+13}" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="var(--mono)">${esc(n.n)}${/ADM/.test(n.type)?' · ADM':''}</text>`;
      const ty=n.y+18+(n.h-18)/2+4-(lines.length-1)*6.5;
      body+=`<text x="${n.cx}" y="${ty}" text-anchor="middle" font-size="10.5" fill="currentColor">${lines.map((t,k)=>`<tspan x="${n.cx}" dy="${k?13:0}">${esc(t)}</tspan>`).join('')}</text>`;

      else { lx=e.pts[2][0]+6; ly=e.pts[2][1]-6; }
      lab=`<text x="${lx}" y="${ly}" font-size="10" font-weight="600" fill="currentColor" text-anchor="${anchor}">${esc(e.label)}</text>`; }
    const off=(L.byId[e.to]&&L.byId[e.to].off)||(L.byId[e.from]&&L.byId[e.from].off);
    return `<g${off?' opacity=".32"':''}><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#bp-arrow-${f.id})"/>${lab}</g>`;
  }).join('');
  const aria=`BPMN swimlane diagram of ${f.kind?'':'flow '}${f.kind?f.name:f.id+' '+f.name}: ${L.lanes.length} lanes, ${f.steps.length} steps`;
  const what = f.kind==='l1' ? `Process group ${esc(f.name)} as BPMN 2.0: one lane per persona from the area's default lanes, one task per L2 process in catalog order (person icon = user task, dashed gear = service task, envelope = send task). Click a task to jump to its record.`
             : f.kind==='l0' ? `Area ${esc(f.name)} as BPMN 2.0: each box is a collapsed sub-process (one per process group) placed in the lane of the persona that performs most of its work. Click a box to jump to that group.`
             : `${esc(f.id)} as BPMN 2.0: pool "${esc(f.title)}", one lane per system or role, steps left to right. Rounded boxes are tasks (person icon = user task, dashed gear = service task, envelope = send task across the ADM data highway), diamonds are exclusive gateways, thin circles start the flow and thick circles end it. Click any task to open the catalog process it invokes.`;
  return `<figure class="bpmn"><div class="bpmn-scroll"><svg viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" role="img" aria-label="${esc(aria)}" style="font-family:var(--sans)">
    <defs><marker id="bp-arrow-${f.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
    ${laneEls}${edgeEls}${nodeEls}</svg></div>
    <figcaption>${what}</figcaption></figure>`;
}

const LANE_PAL=['var(--pl)','var(--tp)','var(--co)','var(--cl)','var(--all)'];

}

function decisionsHTML(){

    const chosen = activeOpts(d.key); const set = profileSet().includes(d.key);
    const mark = id => { const l2=L2[id]; if(!l2) return esc(id); const cls = variantsOf(l2,d.key).length?'v':(l2.applies_when&&l2.applies_when[d.key]?'c':''); const t = cls==='v'?`${variantsOf(l2,d.key).length} variants on record`:cls==='c'?`only under ${condText({[d.key]:l2.applies_when[d.key]})}`:'listed as affected'; return `<a class="${cls}" href="#/l0/${l2.l0}/${id}" title="${esc(l2.name)} — ${esc(t)}">${id}</a>`; };
    const opts = d.options.map(o=>`<label class="opt${chosen.includes(o.id)?' on':''}"><input type="${d.multi?'checkbox':'radio'}" name="prof-${d.key}" value="${o.id}" data-profile="${d.key}"${chosen.includes(o.id)?' checked':''} aria-label="${esc(o.name)}"><div><div class="on-name">${esc(o.name)}${o.id===d.default?'<span class="def">catalog default</span>':''}</div><div class="os">${crossref(o.summary)}</div><div class="of"><b>Fits:</b> ${crossref(o.fit)}</div>${smeL?`<div class="of"><b>Prerequisites:</b> ${crossref(o.prereqs)}</div><div class="of"><b>Trade-offs:</b> ${crossref(o.tradeoffs)}</div><div class="of"><b>Evidence:</b> ${esc(o.evidence)}</div>`:''}</div></label>`).join('');
    return `<section class="deccard" id="${d.key}" aria-labelledby="dh-${d.key}">
      <div class="dh"><span class="id">${d.id}</span><h2 id="dh-${d.key}">${esc(d.name)}</h2><span class="chip">${esc(d.domain)}</span>${d.multi?'<span class="chip" title="A customer can select more than one option, e.g. per team kind or decision unit">pick one or more</span>':'<span class="chip">pick one</span>'}${set?'<span class="status" data-s="confirmed">set in profile</span>':'<span class="status" data-s="draft">default</span>'}</div>
      <p class="q">${esc(d.question)}</p>
      <p class="why">${crossref(d.why)}</p>
      <div class="opts">${opts}</div>
      <div class="aff"><span>Shapes:</span>${d.affects.map(mark).join('')}${d.flows.length?`<span style="margin-left:8px">Flows:</span>${d.flows.map(f=>`<a class="chip flow" href="#/flow/${f}">${f}</a>`).join('')}`:''}${d.related.length?`<span style="margin-left:8px">Related:</span>${d.related.map(k=>`<a href="#/decisions/${k}" style="font-family:var(--sans)">${DEC[k]?DEC[k].id+' '+esc(DEC[k].name):k}</a>`).join('')}`:''}</div>
      <p style="font-size:11.5px;color:var(--ink3);margin:8px 0 0">Solid outline = the process has a variant per option · dashed = the process only exists under some options · plain = listed as affected, no variant text yet.</p>
    </section>`;
  };
  return `<div class="pagehead"><div><p class="eyebrow">Design decisions · v${DATA.version}</p><h1>Decisions &amp; customer profile</h1><p class="lede">A customer makes each of these choices once — usually in discovery — and the choice ripples through several processes and flows. Pick the options that match a customer and the whole catalog renders for that profile: records open on the matching approach, processes that do not apply under the chosen options are dimmed, and off-path steps fade on the diagrams. Decisions you have not set stay neutral — every process and step remains on the path — and nothing is ever filtered away, so the alternatives stay one click away.</p></div>
  <div class="statlist"><div class="stat"><b>${DECISIONS.length}</b><span>decisions</span></div><div class="stat"><b>${DECISIONS.reduce((a,d)=>a+d.options.length,0)}</b><span>options</span></div><div class="stat"><b>${ALL_L2.reduce((a,x)=>a+(x.variants||[]).length,0)}</b><span>variants</span></div><div class="stat"><b>${ALL_L2.filter(x=>x.decisions).length}</b><span>processes shaped</span></div></div></div>
  <div class="profbar"><b>Profile:</b> ${n?`${n} of ${DECISIONS.length} decisions set`:'catalog defaults'} <span style="flex:1"></span><button type="button" data-profile-copy>Copy profile as JSON</button><button type="button" data-profile-paste>Paste profile</button><button type="button" data-profile-reset${n?'':' disabled'}>Reset to defaults</button></div>
  <nav class="decnav" aria-label="Decisions">${summary}</nav>
  ${DECISIONS.map(card).join('')}`;

// ---------- routing ----------
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(!parts.length) return {page:'hub'};
  if(parts[0]==='l0' && L0[parts[1]]) return {page:'l0', l0:L0[parts[1]], target:parts[2]||null};
  if(parts[0]==='register') return {page:'register'};
  if(parts[0]==='flow' && FLOW[parts[1]]) return {page:'flow', flow:FLOW[parts[1]]};
  if(parts[0]==='decisions') return {page:'decisions', target:parts[1]||null};
  if(parts[0]==='glossary') return {page:'glossary'};
  if(parts[0]==='diagrams') return {page:'diagrams'};
  if(parts[0]==='changelog') return {page:'changelog'};
  if(parts[0]==='print') return {page:'print'};
  return {page:'hub'};
}
let lastKey='', suppressScroll=false;
function render(){
  const r = route();
  const main = $('#main');
  main.className = 'page' + (r.page==='register'?' wide':'');
  let crumbs = `<a href="#/">Extract</a>`;
  let title = 'Apptio Process Catalog';
  if(r.page==='hub'){ main.innerHTML = hubHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Landscape</span>`; }
  else if(r.page==='l0'){
    main.innerHTML = l0HTML(r.l0, r.target);
    crumbs += ` <span class="sep">/</span> <a href="#/l0/${r.l0.id}"><span class="id">L0-${r.l0.id}</span> ${esc(r.l0.short)}</a>`;
    if(r.target && L2[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L2[r.target].name)}</span>`;
    else if(r.target && L1[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L1[r.target].name)}</span>`;
    title = `L0-${r.l0.id} ${r.l0.name}`;
    const key = r.l0.id+'/'+(r.target||'');
    if(r.target && key!==lastKey && !suppressScroll){ const el = document.getElementById((L2[r.target]?'rec-':'g-')+r.target+(L2[r.target]?'':'-sec')); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:'start'})); }
    lastKey = key; setupSpy();
  }
  else if(r.page==='register'){ main.innerHTML = registerHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Register</span>`; title='Register'; }
  else if(r.page==='flow'){ main.innerHTML = flowHTML(r.flow); crumbs += ` <span class="sep">/</span> <span>Flows</span> <span class="sep">/</span> <span class="here"><span class="id">${r.flow.id}</span> ${esc(r.flow.name)}</span>`; title=r.flow.id+' '+r.flow.name; }
  else if(r.page==='diagrams'){ main.innerHTML = diagramsHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Diagrams</span>`; title='Diagrams'; }
  else if(r.page==='decisions'){ main.innerHTML = decisionsHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Decisions</span>`; title='Decisions';
    const key = r.page+'/'+(r.target||'');
    if(r.target && DEC[r.target] && key!==lastKey && !suppressScroll){ const el=document.getElementById(r.target); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:'start'})); }
    else if(!r.target && key!==lastKey && !suppressScroll) window.scrollTo({top:0});
    lastKey = key; $('#crumbs').innerHTML = crumbs; document.title = title+' · '+DATA.extract.title; return; }
  else if(r.page==='glossary'){ main.innerHTML = glossaryHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Glossary</span>`; }
  else if(r.page==='changelog'){ main.innerHTML = changelogHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Changelog</span>`; }
  else if(r.page==='print'){ main.innerHTML = printHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Print view</span>`; }
  $('#crumbs').innerHTML = crumbs;
  document.title = title + ' · '+DATA.extract.title;
  if(r.page!=='l0') { lastKey=''; if(!suppressScroll) window.scrollTo({top:0}); }
}
let spyObs=null;
function setupSpy(){
  if(spyObs) spyObs.disconnect();
  const links = [...document.querySelectorAll('.rail a[data-spy]')];
  if(!links.length) return;
  const byId = Object.fromEntries(links.map(a=>[a.dataset.spy,a]));
  spyObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.remove('on')); const a=byId[e.target.id]; if(a){a.classList.add('on'); } } });
  },{rootMargin:'-70px 0px -70% 0px',threshold:0});
  links.forEach(a=>{const el=document.getElementById(a.dataset.spy); if(el) spyObs.observe(el);});
}

// ---------- search ----------
const INDEX = ALL_L2.map(x=>({id:x.id,eid:x.eid,l0:x.l0,name:x.name,text:(x.id+' '+x.eid+' '+x.name+' '+x.description+' '+(x.config||'')+' '+(x.personas||'')+' '+x.tool+' '+(x.evidence||'')).toLowerCase()}))
  .concat(FLOWS.map(f=>({flow:f.id,name:f.id+' · '+f.name+' — '+f.title,text:(f.id+' '+f.name+' '+f.title+' '+f.summary).toLowerCase()})))
  .concat(Object.values(L1).map(g=>({g:g.id,l0:g.l0,name:g.id+' '+g.name,text:(g.id+' '+g.eid+' '+g.name+' '+(g.original_name||'')).toLowerCase()})))
  .concat(DECISIONS.map(d=>({dec:d.key,name:d.id+' · '+d.name+' — '+d.question,text:(d.id+' '+d.key+' '+d.name+' '+d.question+' '+d.domain+' '+d.options.map(o=>o.id+' '+o.name+' '+o.summary+' '+o.fit).join(' ')).toLowerCase()})));
// variant text is searchable through its parent record
INDEX.forEach(i=>{ if(i.id && L2[i.id] && L2[i.id].variants) i.text += ' ' + L2[i.id].variants.map(v=>(v.name||'')+' '+(v.description||'')+' '+(v.config||'')).join(' ').toLowerCase(); });
let qActive=-1;
function doSearch(){
  const q=$('#q').value.trim().toLowerCase(); const box=$('#qres');
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const terms=q.split(/\s+/);
  const hits=INDEX.filter(i=>terms.every(t=>i.text.includes(t))).slice(0,12);
  box.innerHTML = hits.length? hits.map(h=>h.flow?`<a href="#/flow/${h.flow}"><span class="k">FLOW</span>${esc(h.name)}</a>`:h.dec?`<a href="#/decisions/${h.dec}"><span class="k">DECISION</span>${esc(h.name)}</a>`:h.g?`<a href="#/l0/${h.l0}/${h.g}"><span class="k">GROUP</span>${esc(h.name)}</a>`:`<a href="#/l0/${h.l0}/${h.id}"><span class="k">${h.id}</span>${esc(h.name)}</a>`).join('') : '<a href="#/register">No matches — open the register</a>';
  box.hidden=false; qActive=-1;
}

// ---------- events ----------
document.addEventListener('input', e=>{
  if(e.target.id==='q') doSearch();
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='q'){ const items=[...$('#qres').querySelectorAll('a')]; if(!items.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); qActive=Math.min(items.length-1,qActive+1); } else if(e.key==='ArrowUp'){ e.preventDefault(); qActive=Math.max(0,qActive-1); }
    else if(e.key==='Enter'){ e.preventDefault(); (items[qActive]||items[0]).click(); $('#qres').hidden=true; $('#q').value=''; return; } else if(e.key==='Escape'){ $('#qres').hidden=true; return; }
    items.forEach((a,i)=>a.classList.toggle('active',i===qActive)); }
  if(e.key==='/' && !/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); $('#q').focus(); }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.search')) $('#qres').hidden=true;
  const a=e.target.closest('#qres a'); if(a){ $('#qres').hidden=true; $('#q').value=''; }
  if(e.target.id==='lens-business'||e.target.id==='lens-sme'){ lens=e.target.id==='lens-sme'?'sme':'business'; ls.set('lens',lens); setLens(); render(); }
  if(e.target.closest('#who')){ const n=prompt('Your name, as it should appear on statuses, verdicts and comments:', reviewer||''); if(n!=null){ reviewer=n.trim(); ls.set('reviewer',reviewer); setWho(); } }
  const ex=e.target.closest('[data-expand]'); if(ex){ const id=ex.dataset.expand; expanded.has(id)?expanded.delete(id):expanded.add(id); render(); }
  const th=e.target.closest('th[data-sort]'); if(th){ const k=th.dataset.sort; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} render(); }
  const uf=e.target.closest('[data-unfacet]'); if(uf){ facetState[uf.dataset.unfacet]=''; render(); }
  if(e.target.closest('[data-clearfacets]')){ Object.keys(facetState).forEach(k=>facetState[k]=''); render(); }
  if(e.target.id==='batch-apply'){ const s=$('#batch-status').value; [...selected].forEach(eid=>saveReview(eid,{status:s})); selected.clear(); render(); }
  if(e.target.id==='batch-clear'){ selected.clear(); render(); }
  const vt=e.target.closest('[data-variant]'); if(vt){ const [id,k,o]=vt.dataset.variant.split('|'); variantView[id+'|'+k]=o; const l2=L2[id]; if(l2){ const holder=vt.closest('article.record'); if(holder){ const fresh=document.createElement('div'); fresh.innerHTML=recordHTML(l2,{target:holder.classList.contains('target')}); holder.replaceWith(fresh.firstElementChild); } } }
  if(e.target.closest('[data-profile-reset]')){ profile={}; saveProfile(); rerenderKeep(); }
  if(e.target.closest('[data-profile-copy]')){ const b=e.target.closest('[data-profile-copy]'); const txt=JSON.stringify(Object.fromEntries(DECISIONS.map(d=>[d.key,activeOpts(d.key)])),null,1); const done=()=>{ b.textContent='Copied'; setTimeout(()=>b.textContent='Copy profile as JSON',1500); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>prompt('Profile JSON:',txt)); else prompt('Profile JSON:',txt); }
  if(e.target.closest('[data-profile-paste]')){ const s=prompt('Paste a profile JSON ({"decision-key":["option-id"], ...}):',''); if(s){ try{ const p=JSON.parse(s); const next={}; Object.entries(p).forEach(([k,v])=>{ if(DEC[k]){ const arr=(Array.isArray(v)?v:[v]).filter(o=>OPT(k,o)); if(arr.length) next[k]=DEC[k].multi?arr:[arr[0]]; } }); profile=next; saveProfile(); rerenderKeep(); }catch(_){ alert('That was not valid profile JSON.'); } } }
  const cb=e.target.closest('[data-copy-bpmn]'); if(cb){ const ta=document.getElementById('bpmn-xml-'+cb.dataset.copyBpmn); if(!ta.hidden) ta.select(); const done=()=>{ cb.textContent='Copied'; setTimeout(()=>cb.textContent='Copy XML',1500); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done,()=>{ try{document.execCommand('copy'); done();}catch(_){} }); else { const tmp=document.createElement('textarea'); tmp.value=ta.value; document.body.appendChild(tmp); tmp.select(); try{document.execCommand('copy'); done();}catch(_){} tmp.remove(); } }
});
document.addEventListener('toggle', e=>{ if(e.target.classList&&e.target.classList.contains('gdiag')) ls.set('diagClosed', !e.target.open); }, true);
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.setStatus){ saveReview(t.dataset.setStatus,{status:t.value}); }
  if(t.dataset.verdict){ saveReview(t.dataset.verdict,{verdict:t.value}); }
  if(t.dataset.owner!==undefined){ saveReview(t.dataset.owner,{owner:t.value}); }
  if(t.dataset.facet!==undefined){ facetState[t.dataset.facet]=t.value; render(); }
  if(t.dataset.profile){ const k=t.dataset.profile, d=DEC[k]; if(d){
      if(d.multi){ const cur=new Set(activeOpts(k)); t.checked?cur.add(t.value):cur.delete(t.value); profile[k]=[...cur].filter(o=>OPT(k,o)); if(!profile[k].length) delete profile[k]; }
      else profile[k]=[t.value];
      if(profile[k] && profile[k].length===1 && profile[k][0]===d.default && !d.multi) { /* keep explicit choice even if it equals the default */ }
      saveProfile(); rerenderKeep(); } }
  if(t.id==='compact'){ compact=t.checked; render(); }
  if(t.dataset.sel){ t.checked?selected.add(t.dataset.sel):selected.delete(t.dataset.sel); render(); }
  if(t.id==='selall'){ filtered().forEach(x=>t.checked?selected.add(x.eid):selected.delete(x.eid)); render(); }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('form[data-comment]'); if(!f) return; e.preventDefault();
  const text=f.text.value.trim(); if(!text) return;
  if(!reviewer){ const n=prompt('Your name for this comment:',''); if(n==null) return; reviewer=n.trim(); ls.set('reviewer',reviewer); setWho(); }
  addComment(f.dataset.comment, f.attr.value, text); f.text.value='';
});
window.addEventListener('hashchange', render);
function setLens(){ $('#lens-business').setAttribute('aria-pressed', lens==='business'); $('#lens-sme').setAttribute('aria-pressed', lens==='sme'); }
function setWho(){ $('#who').innerHTML='Reviewing as <b>'+esc(reviewer||'—')+'</b>'; }

setLens(); setWho(); setProf(); renderProgress(); render(); initDb();
})();
</script>

</body></html>
