5"/><rect x="597.0" y="27.0" width="162" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/><g transform="translate(602.0,31.0)"><rect width="13" height="9" rx="1" fill="currentColor"/><path d="M0.5 1l6 4.5 6-4.5" class="env" stroke="#fff" stroke-width="1.2" fill="none"/></g><text x="749.0" y="37.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">15 · ADM</text><text x="675.0" y="61.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="675.0" dy="0">Send workforce &amp; completed</tspan><tspan x="675.0" dy="13">work data to Costing (TBM</tspan><tspan x="675.0" dy="13">Studio)</tspan></text></g><g class="bn"><title>16 · Calculate monthly team cost &amp; blended CapEx % (protected rates) (Service task)</title><rect x="802.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><g transform="translate(810.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="6" r="5.2" stroke-dasharray="2 1.6"/></g><text x="957.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">16</text><text x="883.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="883.0" dy="0">Calculate monthly team</tspan><tspan x="883.0" dy="13">cost &amp; blended CapEx %</tspan><tspan x="883.0" dy="13">(protected rates)</tspan></text></g><g class="bn"><title>17 · Team work visible? (XOR gateway) — Yes: story-point allocation; No: fixed-capacity — D-01 Labor effort signal: How is labor effort captured and attached to work so it can be costed, capitalized and rolled into App TCO?</title><path d="M1091.0 159.0L1115.0 183.0L1091.0 207.0L1067.0 183.0Z" class="gw" stroke="currentColor" stroke-width="1.5"/><path d="M1084.0 176.0l14 14M1098.0 176.0l-14 14" stroke="currentColor" stroke-width="2.2"/><text x="1091.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="currentColor"><tspan x="1091.0" dy="0">Team work visible?</tspan></text><text x="1119.0" y="209.0" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">17</text><text x="1091.0" y="221.0" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1F5F4A" font-family="monospace">D-01</text></g><g class="bn"><title>17a · Allocate team costs to completed work (story points, weightage) (Task) — Same allocation principles as TBM — Only when Labor effort signal: Cost per story point / Cost per completed work item / Timesheets (hours x rate) / Planned work-effort units (allocation-based)</title><rect x="1218.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><text x="1373.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">17a</text><text x="1299.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1299.0" dy="0">Allocate team costs to</tspan><tspan x="1299.0" dy="13">completed work (story</tspan><tspan x="1299.0" dy="13">points, weightage)</tspan></text></g><g class="bn"><title>17b · Allocate team costs to IT towers / apps (fixed capacity) (Task) — Ops teams without visible backlog (e.g. ServiceNow) — Only when Labor effort signal: Fixed capacity (team to tower/app)</title><rect x="1218.0" y="242.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><text x="1373.0" y="255.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">17b</text><text x="1299.0" y="279.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1299.0" dy="0">Allocate team costs to IT</tspan><tspan x="1299.0" dy="13">towers / apps (fixed</tspan><tspan x="1299.0" dy="13">capacity)</tspan></text></g><g class="bn"><title>18 · Generate SAP-ready monthly actuals - CapEx / OpEx by user (Service task) — Deprecates time writing; join gateway before this step</title><rect x="1426.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><g transform="translate(1434.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="6" r="5.2" stroke-dasharray="2 1.6"/></g><text x="1581.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">18</text><text x="1507.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1507.0" dy="0">Generate SAP-ready monthly</tspan><tspan x="1507.0" dy="13">actuals - CapEx / OpEx by</tspan><tspan x="1507.0" dy="13">user</tspan></text></g><g class="bn"><title> (End event)</title><circle cx="1715.0" cy="183.0" r="18" class="ground" stroke="currentColor" stroke-width="3"/><text x="1715.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor"></text></g></svg>