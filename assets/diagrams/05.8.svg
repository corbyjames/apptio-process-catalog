ct base &amp; activity inventory (User task) — Outcome: activity inventory with unit costs and drivers per decision unit; redundancy list; &#x27;zero-base&#x27; floor per unit — Only when Budget build method: Zero-based - rotational / Zero-based - all units annually / Zero-based mindset (continuous)</title><rect x="594.0" y="24.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><g transform="translate(602.0,31.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="749.0" y="37.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">05.8.2</text><text x="675.0" y="67.5" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="675.0" dy="0">Build the cost-driver fact</tspan><tspan x="675.0" dy="13">base &amp; activity inventory</tspan></text></g><g class="bn"><title>05.8.3 · Build decision packages at tiered service levels (User task) — Outcome: decision packages (3 tiers) per decision unit with costs, drivers, KPIs and justification — Only when Budget build method: Zero-based - rotational / Zero-based - all units annually</title><rect x="802.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><g transform="translate(810.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="957.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">05.8.3</text><text x="883.0" y="189.5" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="883.0" dy="0">Build decision packages at</tspan><tspan x="883.0" dy="13">tiered service levels</tspan></text></g><g class="bn"><title>05.8.4 · Rank packages &amp; set the funding cut-line (User task) — Outcome: ranked package list, cut-line scenario, freed-spend figure, unfunded-package register — Only when Budget build method: Zero-based - rotational / Zero-based - all units annually</title><rect x="1010.0" y="390.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><g transform="translate(1018.0,397.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="1165.0" y="403.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">05.8.4</text><text x="1091.0" y="433.5" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1091.0" dy="0">Rank packages &amp; set the</tspan><tspan x="1091.0" dy="13">funding cut-line</tspan></text></g><g class="bn"><title>05.8.5 · Approve zero-based budget &amp; release freed spend to the investment envelope (User task) — Outcome: approved zero-based budget merged into budget of record; revised portfolio targets to ATP; savings baseline — Only when Budget build method: Zero-based - rotational / Zero-based - all units annually</title><rect x="1218.0" y="390.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><g transform="translate(1226.0,397.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="1373.0" y="403.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">05.8.5</text><text x="1299.0" y="427.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1299.0" dy="0">Approve zero-based budget</tspan><tspan x="1299.0" dy="13">&amp; release freed spend to</tspan><tspan x="1299.0" dy="13">the investment envelope</tspan></text></g><g class="bn"><title>05.8.6 · Monitor package commitments &amp; sustain the zero-based mindset (Task) — Outcome: savings-realization tracker, leakage exceptions, incentives/scorecard inputs, next-cycle rotation candidates — Only when Budget build method: Zero-based - rotational / Zero-based - all units annually / Zero-based mindset (continuous) — 2 approaches on record</title><rect x="1426.0" y="268.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/><text x="1581.0" y="336.0" text-anchor="end" font-size="8.5" fill="#1F5F4A" font-family="monospace">2 approaches</text><text x="1581.0" y="281.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">05.8.6</text><text x="1507.0" y="305.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1507.0" dy="0">Monitor package</tspan><tspan x="1507.0" dy="13">commitments &amp; sustain the</tspan><tspan x="1507.0" dy="13">zero-based mindset</tspan></text></g><g class="bn"><title> (End event)</title><circle cx="1715.0" cy="305.0" r="18" class="ground" stroke="currentColor" stroke-width="3"/><text x="1715.0" y="336.0" text-anchor="middle" font-size="10.5" fill="currentColor"></text></g></svg>