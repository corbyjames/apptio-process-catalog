# L0 process areas — edit here; docs/diagrams/dashboard are regenerated by CI.
'01':
  name: Strategy & Goal Management
  desc: Define enterprise strategy and cascade it as measurable objectives so every portfolio, program and team
    has line of sight from work to strategic intent.
  primary: Targetprocess
  frameworks: 'SPM: Strategic Planning | SAFe: Strategic Themes, OKRs | TBM: Business-Aligned Portfolio'
  lanes: C-Suite/Strategy; Portfolio Management; Finance
'02':
  name: Demand & Portfolio Investment Management
  desc: Capture all demand into one funnel, qualify and prioritize it against strategy and capacity, fund the winning
    investments, and manage the portfolio roadmap and its value realization.
  primary: Targetprocess
  frameworks: 'SPM: Demand Intake, Portfolio Mgmt, Financial Mgmt | SAFe: LPM, Portfolio Kanban, WSJF | TBM: Investment
    in Innovation'
  lanes: Requesters/Business; Portfolio Management; PMO; Finance
'03':
  name: Agile Program & Delivery Management
  desc: Plan and execute work on a PI and iteration cadence across ARTs, solution trains and teams, including hybrid/waterfall
    delivery, release management and value stream flow.
  primary: Targetprocess
  frameworks: 'SPM: Portfolio Mgmt | SAFe: PI Planning, ART, VSM | EAP'
  lanes: RTE/Program; Agile Teams; Product Management; Dev tools (Jira/ADO)
'04':
  name: Workforce & Resource Management
  desc: Maintain the workforce baseline (people, teams, involvements, job profiles), plan capacity against demand,
    allocate resources to work, govern position requests, and track time.
  primary: Targetprocess
  supporting: Planning, Costing
  frameworks: 'SPM: Workforce/Resource Mgmt (WFM) | TBM: Internal/External Labor cost pools'
  lanes: Resource Management; Portfolio Management; HR/Approvers; Finance (IT Planning)
'05':
  name: IT Financial Planning & Budgeting
  desc: Build the annual IT budget and rolling forecasts on the TBM taxonomy - labor, contracts, assets and investments
    - manage variance, and publish targets that drive portfolio behavior.
  primary: Planning
  supporting: Costing, Targetprocess
  frameworks: 'TBM: Plan & Govern | ITFM: budgeting, forecasting, variance | FinOps: Budgeting/Forecasting (intersect)'
  lanes: IT Finance; Budget Owners; FP&A; CIO
'06':
  name: Cost Transparency & TBM Operations
  desc: 'Run the monthly TBM engine: ingest actuals, allocate costs through cost pools and towers to applications,
    services and business units, cost labor defensibly, and analyze TCO.'
  primary: Costing
  supporting: Planning, Targetprocess, Cloudability
  frameworks: 'TBM: Cost Transparency, taxonomy (ATUM) | ITFM | FinOps: Allocation (intersect)'
  lanes: TBM Office/IT Finance; Costing Admin; App/Service Owners; ERP-GL
'07':
  name: Cloud Financial Management (FinOps)
  desc: Operate the FinOps lifecycle - ingest and allocate multi-cloud and container spend, report it, respond to
    anomalies, optimize usage and rates, and plan cloud budgets and migrations.
  primary: Cloudability
  supporting: Costing
  frameworks: 'FinOps: all four domains, Inform-Optimize-Operate | TBM: cloud cost pool'
  lanes: FinOps Practitioner; Engineering; Finance; Cloud vendors
08:
  name: Consumption, Chargeback & Value Management
  desc: 'Turn transparency into accountability: showback and Bill of IT to business units, price services, shape
    demand, benchmark against peers, and run the executive value operating rhythm.'
  primary: Costing (Billing)
  supporting: Cloudability, Planning, Targetprocess
  frameworks: 'TBM: Delivering Value, Shaping Demand, Benchmarking | FinOps: Invoicing & Chargeback, Unit Economics'
  lanes: TBM Office; BU Owners; CIO/CFO; Service Owners
09:
  name: Cross-Tool End-to-End Flows
  desc: 'The integrated ''data highway'' processes that span two or more products: targets down, rates back, actuals
    in, TCO up - plus cloud-to-TBM and the investment loop.'
  primary: All four
  frameworks: TBM + SPM + FinOps integrated; ADM/Datalink as integration fabric
  lanes: IT Planning (Finance); Targetprocess/ATP; Costing/TBM Studio; Cloudability; ERP (SAP)
'10':
  name: Platform Configuration, Data & Administration
  desc: 'The enabling processes: configure each product, operate the data pipelines and integrations, and run the
    TBM/FinOps/SPM practices that govern adoption and maturity.'
  primary: All four
  frameworks: 'TBM Foundations (Roles, Data, Tools, Methods, Change) | FinOps: Manage the Practice | SPM maturity
    model'
  lanes: Platform Admins; TBM Office; FinOps Team; SPM Governance; Integration Team
