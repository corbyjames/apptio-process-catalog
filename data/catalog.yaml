- l2id: 09.1.1
  l2: 'Flow: Planning -> Targetprocess targets & positions'
  l1id: '09.1'
  l1: UC3 - Portfolio Target Spend (targets down)
  desc: Finance builds workforce plans and top-down target spend in Planning; targets ride ADM to ATP as budget
    artifacts; portfolio allocates teams to work, compares bottom-up demand to targets; position requests round-trip
    through approval back into the plan.
  delivery: Any
  tool: Planning + Targetprocess
  support: ''
  personas: 'Lanes: IT Planning (Finance) | ATP (Portfolio & Workforce)'
  cadence: Planning cycle + daily/weekly sync
  inputs: Corporate targets, roster
  outputs: Targets in ATP; budgeted open+filled positions; demand-vs-target reports
  config: 'Steps: create workforce plan & targets > send targets (ADM) > create budget artifacts > position request
    > multi-level approval > send approved positions > normalize & budget > allocate teams to work > compare demand
    vs targets. See E2E Flows sheet for BPMN detail.'
  fw: 'SPM: Financial Mgmt + WFM | ITFM'
  src: E2E BPMN UC3; e2e demo script
- l2id: 09.2.1
  l2: 'Flow: Costing -> Targetprocess blended rates'
  l1id: '09.2'
  l1: UC2 - Work Allocation Rates (rates back)
  desc: Costing maintains protected individual rates, computes blended team/ART rates and publishes them to ATP
    so work allocations can be costed without exposing compensation.
  delivery: Any
  tool: Costing + Targetprocess
  support: ''
  personas: 'Lanes: Costing (TBM Studio) | ATP'
  cadence: Regular cadence
  inputs: Protected rates, org structure
  outputs: Costed work allocations feeding budget cycle
  config: 'Steps: maintain protected rates > compute blended rates > send to ATP (ADM) > cost work allocations.
    Design decisions: rate exposure level; blended-vs-actual true-up.'
  fw: 'TBM: labor | SPM: Financial Mgmt'
  src: E2E BPMN UC2; e2e demo script
- l2id: 09.3.1
  l2: 'Flow: Targetprocess -> Costing -> SAP actuals'
  l1id: '09.3'
  l1: UC1 - Labor Capitalization (actuals in)
  desc: ATP sends involvements, job profiles, mappings and completed work to Costing; TBM Studio computes monthly
    team cost and blended CapEx %, allocates to work (story points) or towers (fixed capacity), and generates the
    SAP-ready CapEx/OpEx actuals file that deprecates time writing.
  delivery: Any
  tool: Targetprocess + Costing
  support: SAP, ServiceNow
  personas: 'Lanes: ATP | Costing | ERP'
  cadence: Monthly
  inputs: Workforce & completed work data
  outputs: SAP-ready CapEx/OpEx actuals by user
  config: 'Steps: maintain involvements/profiles/mappings > send to TBM Studio (ADM) > compute team cost & CapEx
    % > visible-work? story-point allocation : fixed-capacity allocation > generate SAP file. Three ingredients:
    job profiles, involvements, protected rates.'
  fw: 'TBM: capitalization | Compliance'
  src: E2E BPMN UC1; e2e demo script
- l2id: 09.4.1
  l2: 'Flow: actuals roll up to Application TCO'
  l1id: '09.4'
  l1: UC4 - Cost Actuals to App TCO (TCO up)
  desc: All cost actuals roll up to Application TCO; because labor arrives attached to work, run vs change attribution
    is driven by real delivery data.
  delivery: Any
  tool: Costing
  support: Targetprocess
  personas: 'Lanes: Costing | consumers of TCO'
  cadence: Monthly
  inputs: Allocated actuals incl. labor-on-work
  outputs: App TCO with run/change attribution
  config: 'Steps: roll actuals to App TCO > attribute run vs change in TCO view. Anti-pattern: story-level Jira
    import into cost model.'
  fw: 'TBM: Delivering Value'
  src: E2E BPMN UC4; e2e demo script
- l2id: 09.5.1
  l2: 'Flow: Cloudability -> Costing hybrid TCO'
  l1id: '09.5'
