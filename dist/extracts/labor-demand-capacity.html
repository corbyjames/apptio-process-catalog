<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Catalog of the business processes supported by IBM Apptio Targetprocess, Costing, Planning and Cloudability, framed by TBM, SPM and FinOps, with BPMN 2.0 diagrams for every area, group and cross-tool flow.">
<title>Labor Rates, Demand & Capacity Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F4F1; --surface:#FFFFFF; --surface2:#EBEDE8; --ink:#1E2422; --ink2:#4B5450; --ink3:#78827D;
  --rule:#C9CDC4; --rule2:#DFE2DC; --accent:#1F5F4A; --accent-ink:#FFFFFF; --accent-soft:#E2EEE8;
  --tp:#3A6EA5; --co:#8C5A2B; --pl:#5B6E1F; --cl:#2A8C8C; --all:#5E5A72;
  --s-draft:#78827D; --s-review:#B7791F; --s-changes:#B4462E; --s-confirmed:#2F7A4B;
  --s-draft-bg:#EEF0EC; --s-review-bg:#FAF0DC; --s-changes-bg:#F9E4DE; --s-confirmed-bg:#DFF0E4;
  --focus:#1F5F4A; --shadow:0 1px 2px rgba(30,36,34,.08);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#181B1A; --surface:#202423; --surface2:#2A2F2D; --ink:#E8EAE6; --ink2:#B9BFBA; --ink3:#8B938E;
    --rule:#3A403D; --rule2:#2F3533; --accent:#7CC7A8; --accent-ink:#0F1F19; --accent-soft:#213A31;
    --tp:#7FAADB; --co:#C99A6C; --pl:#A5B85C; --cl:#5FBFBF; --all:#A9A4C2;
    --s-draft:#9AA39E; --s-review:#E0A94A; --s-changes:#E07A5F; --s-confirmed:#6FC48E;
    --s-draft-bg:#2A2F2D; --s-review-bg:#3A2F17; --s-changes-bg:#3D2420; --s-confirmed-bg:#1E3527;
    --focus:#7CC7A8; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#181B1A; --surface:#202423; --surface2:#2A2F2D; --ink:#E8EAE6; --ink2:#B9BFBA; --ink3:#8B938E;
  --rule:#3A403D; --rule2:#2F3533; --accent:#7CC7A8; --accent-ink:#0F1F19; --accent-soft:#213A31;
  --tp:#7FAADB; --co:#C99A6C; --pl:#A5B85C; --cl:#5FBFBF; --all:#A9A4C2;
  --s-draft:#9AA39E; --s-review:#E0A94A; --s-changes:#E07A5F; --s-confirmed:#6FC48E;
  --s-draft-bg:#2A2F2D; --s-review-bg:#3A2F17; --s-changes-bg:#3D2420; --s-confirmed-bg:#1E3527;
  --focus:#7CC7A8; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
h1{font:600 30px/1.15 var(--serif)}
h2{font:600 21px/1.2 var(--serif)}
h3{font:600 16px/1.3 var(--sans)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.eyebrow{font:500 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.eyebrow a{text-transform:none;letter-spacing:0;color:inherit;font-family:var(--mono);font-size:11px}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:8px 20px;flex-wrap:wrap}
.bar .crumbs{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumbs a{color:var(--ink2)}
.bar .crumbs .sep{color:var(--ink3)}
.bar .crumbs .here{color:var(--ink);font-weight:500}
.bar .crumbs .id{font-family:var(--mono);color:var(--ink3);font-size:12px}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;padding:6px 10px 6px 30px;border:1px solid var(--rule);border-radius:6px;background:var(--ground);min-height:32px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;fill:none;stroke:var(--ink3);stroke-width:2}
.search .results{position:absolute;top:36px;left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:60vh;overflow:auto;z-index:30}
.search .results a{display:block;padding:8px 10px;border-bottom:1px solid var(--rule2);color:var(--ink);font-size:13px}
.search .results a:hover,.search .results a.active{background:var(--accent-soft);text-decoration:none}
.search .results .k{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-right:6px}
.lens{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.lens button{background:var(--surface);border:0;padding:5px 11px;min-height:32px;cursor:pointer;color:var(--ink2);font-size:13px}
.lens button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.progress .track{width:110px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.progress .track i{display:block;height:100%}
.who{font-size:12px;color:var(--ink2);background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 9px;min-height:32px;cursor:pointer}
.who b{color:var(--ink);font-weight:500}

/* ---- page frame ---- */
.page{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.page.wide{max-width:1400px}
.pagehead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.pagehead p.lede{max-width:68ch;color:var(--ink2);margin:8px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:10px}
.meta .id{font-family:var(--mono);color:var(--ink3)}
.notice{background:var(--surface2);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;color:var(--ink2);border-radius:0 6px 6px 0;margin:0 0 20px}

/* ---- chips & status ---- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:4px 8px;border-radius:4px;border:1px solid var(--rule);background:var(--surface);color:var(--ink2);white-space:nowrap}
.chip.prod::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc)}
.chip.prod[data-p="Targetprocess"]{--pc:var(--tp)} .chip.prod[data-p="Costing"]{--pc:var(--co)} .chip.prod[data-p="Planning"]{--pc:var(--pl)} .chip.prod[data-p="Cloudability"]{--pc:var(--cl)} .chip.prod[data-p="All four"]{--pc:var(--all)}
.chip.flow{font-family:var(--mono);font-size:11px;background:var(--surface2);border-color:transparent}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status[data-s="draft"]{color:var(--s-draft);background:var(--s-draft-bg)}
.status[data-s="review"]{color:var(--s-review);background:var(--s-review-bg)}
.status[data-s="changes"]{color:var(--s-changes);background:var(--s-changes-bg)}
.status[data-s="confirmed"]{color:var(--s-confirmed);background:var(--s-confirmed-bg)}
select.status-sel{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 8px;min-height:28px;font-size:12px}

/* ---- hub / landscape ---- */
.landscape{display:grid;gap:14px;margin:8px 0 28px}
.band{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:14px 16px 16px;box-shadow:var(--shadow)}
.band .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.band .bhead h2{font:600 14px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.band .bhead span{font-size:12px;color:var(--ink3)}
.tiles{display:grid;gap:10px}
.band.steer .tiles,.band.enable .tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.band.core .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
.band.core.extract .tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px 16px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);color:var(--ink);min-height:118px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:6px 0 0 6px;background:var(--pc)}
.tile[data-p="Targetprocess"]{--pc:var(--tp)} .tile[data-p="Costing"]{--pc:var(--co)} .tile[data-p="Planning"]{--pc:var(--pl)} .tile[data-p="Cloudability"]{--pc:var(--cl)} .tile[data-p="All four"]{--pc:var(--all)}
.tile:hover{text-decoration:none;border-color:var(--accent)}
.tile .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tile .t{font:600 14px/1.25 var(--sans);text-wrap:balance}
.tile .sub{font-size:12px;color:var(--ink3);margin-top:auto}
.tile .bar2{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface2)}
.tile .bar2 i{display:block;height:100%}
.tile.small{min-height:auto;padding:10px 12px 10px 16px}
.core-row{display:flex;align-items:center;gap:6px}
.core-row .arrow{color:var(--ink3);font-size:18px;flex:0 0 auto}
.flows-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.flowcard{display:flex;gap:12px;padding:12px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);color:var(--ink);align-items:flex-start}
.flowcard:hover{text-decoration:none;border-color:var(--accent)}
.flowcard .fid{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500;min-width:36px;padding-top:1px}
.flowcard > span:last-child{display:flex;flex-direction:column;min-width:0}
.flowcard .ft{font-weight:600;font-size:14px}
.flowcard .fs{font-size:12px;color:var(--ink3);margin-top:2px;display:block}
.flowcard .fp{display:flex;gap:4px;margin-top:6px}
.flowcard .fp i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hubgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.panel{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:16px 18px;box-shadow:var(--shadow)}
.panel h2{font:600 15px/1.3 var(--sans);margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.statlist{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(110px,auto);gap:10px;flex:0 0 auto}
@media (max-width:700px){.statlist{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);width:100%}}
.stat{padding:10px 12px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground)}
.stat b{display:block;font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink3)}

/* ---- L0 page ---- */
.l0{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;font-size:13px;padding-right:6px}
.rail .rh{font-size:12px;color:var(--ink3);margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase}
.rail ul{list-style:none;margin:0;padding:0}
.rail li a{display:block;padding:4px 8px;border-left:2px solid transparent;color:var(--ink2);border-radius:0 4px 4px 0}
.rail li a.g{font-weight:600;color:var(--ink);margin-top:6px}
.rail li a.p{padding-left:16px;font-size:12.5px}
.rail li a .id{font-family:var(--mono);color:var(--ink3);font-size:11px;margin-right:4px}
.rail li a:hover{background:var(--surface2);text-decoration:none}
.rail li a.on{border-left-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.group{margin:0 0 36px;scroll-margin-top:80px}
.ghead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:0 0 10px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.ghead h2{display:flex;gap:10px;align-items:baseline}
.ghead h2 .id{font:500 14px var(--mono);color:var(--ink3)}
.ghead .gmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.verdict{display:inline-flex;gap:6px;align-items:center}
.verdict select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px;min-height:28px}
.verdict input{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;min-height:28px;width:150px}
.record{border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin:0 0 14px;scroll-margin-top:80px;box-shadow:var(--shadow)}
.record.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;padding:14px 18px 10px}
.rhead .ttl{flex:1 1 320px;min-width:0}
.rhead h3{font:600 17px/1.3 var(--sans);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rhead h3 .id{font:500 13px var(--mono);color:var(--ink3)}
.rhead h3 a.perma{font:400 12px var(--mono);color:var(--ink3);opacity:0;transition:opacity .15s}
.rhead:hover h3 a.perma,.rhead h3 a.perma:focus{opacity:1}
.rhead .eid{font:400 11px var(--mono);color:var(--ink3);margin-top:2px}
.rhead .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.outcome{margin:0 18px 10px;padding:10px 12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.outcome b{font-weight:600;color:var(--accent)}
.sl{margin:0;padding:0 18px 14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;font-size:14px}
.sl > div{display:contents}
.sl dt{padding:7px 12px 7px 0;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--rule2)}
.sl dd{margin:0;padding:7px 0;border-top:1px solid var(--rule2)}
.sl dd .np{color:var(--ink3);font-style:italic}
.sl dd .chips{display:flex;flex-wrap:wrap;gap:5px}
.sl dd .raw{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.sl .io{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.sl .io .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:block}
.sl .io .arr{color:var(--ink3);padding-top:14px}
.sl dd.evidence{font-size:13px;color:var(--ink2)}
.record .foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:8px 18px 12px;border-top:1px solid var(--rule2);font-size:12px;color:var(--ink3)}
.record .foot .comp{display:inline-flex;align-items:center;gap:6px}
.record .foot .comp i{display:inline-block;width:70px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.record .foot .comp i b{display:block;height:100%;background:var(--accent)}
.comments{padding:0 18px 14px}
.comments summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 0;list-style:none;display:flex;gap:8px;align-items:center}
.comments summary::-webkit-details-marker{display:none}
.comments summary::before{content:"▸";font-size:11px;color:var(--ink3)}
.comments[open] summary::before{content:"▾"}
.comments .list{display:grid;gap:8px;margin:6px 0 10px}
.comment{padding:8px 10px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);font-size:13px}
.comment .ch{display:flex;gap:10px;font-size:11.5px;color:var(--ink3);margin-bottom:3px;flex-wrap:wrap}
.comment .ch b{color:var(--ink2);font-weight:500}
.comment .ch .at{font-family:var(--mono);background:var(--surface2);padding:0 5px;border-radius:3px}
.cform{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.cform select,.cform textarea,.cform button{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;min-height:32px}
.cform textarea{resize:vertical;min-height:32px}
.cform button{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:16px;border-top:1px solid var(--rule);font-size:14px;flex-wrap:wrap}
.prevnext a{display:inline-flex;flex-direction:column;gap:2px}
.prevnext a span{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.expand{font-size:13px;background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}

/* ---- register ---- */
.facets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.facets select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;min-height:32px;max-width:220px}
.facets .applied{display:flex;flex-wrap:wrap;gap:6px}
.facets .applied button{border:1px solid var(--rule);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;min-height:26px}
.facets .clear{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:4px}
.facets .density{margin-left:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
table.reg th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:500;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink2);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.reg th .dir{font-size:10px;color:var(--ink3);margin-left:4px}
table.reg td{padding:9px 10px;border-bottom:1px solid var(--rule2);vertical-align:top}
table.reg.compact td{padding:5px 10px}
table.reg td.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
table.reg td.exp{width:28px;padding-right:0}
table.reg td.exp button{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:13px;padding:0 4px;min-width:24px;min-height:24px}
table.reg tr.detail td{background:var(--ground);padding:0}
table.reg tr.detail .record{margin:10px;border-color:var(--rule2)}
table.reg td .chips{display:flex;flex-wrap:wrap;gap:4px}
table.reg td input[type=checkbox]{width:16px;height:16px}
.batch{display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0}
.batch select,.batch button{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;min-height:32px}
.batch button{cursor:pointer}
.count{font-size:13px;color:var(--ink3);margin:0 0 8px}

/* ---- flow page ---- */
.flowhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.lanes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.lanes span{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--rule);background:var(--surface)}
table.steps{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}

/* ---- BPMN diagram ---- */
.bpmn{margin:0 0 22px;padding:0}
.bpmn-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
.bpmn svg{display:block;max-width:none;height:auto;color:var(--ink)}
.bpmn svg a{color:inherit}
.bpmn svg a:hover .bn rect,.bpmn svg a:focus .bn rect{stroke:var(--accent);stroke-width:2.5}
.bpmn svg a:focus{outline:none}
.bpmn figcaption{font-size:12.5px;color:var(--ink2);margin:8px 2px 0;max-width:90ch}
.bpmn-x{margin:0 0 22px}
.bpmn-x summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.bpmn-x .xbar{display:flex;gap:8px;align-items:center;margin:8px 0}
.bpmn-x button{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:13px;min-height:32px;cursor:pointer}

.gloss{columns:2;column-gap:32px;font-size:14px}
.gloss dt{font-weight:600;font-family:var(--mono);font-size:13px;break-after:avoid}
.gloss dd{margin:2px 0 12px;color:var(--ink2);break-inside:avoid}
.release{margin:0 0 24px;padding:0 0 16px;border-bottom:1px solid var(--rule)}
.release h2{display:flex;gap:12px;align-items:baseline}
.release h2 .d{font:400 13px var(--mono);color:var(--ink3)}
.release ul{margin:8px 0 0;padding-left:20px}
.release li{margin:4px 0}

/* ---- responsive ---- */
@media (max-width:1000px){
  .band.core .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hubgrid{grid-template-columns:1fr}
  .l0{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:6px}
  .rail ul{display:flex;flex-wrap:wrap;gap:2px}
  .rail li a.p{display:none}
}
@media (max-width:600px){
  .band.core .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sl{grid-template-columns:1fr}
  .sl dt{border-top:1px solid var(--rule2);padding-bottom:0}
  .sl dd{border-top:0;padding-top:2px}
  .sl .io{grid-template-columns:1fr}
  .sl .io .arr{display:none}
  .gloss{columns:1}
  .cform{grid-template-columns:1fr}
  .progress .track{width:70px}
}

/* ---- print ---- */
@media print{
  .bar,.rail,.prevnext,.comments,.expand,.facets,.batch,.ctl,.who,.notice{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .page{max-width:none;padding:0}
  .l0{grid-template-columns:1fr}

  .group:first-of-type{break-before:auto}
  .record{break-inside:avoid;box-shadow:none;border-color:#999}
  a[href^="#/"]::after{content:""}
  .rhead h3 a.perma{opacity:1}
}

ecords per period; true-up flag","inputs":"Confirmed allocations","outputs":"Allocation-based effort data for costing & CapEx","bpmn_type":"Send task (ADM)"},{"decision":"labor-effort-signal","option":"fixed-capacity","name":"Feed team roster & tower mapping to Costing","description":"Only the team roster, involvements and team->tower/app mapping cross; there is no work-level effort record.","config":"ADM feed of teams, involvements and tower mapping","inputs":"Roster, mappings","outputs":"Capacity-rule inputs for costing","bpmn_type":"Send task (ADM)"}],"decisions":["labor-effort-signal"],"lane":"Finance (IT Planning)","bpmn_type":"Send task (ADM)"}],"eid":"G-045","extract_narrowed":false,"bpmn":{"id":"G04_5","kind":"l1","name":"04.5 Track & approve time","title":"Track & approve time","summary":"Process group 04.5 in L0-04 Workforce & Resource Management: 3 L2 processes laid out in the order of the catalog, in the BPMN lane of the persona that performs each one.","lanes":["Resource Management","Finance (IT Planning)"],"steps":[{"n":"04.5.1","type":"User task","lane":"Resource Management","task":"Capture effort against work","note":"Outcome: time entries / effort data","l2":["04.5.1"],"variants":5},{"n":"04.5.2","type":"User task","lane":"Resource Management","task":"Approve timesheets","note":"Outcome: approved time","l2":["04.5.2"],"when":{"labor-effort-signal":["timesheet"]},"variants":1},{"n":"04.5.3","type":"Send task (ADM)","lane":"Finance (IT Planning)","task":"Feed time/effort to finance processes","note":"Outcome: effort data for costing & CapEx","l2":["04.5.3"],"variants":5}]}}],"short":"Workforce & resources","band":"enable","product":"Targetprocess","bpmn":{"id":"A04","kind":"l0","name":"L0-04 Workforce & Resource Management","title":"Workforce & Resource Management","summary":"Maintain the workforce baseline (people, teams, involvements, job profiles), plan capacity against demand, allocate resources to work, govern position requests, and track time.","lanes":["Resource Management","Portfolio Management","Finance (IT Planning)"],"steps":[{"n":"04.1","type":"Sub-process","lane":"Finance (IT Planning)","task":"Maintain the workforce baseline","note":"1 processes: 04.1.3","l2":["04.1.3"],"href":"#/l0/04/04.1"},{"n":"04.2","type":"Sub-process","lane":"Resource Management","task":"Plan capacity","note":"3 processes: 04.2.1, 04.2.2, 04.2.3","l2":["04.2.1"],"href":"#/l0/04/04.2"},{"n":"04.3","type":"Sub-process","lane":"Resource Management","task":"Allocate resources & track utilization","note":"4 processes: 04.3.1, 04.3.2, 04.3.3, 04.3.4","l2":["04.3.1"],"href":"#/l0/04/04.3"},{"n":"04.4","type":"Sub-process","lane":"Portfolio Management","task":"Manage positions","note":"3 processes: 04.4.1, 04.4.2, 04.4.3","l2":["04.4.1"],"href":"#/l0/04/04.4"},{"n":"04.5","type":"Sub-process","lane":"Resource Management","task":"Track & approve time","note":"3 processes: 04.5.1, 04.5.2, 04.5.3","l2":["04.5.1"],"href":"#/l0/04/04.5"}]}},{"id":"06","name":"Cost Transparency & TBM Operations","description":"Run the monthly TBM engine: ingest actuals, allocate costs through cost pools and towers to applications, services and business units, cost labor defensibly, and analyze TCO.","primary":"Costing","lanes":["TBM Office/IT Finance","Costing Admin","App/Service Owners","ERP-GL"],"l1s":[{"id":"06.4","name":"Cost labor & capitalize","original_name":"Labor Costing & Capitalization","merged_from":[],"l2s":[{"id":"06.4.1","legacy_id":null,"name":"Define the labor rate structure","description":"Decide how the company expresses labor rates before any number is computed: the rate dimensions (band/level or job grade, role family, location or cost-of-labor region, employment type - employee, contractor, MSP/offshore), the rate types (standard rate used for planning and costing vs actual loaded rate used for true-up), the productive-hours policy (available hours net of PTO, holidays, training and admin, by country and employment type), the overhead/indirect uplift policy, and the governance - rate-card owner, refresh cadence, approval path and which rate is allowed to leave Costing. Three rates coexist and the structure says which is which: the actual loaded rate per person (monthly, never leaves Costing), the standard rate per cell that finance issues (derived from the cell's roster average or the band midpoint, fixed for the year), and the blended team rate (FTE-weighted standard rates of the team's members, or the actual team average inside Costing). The structure also fixes the thin-cell rule (cells under about five people roll up to the parent band or region), whether overhead is carried in the rate or left in tower allocation (never both), the productive-hours divisor (contracted hours net of PTO, holidays, training and admin - typically 1,650-1,800 of 2,080), and the mid-year revision triggers (actual drifts beyond tolerance, e.g. 5%, for two or three consecutive months, or cell headcount moves more than 10-15%). See docs/labor-rates.md.","delivery_model":"Any","tool":"Costing","personas":"IT Finance, HR Compensation, TBM Office","cadence":"Annually at budget; on job-architecture or org change","inputs":"HRIS job architecture (bands/levels, role families) and location model; employment categories; HR policy on standard hours, PTO and holidays by country; finance policy on overhead pools, capitalization and variance tolerance; privacy constraints on rate exposure","outputs":"Rate structure definition (dimensions x rate types: actual, standard, blended), thin-cell roll-up rule, productive-hours policy, overhead uplift policy, variance tolerance and mid-year revision triggers, rate governance (owner, cadence, approval, versioning)","config":"Costing: Job Profile dimensions (band/level, role family, location, employment type), rate table design, productive-hours reference table; ATP CM Rate Transform design","framework":"TBM: labor | ITFM | privacy","evidence":"Added v0.8 (labor rate card build); TBM Council labor cost guidance; ITFM standard-rate practice","eid":"P-0150","persona_list":["IT Finance & FP&A","HR & approvers","TBM Office & analysts"],"cadence_bucket":"Annual / per cycle","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"an agreed rate structure and policies that every later rate follows","frameworks":["TBM: labor","ITFM","privacy"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC2"],"decisions":["rate-exposure"],"variants":[{"decision":"rate-exposure","option":"blended-team","description":"Decide how the company expresses labor rates before any number is computed: the rate dimensions (band/level or job grade, role family, location or cost-of-labor region, employment type - employee, contractor, MSP/offshore), the rate types (standard rate used for planning and costing vs actual loaded rate used for true-up), the productive-hours policy (available hours net of PTO, holidays, training and admin, by country and employment type), the overhead/indirect uplift policy, and the governance - rate-card owner, refresh cadence, approval path and which rate is allowed to leave Costing. Three rates coexist and the structure says which is which: the actual loaded rate per person (monthly, never leaves Costing), the standard rate per cell that finance issues (derived from the cell's roster average or the band midpoint, fixed for the year), and the blended team rate (FTE-weighted standard rates of the team's members, or the actual team average inside Costing). The structure also fixes the thin-cell rule (cells under about five people roll up to the parent band or region), whether overhead is carried in the rate or left in tower allocation (never both), the productive-hours divisor (contracted hours net of PTO, holidays, training and admin - typically 1,650-1,800 of 2,080), and the mid-year revision triggers (actual drifts beyond tolerance, e.g. 5%, for two or three consecutive months, or cell headcount moves more than 10-15%). See docs/labor-rates.md. Under this approach: structure centres on team membership: rate cells are kept inside Costing and exist only to roll up to one blended rate per team/ART; band and location remain internal attributes."},{"decision":"rate-exposure","option":"role-location","name":"Define the job-profile rate-card structure","description":"Decide how the company expresses labor rates before any number is computed: the rate dimensions (band/level or job grade, role family, location or cost-of-labor region, employment type - employee, contractor, MSP/offshore), the rate types (standard rate used for planning and costing vs actual loaded rate used for true-up), the productive-hours policy (available hours net of PTO, holidays, training and admin, by country and employment type), the overhead/indirect uplift policy, and the governance - rate-card owner, refresh cadence, approval path and which rate is allowed to leave Costing. Three rates coexist and the structure says which is which: the actual loaded rate per person (monthly, never leaves Costing), the standard rate per cell that finance issues (derived from the cell's roster average or the band midpoint, fixed for the year), and the blended team rate (FTE-weighted standard rates of the team's members, or the actual team average inside Costing). The structure also fixes the thin-cell rule (cells under about five people roll up to the parent band or region), whether overhead is carried in the rate or left in tower allocation (never both), the productive-hours divisor (contracted hours net of PTO, holidays, training and admin - typically 1,650-1,800 of 2,080), and the mid-year revision triggers (actual drifts beyond tolerance, e.g. 5%, for two or three consecutive months, or cell headcount moves more than 10-15%). See docs/labor-rates.md. Under this approach: structure is the published grid itself: band/level x role family x location (x employment type) is the rate card everyone plans and costs with, so cell granularity is set with thin-cell roll-up rules.","outputs":"Rate-card grid definition with roll-up rules"},{"decision":"rate-exposure","option":"individual","description":"Decide how the company expresses labor rates before any number is computed: the rate dimensions (band/level or job grade, role family, location or cost-of-labor region, employment type - employee, contractor, MSP/offshore), the rate types (standard rate used for planning and costing vs actual loaded rate used for true-up), the productive-hours policy (available hours net of PTO, holidays, training and admin, by country and employment type), the overhead/indirect uplift policy, and the governance - rate-card owner, refresh cadence, approval path and which rate is allowed to leave Costing. Three rates coexist and the structure says which is which: the actual loaded rate per person (monthly, never leaves Costing), the standard rate per cell that finance issues (derived from the cell's roster average or the band midpoint, fixed for the year), and the blended team rate (FTE-weighted standard rates of the team's members, or the actual team average inside Costing). The structure also fixes the thin-cell rule (cells under about five people roll up to the parent band or region), whether overhead is carried in the rate or left in tower allocation (never both), the productive-hours divisor (contracted hours net of PTO, holidays, training and admin - typically 1,650-1,800 of 2,080), and the mid-year revision triggers (actual drifts beyond tolerance, e.g. 5%, for two or three consecutive months, or cell headcount moves more than 10-15%). See docs/labor-rates.md. Under this approach: structure is person-level loaded cost; bands and locations are reporting attributes, and the governance work is the access model and HR/privacy approval."}],"lane":"TBM Office/IT Finance","bpmn_type":"User task"},{"id":"06.4.2","legacy_id":null,"name":"Compute fully loaded labor rates","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks.","delivery_model":"Any","tool":"Costing","personas":"TBM Analyst, IT Finance","cadence":"Annually at budget; refreshed quarterly or on reorganization","inputs":"Costing labor roster with loaded cost per person (salary + benefits from payroll/GL) or contract rate (VMS/SOW), HRIS attributes (band/level, role family, location, employment type, FTE, cost center, hire/term dates), burden % by country and employment type, productive-hours table, overhead uplift policy, prior rate card, salary-survey and TBM Council benchmarks","outputs":"Draft rate card (standard and actual rate per cell, headcount n, variance vs prior card), exception list","config":"Costing: labor roster dataset, Job Profile attributes, productive-hours table (country x employment type), overhead allocation %, rate computation in TBM Studio / ATP CM Rate Transform, draft rate table","framework":"TBM: labor | ITFM","evidence":"Added v0.8 (labor rate card build); TBM Council labor cost guidance; ITFM standard-rate practice","eid":"P-0151","persona_list":["TBM Office & analysts","IT Finance & FP&A"],"cadence_bucket":"Annual / per cycle","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"a defensible loaded rate for every band, role, location and employment type","frameworks":["TBM: labor","ITFM"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC2"],"decisions":["labor-effort-signal"],"variants":[{"decision":"labor-effort-signal","option":"timesheet","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks. Under this approach: divisor is productive hours: loaded annual cost / available hours net of PTO, holidays, training and admin gives an hourly standard rate per cell.","outputs":"Hourly standard and actual rate per cell"},{"decision":"labor-effort-signal","option":"story-points","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks. Under this approach: cell rates feed team cost; the unit rate that matters is cost per point, derived monthly in 06.4.7 from team cost and points completed, so this step validates the loaded cost per FTE-month per cell rather than an hourly rate.","outputs":"Loaded cost per FTE-month per cell"},{"decision":"labor-effort-signal","option":"story-count","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks. Under this approach: as for story points: validate loaded cost per FTE-month per cell; the per-item rate is derived monthly from team cost.","outputs":"Loaded cost per FTE-month per cell"},{"decision":"labor-effort-signal","option":"work-effort-unit","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks. Under this approach: divisor is planned allocation capacity: loaded cost / planned effort units gives a rate per allocation unit per cell.","outputs":"Rate per work-effort unit per cell"},{"decision":"labor-effort-signal","option":"fixed-capacity","description":"Starting from the labor roster already loaded in Costing - salary plus benefits for employees, contract rates for contractors - attach each person's band/level, role family, location and employment type; aggregate loaded cost to each cell of the rate structure; apply the overhead/indirect uplift; and divide by the cell's productive hours to produce a standard loaded rate per hour (or per point or per FTE-month, depending on the effort signal). Produce the actual rate per cell alongside, compare both to the prior rate card and external benchmarks, and raise exceptions for outliers and thin cells (small n rolls up to the parent band or region). The arithmetic per cell: loaded annual cost = base pay + variable pay + employer taxes + benefits (or contract rate x contracted hours); cell loaded cost = roster mean (or band midpoint x (1 + burden %)); fully loaded = x (1 + overhead uplift %); standard rate = fully loaded / productive hours. Burden is normally a % by country and employment type from the GL, not per person. Team blended rate = sum(FTE x cell standard rate) / sum(FTE). Example: base 120,000 + 10% variable = 132,000; burden 28% = 168,960; overhead 12% = 189,235; 1,720 productive hours = 110/hour. Sources: HRIS (person, band, role, location, employment type, FTE, cost center, dates), payroll/GL (pay and burden), VMS/procurement (contractor rates), finance (overhead pools), HR policy (hours, PTO, holidays), timekeeping (divisor validation), salary surveys and TBM Council benchmarks. Under this approach: no divisor: the cell's loaded cost per FTE-month is the rate, since teams are assigned whole to towers or applications.","outputs":"Loaded cost per FTE-month per cell"}],"lane":"TBM Office/IT Finance","bpmn_type":"Service task"},{"id":"06.4.3","legacy_id":null,"name":"Approve, effective-date & publish the rate card","description":"Review the draft rate card and its exceptions with Finance and HR, resolve or document exceptions, obtain approval, set the effective date and version, and load the approved rates into Costing's protected rate tables - the source that 06.4.4 blends from and 06.4.5 publishes to Targetprocess. Archive the prior version for audit, record the change log by cell, and notify planning and portfolio owners of material rate movements and their budget impact. Both Targetprocess and Costing reference the card by version, so plans built on one version can be compared with actuals without dispute about which rate applied. Standard rates are issued annually, just after the merit cycle takes effect and before budget entry; mid-year, only the cells that hit a revision trigger in 06.4.10 are re-issued, effective-dated, never the whole card.","delivery_model":"Any","tool":"Costing","personas":"IT Finance, HR Compensation, TBM Office","cadence":"Annually, plus mid-year change control","inputs":"Draft rate card, exception list, Finance/HR approvals, effective-dating rules","outputs":"Approved, versioned, effective-dated rate card in Costing protected rate tables; rate change log; notification to planning and portfolio owners","config":"Costing: protected rate tables (versioned, effective-dated), approval record, rate change log; downstream: ATP CM Rate Transform picks up the new version","framework":"TBM: labor | ITFM | privacy","evidence":"Added v0.8 (labor rate card build); TBM Council labor cost guidance; ITFM standard-rate practice","eid":"P-0152","persona_list":["IT Finance & FP&A","HR & approvers","TBM Office & analysts"],"cadence_bucket":"Annual / per cycle","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"one approved rate card of record that every costing and plan uses","frameworks":["TBM: labor","ITFM","privacy"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC2"],"lane":"TBM Office/IT Finance","bpmn_type":"User task"},{"id":"06.4.4","legacy_id":"06.4.1","name":"Maintain protected rates & compute blended rates","description":"Keep individual rates protected inside Costing; compute blended team/ART/solution-train rates.","delivery_model":"Any","tool":"Costing","personas":"IT Finance, TBM Analyst","cadence":"Monthly/quarterly","inputs":"HR comp data, org structure","outputs":"Blended rates by team/ART","config":"ATP CM Rate Transform, protected rate tables, blending logic; rate-level exposure design decision (blended vs individual)","framework":"TBM: labor | privacy","evidence":"E2E BPMN t_rates; e2e script UC2","eid":"P-0091","persona_list":["IT Finance & FP&A","TBM Office & analysts"],"cadence_bucket":"Monthly","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"blended rates by team/ART","frameworks":["TBM: labor","privacy"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC2"],"variants":[{"decision":"rate-exposure","option":"blended-team","description":"Keep individual rates protected inside Costing; compute one blended rate per team/ART/solution train from involvements and loaded cost."},{"decision":"rate-exposure","option":"role-location","name":"Maintain protected rates & the job-profile rate card","description":"Keep individual rates protected; derive and govern a standard rate per job profile (role x location) as the rate card that is published.","config":"Protected rate tables, job-profile rate derivation, rate-card version control","outputs":"Job-profile rate card"},{"decision":"rate-exposure","option":"individual","name":"Maintain individual rates for publication","description":"Individual loaded rates are maintained and permitted to leave Costing under restricted access.","config":"Rate tables, HR/privacy approval record, restricted-access role mapping","outputs":"Individual rates (restricted)"}],"deci _id":"06.4.4","name":"Compute monthly team cost & blended CapEx %","description":"Combine involvements, profiles and protected rates into monthly cost and a blended CapEx percentage per team.","delivery_model":"Any","tool":"Costing","personas":"TBM Analyst (automated)","cadence":"Monthly","inputs":"Labor model inputs","outputs":"Team cost & CapEx % per team","config":"TBM Studio computation, job profile CapEx/OpEx splits, involvement math","framework":"TBM: labor capitalization","evidence":"E2E BPMN t_calc; e2e script UC1","eid":"P-0094","persona_list":["TBM Office & analysts"],"cadence_bucket":"Monthly","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"team cost & CapEx % per team","frameworks":["TBM: labor capitalization"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC1"],"lane":"TBM Office/IT Finance","bpmn_type":"Service task"},{"id":"06.4.8","legacy_id":"06.4.5","name":"Allocate team costs to work or towers","description":"Attach each team's monthly cost to work (epics/features/applications) or to towers/apps, using the labor effort signal chosen for that team kind (D-01): story points, item counts, approved hours, confirmed allocations, or fixed capacity.","delivery_model":"Hybrid","tool":"Costing (+ ServiceNow)","personas":"TBM Analyst","cadence":"Monthly","inputs":"Team costs, completed work / capacity rules","outputs":"Work-attached & tower-attached labor costs","config":"One normalized labor model in TBM Studio with an allocation strategy per team kind (see variants)","framework":"TBM: allocation principles","evidence":"E2E BPMN g_vis/t_work/t_tower; e2e script UC1","eid":"P-0095","persona_list":["TBM Office & analysts"],"cadence_bucket":"Monthly","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"work-attached & tower-attached labor costs","frameworks":["TBM: allocation principles"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC1"],"variants":[{"decision":"labor-effort-signal","option":"story-points","name":"Allocate team cost by story points","description":"Divide each team's monthly cost by the story points it completed to get a cost per point; allocate cost to epics, features and applications in proportion to points delivered (optionally weighted by item type). Points are normalized per team only.","config":"Story-point/weightage allocation strategy in TBM Studio, per-team normalization, weightage table by work-item type, carry-over rule","inputs":"Team costs, completed work with points","outputs":"Work-attached labor cost (per epic/feature/app)","evidence":"E2E BPMN g_vis/t_work; e2e script UC1"},{"decision":"labor-effort-signal","option":"story-count","name":"Allocate team cost by completed items","description":"Divide each team's monthly cost by completed work items and allocate evenly per item to the epics/features/apps they belong to.","config":"Item-count allocation strategy, per-team normalization","inputs":"Team costs, completed item counts","outputs":"Work-attached labor cost (per epic/feature/app)"},{"decision":"labor-effort-signal","option":"timesheet","name":"Allocate labor cost by approved hours","description":"Approved hours x rate (blended, job-profile or individual per D-02) attach labor cost directly to the work items/projects and applications the hours were logged against; unlogged hours are absorbed by a policy rule.","config":"Hours-based allocation strategy (hours x rate), unlogged-hours absorption rule, billable/non-billable handling","inputs":"Approved hours, rates","outputs":"Work-attached labor cost (per project/app)","evidence":"TP Time Tracking; Costing labor allocation options"},{"decision":"labor-effort-signal","option":"work-effort-unit","name":"Allocate labor cost by confirmed allocations","description":"Confirmed Work Allocation % or man-days x rate attach labor cost to the work and applications planned, with a periodic true-up against completion.","config":"Allocation-based strategy (allocation x rate), true-up adjustment period","inputs":"Confirmed allocations, rates","outputs":"Work-attached labor cost (planned, trued up)"},{"decision":"labor-effort-signal","option":"fixed-capacity","name":"Allocate team cost to towers/apps by fixed capacity","description":"Allocate the team's cost to IT towers and applications by the standing team->tower/app mapping (percent splits); no work-level attribution.","config":"Fixed-capacity rules (team->app/tower), percent allocation strategy in Model Studio","inputs":"Team costs, capacity rules","outputs":"Tower-/app-attached labor cost","evidence":"E2E BPMN t_tower; e2e script (ServiceNow)"}],"decisions":["labor-effort-signal"],"lane":"TBM Office/IT Finance","bpmn_type":"Service task"},{"id":"06.4.9","legacy_id":"06.4.6","name":"Generate audit-ready capitalization actuals","description":"Produce the monthly SAP-ready file of actuals split CapEx/OpEx by user - accurate enough to deprecate time writing; validate fixed-bid/PS work against invoices.","delivery_model":"Any","tool":"Costing (+ SAP/ERP)","personas":"IT Finance, Accounting","cadence":"Monthly","inputs":"Allocated labor costs","outputs":"SAP-ready CapEx/OpEx actuals file","config":"SAP-ready extract format, audit documentation, contractor/PS normalization","framework":"Compliance: software capitalization","evidence":"E2E BPMN t_sap; e2e script UC1 payoff","eid":"P-0096","persona_list":["IT Finance & FP&A"],"cadence_bucket":"Monthly","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"sAP-ready CapEx/OpEx actuals file","frameworks":["Compliance: software capitalization"],"framework_tags":[],"completeness":9,"completeness_of":9,"flows":["UC1"],"variants":[{"decision":"labor-effort-signal","option":"story-points","description":"Produce the monthly SAP-ready file of actuals split CapEx/OpEx by user from the work-attached costs and job-profile CapEx %; document the story-point policy so the file stands up to audit without timesheets."},{"decision":"labor-effort-signal","option":"timesheet","description":"Produce the monthly SAP-ready file of actuals split CapEx/OpEx by user from approved hours x rate; hours are the audit evidence, so retain approved timesheets with the extract.","config":"SAP-ready extract format, approved-hours retention, contractor/PS normalization against invoices"},{"decision":"labor-effort-signal","option":"work-effort-unit","description":"Produce the monthly SAP-ready file from confirmed allocations x rate; add the period-end confirmation as the audit evidence and post true-up adjustments when they occur."},{"decision":"labor-effort-signal","option":"fixed-capacity","description":"Capitalization for fixed-capacity teams is by policy percentage (or none); the extract carries the OpEx tower allocation."}],"decisions":["labor-effort-signal"],"lane":"TBM Office/IT Finance","bpmn_type":"Service task"},{"id":"06.4.10","legacy_id":null,"name":"Reconcile standard vs actual labor cost & trigger rate revisions","description":"Keep the portfolio view (work valued at standard or blended rates in Targetprocess) and the accounting view (actual loaded cost in Costing and the GL) deliberately different and reconciled, never forced to agree. Each month after the true-up, check the reconciliation key team x month - the cost spread across a team's completed work must equal the team's actual cost; anything that does not tie is an unmapped person, missing involvement or stale team mapping, fixed in 04.1.x before close. Then report, per team and per rate cell, standard cost of work vs actual team cost for the month and year to date, split into rate variance (standard vs actual rate) and volume variance (planned vs delivered effort). Standard-cost figures never post to the GL. When a cell's actual drifts beyond tolerance for two or three consecutive months, or its headcount moves more than 10-15%, raise a mid-year revision request for that cell to 06.4.3. The variance report is also the documentation auditors see when standard rates are used for planning while capitalization is at actual.","delivery_model":"Any","tool":"Costing","personas":"TBM Analyst, IT Finance, Accounting","cadence":"Monthly after close; year-to-date at quarter end","inputs":"Monthly team cost and allocations (06.4.7-06.4.8), standard cost of completed work from Targetprocess (rate card version x effort), rate card of record, variance tolerance and revision triggers (06.4.1)","outputs":"Team x month tie-out, rate and volume variance report by team and cell, mid-year revision requests, audit trail of standard-vs-actual treatment","config":"Costing / TBM Studio: variance report (standard vs actual by team and cell), tie-out check, exception list; Targetprocess: rate card version on costed allocations","framework":"TBM: labor | ITFM | FinOps: variance","evidence":"Added v0.8 (labor rate card build); TBM Council labor cost guidance; ITFM standard-rate practice","eid":"P-0153","persona_list":["TBM Office & analysts","IT Finance & FP&A"],"cadence_bucket":"Monthly","products":["Costing"],"primary_product":"Costing","budgeting_method":null,"outcome":"a monthly proof that the portfolio numbers and the books describe the same labor cost","frameworks":["TBM: labor","ITFM","FinOps: variance"],"framework_tags":["TBM"],"completeness":9,"completeness_of":9,"flows":["UC1","UC2"],"lane":"TBM Office/IT Finance","bpmn_type":"Task"}],"eid":"G-064","extract_narrowed":false,"bpmn":{"id":"G06_4","kind":"l1","name":"06.4 Cost labor & capitalize","title":"Cost labor & capitalize","summary":"Process group 06.4 in L0-06 Cost Transparency & TBM Operations: 10 L2 processes laid out in the order of the catalog, in the BPMN lane of the persona that performs each one.","lanes":["TBM Office/IT Finance","Costing Admin"],"steps":[{"n":"06.4.1","type":"User task","lane":"TBM Office/IT Finance","task":"Define the labor rate structure","note":"Outcome: an agreed rate structure and poli
