<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Catalog of the business processes supported by IBM Apptio Targetprocess, Costing, Planning and Cloudability, framed by TBM, SPM and FinOps, with BPMN 2.0 diagrams for every area, group and cross-tool flow.">
<title>Apptio Process Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F4F1; --surface:#FFFFFF; --surface2:#EBEDE8; --ink:#1E2422; --ink2:#4B5450; --ink3:#78827D;
  --rule:#C9CDC4; --rule2:#DFE2DC; --accent:#1F5F4A; --accent-ink:#FFFFFF; --accent-soft:#E2EEE8;
  --tp:#3A6EA5; --co:#8C5A2B; --pl:#5B6E1F; --cl:#2A8C8C; --all:#5E5A72;
  --s-draft:#78827D; --s-review:#B7791F; --s-changes:#B4462E; --s-confirmed:#2F7A4B;
  --s-draft-bg:#EEF0EC; --s-review-bg:#FAF0DC; --s-changes-bg:#F9E4DE; --s-confirmed-bg:#DFF0E4;
  --focus:#1F5F4A; --shadow:0 1px 2px rgba(30,36,34,.08);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#181B1A; --surface:#202423; --surface2:#2A2F2D; --ink:#E8EAE6; --ink2:#B9BFBA; --ink3:#8B938E;
    --rule:#3A403D; --rule2:#2F3533; --accent:#7CC7A8; --accent-ink:#0F1F19; --accent-soft:#213A31;
    --tp:#7FAADB; --co:#C99A6C; --pl:#A5B85C; --cl:#5FBFBF; --all:#A9A4C2;
    --s-draft:#9AA39E; --s-review:#E0A94A; --s-changes:#E07A5F; --s-confirmed:#6FC48E;
    --s-draft-bg:#2A2F2D; --s-review-bg:#3A2F17; --s-changes-bg:#3D2420; --s-confirmed-bg:#1E3527;
    --focus:#7CC7A8; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#181B1A; --surface:#202423; --surface2:#2A2F2D; --ink:#E8EAE6; --ink2:#B9BFBA; --ink3:#8B938E;
  --rule:#3A403D; --rule2:#2F3533; --accent:#7CC7A8; --accent-ink:#0F1F19; --accent-soft:#213A31;
  --tp:#7FAADB; --co:#C99A6C; --pl:#A5B85C; --cl:#5FBFBF; --all:#A9A4C2;
  --s-draft:#9AA39E; --s-review:#E0A94A; --s-changes:#E07A5F; --s-confirmed:#6FC48E;
  --s-draft-bg:#2A2F2D; --s-review-bg:#3A2F17; --s-changes-bg:#3D2420; --s-confirmed-bg:#1E3527;
  --focus:#7CC7A8; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
h1{font:600 30px/1.15 var(--serif)}
h2{font:600 21px/1.2 var(--serif)}
h3{font:600 16px/1.3 var(--sans)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.eyebrow{font:500 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:8px 20px;flex-wrap:wrap}
.bar .crumbs{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumbs a{color:var(--ink2)}
.bar .crumbs .sep{color:var(--ink3)}
.bar .crumbs .here{color:var(--ink);font-weight:500}
.bar .crumbs .id{font-family:var(--mono);color:var(--ink3);font-size:12px}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;padding:6px 10px 6px 30px;border:1px solid var(--rule);border-radius:6px;background:var(--ground);min-height:32px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;fill:none;stroke:var(--ink3);stroke-width:2}
.search .results{position:absolute;top:36px;left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:60vh;overflow:auto;z-index:30}
.search .results a{display:block;padding:8px 10px;border-bottom:1px solid var(--rule2);color:var(--ink);font-size:13px}
.search .results a:hover,.search .results a.active{background:var(--accent-soft);text-decoration:none}
.search .results .k{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-right:6px}
.lens{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.lens button{background:var(--surface);border:0;padding:5px 11px;min-height:32px;cursor:pointer;color:var(--ink2);font-size:13px}
.lens button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.progress .track{width:110px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.progress .track i{display:block;height:100%}
.who{font-size:12px;color:var(--ink2);background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 9px;min-height:32px;cursor:pointer}
.who b{color:var(--ink);font-weight:500}

/* ---- page frame ---- */
.page{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.page.wide{max-width:1400px}
.pagehead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.pagehead p.lede{max-width:68ch;color:var(--ink2);margin:8px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:10px}
.meta .id{font-family:var(--mono);color:var(--ink3)}
.notice{background:var(--surface2);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;color:var(--ink2);border-radius:0 6px 6px 0;margin:0 0 20px}

/* ---- chips & status ---- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:4px 8px;border-radius:4px;border:1px solid var(--rule);background:var(--surface);color:var(--ink2);white-space:nowrap}
.chip.prod::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc)}
.chip.prod[data-p="Targetprocess"]{--pc:var(--tp)} .chip.prod[data-p="Costing"]{--pc:var(--co)} .chip.prod[data-p="Planning"]{--pc:var(--pl)} .chip.prod[data-p="Cloudability"]{--pc:var(--cl)} .chip.prod[data-p="All four"]{--pc:var(--all)}
.chip.flow{font-family:var(--mono);font-size:11px;background:var(--surface2);border-color:transparent}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status[data-s="draft"]{color:var(--s-draft);background:var(--s-draft-bg)}
.status[data-s="review"]{color:var(--s-review);background:var(--s-review-bg)}
.status[data-s="changes"]{color:var(--s-changes);background:var(--s-changes-bg)}
.status[data-s="confirmed"]{color:var(--s-confirmed);background:var(--s-confirmed-bg)}
select.status-sel{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 8px;min-height:28px;font-size:12px}

/* ---- hub / landscape ---- */
.landscape{display:grid;gap:14px;margin:8px 0 28px}
.band{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:14px 16px 16px;box-shadow:var(--shadow)}
.band .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.band .bhead h2{font:600 14px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.band .bhead span{font-size:12px;color:var(--ink3)}
.tiles{display:grid;gap:10px}
.band.steer .tiles,.band.enable .tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.band.core .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px 16px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);color:var(--ink);min-height:118px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:6px 0 0 6px;background:var(--pc)}
.tile[data-p="Targetprocess"]{--pc:var(--tp)} .tile[data-p="Costing"]{--pc:var(--co)} .tile[data-p="Planning"]{--pc:var(--pl)} .tile[data-p="Cloudability"]{--pc:var(--cl)} .tile[data-p="All four"]{--pc:var(--all)}
.tile:hover{text-decoration:none;border-color:var(--accent)}
.tile .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tile .t{font:600 14px/1.25 var(--sans);text-wrap:balance}
.tile .sub{font-size:12px;color:var(--ink3);margin-top:auto}
.tile .bar2{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface2)}
.tile .bar2 i{display:block;height:100%}
.tile.small{min-height:auto;padding:10px 12px 10px 16px}
.core-row{display:flex;align-items:center;gap:6px}
.core-row .arrow{color:var(--ink3);font-size:18px;flex:0 0 auto}
.flows-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.flowcard{display:flex;gap:12px;padding:12px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);color:var(--ink);align-items:flex-start}
.flowcard:hover{text-decoration:none;border-color:var(--accent)}
.flowcard .fid{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500;min-width:36px;padding-top:1px}
.flowcard > span:last-child{display:flex;flex-direction:column;min-width:0}
.flowcard .ft{font-weight:600;font-size:14px}
.flowcard .fs{font-size:12px;color:var(--ink3);margin-top:2px;display:block}
.flowcard .fp{display:flex;gap:4px;margin-top:6px}
.flowcard .fp i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hubgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.panel{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:16px 18px;box-shadow:var(--shadow)}
.panel h2{font:600 15px/1.3 var(--sans);margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.statlist{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(110px,auto);gap:10px;flex:0 0 auto}
@media (max-width:700px){.statlist{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);width:100%}}
.stat{padding:10px 12px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground)}
.stat b{display:block;font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink3)}

/* ---- L0 page ---- */
.l0{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;font-size:13px;padding-right:6px}
.rail .rh{font-size:12px;color:var(--ink3);margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase}
.rail ul{list-style:none;margin:0;padding:0}
.rail li a{display:block;padding:4px 8px;border-left:2px solid transparent;color:var(--ink2);border-radius:0 4px 4px 0}
.rail li a.g{font-weight:600;color:var(--ink);margin-top:6px}
.rail li a.p{padding-left:16px;font-size:12.5px}
.rail li a .id{font-family:var(--mono);color:var(--ink3);font-size:11px;margin-right:4px}
.rail li a:hover{background:var(--surface2);text-decoration:none}
.rail li a.on{border-left-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.group{margin:0 0 36px;scroll-margin-top:80px}
.ghead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:0 0 10px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.ghead h2{display:flex;gap:10px;align-items:baseline}
.ghead h2 .id{font:500 14px var(--mono);color:var(--ink3)}
.ghead .gmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.verdict{display:inline-flex;gap:6px;align-items:center}
.verdict select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px;min-height:28px}
.verdict input{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;min-height:28px;width:150px}
.record{border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin:0 0 14px;scroll-margin-top:80px;box-shadow:var(--shadow)}
.record.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;padding:14px 18px 10px}
.rhead .ttl{flex:1 1 320px;min-width:0}
.rhead h3{font:600 17px/1.3 var(--sans);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rhead h3 .id{font:500 13px var(--mono);color:var(--ink3)}
.rhead h3 a.perma{font:400 12px var(--mono);color:var(--ink3);opacity:0;transition:opacity .15s}
.rhead:hover h3 a.perma,.rhead h3 a.perma:focus{opacity:1}
.rhead .eid{font:400 11px var(--mono);color:var(--ink3);margin-top:2px}
.rhead .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.outcome{margin:0 18px 10px;padding:10px 12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.outcome b{font-weight:600;color:var(--accent)}
.sl{margin:0;padding:0 18px 14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;font-size:14px}
.sl > div{display:contents}
.sl dt{padding:7px 12px 7px 0;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--rule2)}
.sl dd{margin:0;padding:7px 0;border-top:1px solid var(--rule2)}
.sl dd .np{color:var(--ink3);font-style:italic}
.sl dd .chips{display:flex;flex-wrap:wrap;gap:5px}
.sl dd .raw{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.sl .io{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.sl .io .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:block}
.sl .io .arr{color:var(--ink3);padding-top:14px}
.sl dd.evidence{font-size:13px;color:var(--ink2)}
.record .foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:8px 18px 12px;border-top:1px solid var(--rule2);font-size:12px;color:var(--ink3)}
.record .foot .comp{display:inline-flex;align-items:center;gap:6px}
.record .foot .comp i{display:inline-block;width:70px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.record .foot .comp i b{display:block;height:100%;background:var(--accent)}
.comments{padding:0 18px 14px}
.comments summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 0;list-style:none;display:flex;gap:8px;align-items:center}
.comments summary::-webkit-details-marker{display:none}
.comments summary::before{content:"▸";font-size:11px;color:var(--ink3)}
.comments[open] summary::before{content:"▾"}
.comments .list{display:grid;gap:8px;margin:6px 0 10px}
.comment{padding:8px 10px;border:1px solid var(--rule2);border-radius:6px;background:var(--ground);font-size:13px}
.comment .ch{display:flex;gap:10px;font-size:11.5px;color:var(--ink3);margin-bottom:3px;flex-wrap:wrap}
.comment .ch b{color:var(--ink2);font-weight:500}
.comment .ch .at{font-family:var(--mono);background:var(--surface2);padding:0 5px;border-radius:3px}
.cform{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.cform select,.cform textarea,.cform button{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;min-height:32px}
.cform textarea{resize:vertical;min-height:32px}
.cform button{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:16px;border-top:1px solid var(--rule);font-size:14px;flex-wrap:wrap}
.prevnext a{display:inline-flex;flex-direction:column;gap:2px}
.prevnext a span{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.expand{font-size:13px;background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}

/* ---- register ---- */
.facets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.facets select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;min-height:32px;max-width:220px}
.facets .applied{display:flex;flex-wrap:wrap;gap:6px}
.facets .applied button{border:1px solid var(--rule);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;min-height:26px}
.facets .clear{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:4px}
.facets .density{margin-left:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
table.reg th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:500;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--rule);color:var(--ink2);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.reg th .dir{font-size:10px;color:var(--ink3);margin-left:4px}
table.reg td{padding:9px 10px;border-bottom:1px solid var(--rule2);vertical-align:top}
table.reg.compact td{padding:5px 10px}
table.reg td.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
table.reg td.exp{width:28px;padding-right:0}
table.reg td.exp button{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:13px;padding:0 4px;min-width:24px;min-height:24px}
table.reg tr.detail td{background:var(--ground);padding:0}
table.reg tr.detail .record{margin:10px;border-color:var(--rule2)}
table.reg td .chips{display:flex;flex-wrap:wrap;gap:4px}
table.reg td input[type=checkbox]{width:16px;height:16px}
.batch{display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0}
.batch select,.batch button{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;min-height:32px}
.batch button{cursor:pointer}
.count{font-size:13px;color:var(--ink3);margin:0 0 8px}

/* ---- flow page ---- */
.flowhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.lanes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.lanes span{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--rule);background:var(--surface)}
table.steps{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
table.steps th{text-align:left;font-weight:500;font-size:12px;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--rule);color:var(--ink2)}
table.steps td{padding:10px 12px;border-bottom:1px solid var(--rule2);vertical-align:top}

/* ---- BPMN diagram ---- */
.bpmn{margin:0 0 22px;padding:0}

@media print{.bpmn-x{display:none!important} .bpmn-scroll{overflow:visible;border:0;box-shadow:none} .bpmn svg{max-width:100%;width:100%!important}}

/* ---- glossary / changelog ---- */
.gloss{columns:2;column-gap:32px;font-size:14px}

.gloss dd{margin:2px 0 12px;color:var(--ink2);break-inside:avoid}
.release{margin:0 0 24px;padding:0 0 16px;border-bottom:1px solid var(--rule)}
.release h2{display:flex;gap:12px;align-items:baseline}
.release h2 .d{font:400 13px var(--mono);color:var(--ink3)}
.release ul{margin:8px 0 0;padding-left:20px}

/* ---- responsive ---- */
@media (max-width:1000px){
  .band.core .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hubgrid{grid-template-columns:1fr}
  .l0{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:6px}
  .rail ul{display:flex;flex-wrap:wrap;gap:2px}

}
@media (max-width:600px){
  .band.core .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}

  .sl dd{border-top:0;padding-top:2px}
  .sl .io{grid-template-columns:1fr}
  .sl .io .arr{display:none}
  .gloss{columns:1}
  .cform{grid-template-columns:1fr}

}

/* ---- print ---- */
@media print{
  .bar,.rail,.prevnext,.comments,.expand,.facets,.batch,.ctl,.who,.notice{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .page{max-width:none;padding:0}
  .l0{grid-template-columns:1fr}
  .group{break-before:page}
  .group:first-of-type{break-before:auto}

  a[href^="#/"]::after{content:""}
  .rhead h3 a.perma{opacity:1}
}

</style>

</header>
<main id="main" class="page"></main>


<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const L0S = DATA.l0s, FLOWS = DATA.flows;
const L0 = Object.fromEntries(L0S.map(l=>[l.id,l]));
const L1 = {}, L2 = {}, L2BYEID = {};
L0S.forEach(l0=>l0.l1s.forEach(l1=>{L1[l1.id]=l1; l1.l0=l0.id; l1.l2s.forEach(l2=>{L2[l2.id]=l2; L2BYEID[l2.eid]=l2; l2.l1=l1.id; l2.l0=l0.id;});}));
const ALL_L2 = Object.values(L2);
const FLOW = Object.fromEntries(FLOWS.map(f=>[f.id,f]));
const DECISIONS = DATA.decisions||[];
const DEC = Object.fromEntries(DECISIONS.map(d=>[d.key,d]));
const OPT = (key,id)=>{ const d=DEC[key]; return d && d.options.find(o=>o.id===id); };
const STATUS ={draft:'Draft',review:'In review',changes:'Changes requested',confirmed:'Confirmed'};
const VERDICT = {'':'No verdict yet',confirmed:'Confirmed',updated:'Updated',flagged:'Flagged'};
const PCOLOR = {Targetprocess:'var(--tp)',Costing:'var(--co)',Planning:'var(--pl)',Cloudability:'var(--cl)','All four':'var(--all)'};
const BUSINESS_FIELDS = ['inputs','description','outcome','who','where','cadence'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,el=document)=>el.querySelector(s);
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- review state (shared via db when available, local otherwise) ----------
const review = {statuses:{}, verdicts:{}, owners:{}, comments:{}};   // by element id
let db = null, dbReady = false, shared = false;
let lens = ls.get('lens','business');
let reviewer = ls.get('reviewer','');
const localReview = ls.get('review',{statuses:{},verdicts:{},owners:{},comments:{}});
Object.assign(review, localReview);

function reviewDocName(eid){ return eid; }
async function saveReview(eid, patch){
  const cur = Object.assign({}, review.statuses[eid]?{status:review.statuses[eid]}:{}, review.verdicts[eid]||{}, review.owners[eid]?{owner:review.owners[eid]}:{});
  const body = Object.assign(cur, patch, {by:reviewer||'anonymous', at:new Date().toISOString()});
  applyReviewDoc(eid, body);
  if(db){ try{ await db.doc('review/'+eid).set(body);}catch(e){ console.warn('db write failed',e); } }
  else { ls.set('review', review); }
  renderProgress(); refreshInline(eid);
}
function applyReviewDoc(eid, d){
  if(!d) return;
  if(d.status) review.statuses[eid]=d.status;
  if('verdict' in d) review.verdicts[eid]={verdict:d.verdict||'',note:d.note||'',by:d.by,at:d.at};
  if('owner' in d) review.owners[eid]=d.owner||'';
}
async function addComment(eid, attr, text){
  const c = {by:reviewer||'anonymous', at:new Date().toISOString(), attr:attr||'', text};
  const list = (review.comments[eid]||[]).concat([c]);
  review.comments[eid]=list;
  if(db){ try{ await db.doc('comments/'+eid).set({items:list}); }catch(e){ console.warn(e);} }
  else ls.set('review', review);
  refreshInline(eid);
}
function refreshInline(eid){
  document.querySelectorAll('[data-eid="'+eid+'"]').forEach(el=>{
    const l2 = L2BYEID[eid];
    if(l2){ const holder=el; const fresh=document.createElement('div'); fresh.innerHTML=recordHTML(l2); holder.replaceWith(fresh.firstElementChild); }
    else if(el.classList.contains('ghead')){ const l1=Object.values(L1).find(g=>g.eid===eid); if(l1){const f=document.createElement('div'); f.innerHTML=gheadHTML(l1); el.replaceWith(f.firstElementChild);} }
  });
  document.querySelectorAll('.tile').forEach(t=>{ const l0=L0[t.dataset.l0]; if(l0) t.querySelector('.bar2').innerHTML=barHTML(l0); });
}
function statusOf(l2){ return review.statuses[l2.eid]||'draft'; }
function counts(l2s){ const c={draft:0,review:0,changes:0,confirmed:0}; l2s.forEach(x=>c[statusOf(x)]++); return c; }
function barHTML(l0){
  const l2s = l0.l1s.flatMap(g=>g.l2s), c=counts(l2s), n=l2s.length;
  return ['confirmed','changes','review','draft'].map(k=>`<i style="width:${(c[k]/n*100).toFixed(1)}%;background:var(--s-${k})" title="${STATUS[k]}: ${c[k]}"></i>`).join('');
}
function renderProgress(){
  const c=counts(ALL_L2), n=ALL_L2.length;
  $('#progress').innerHTML = `<span>${c.confirmed}/${n} confirmed</span><span class="track">${['confirmed','changes','review','draft'].map(k=>`<i style="width:${(c[k]/n*100).toFixed(1)}%;background:var(--s-${k})"></i>`).join('')}</span>${shared?'<span title="Statuses, verdicts and comments are shared with everyone who opens this page">shared</span>':'<span title="Not connected to shared review state — saved in this browser only">local</span>'}`;
}

// ---------- db wiring ----------
async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
    if(!db) return;
    shared = true;
    db.collection('review').onSnapshot(snap=>{
      snap.docs.forEach(d=>applyReviewDoc(d.id, d.data()));
      dbReady = true; renderProgress(); softRender();
    }, e=>{ console.warn('review subscription ended', e); });
    db.collection('comments').onSnapshot(snap=>{
      snap.docs.forEach(d=>{ review.comments[d.id]=(d.data()||{}).items||[]; });
      softRender();
    }, e=>{ console.warn('comments subscription ended', e); });
    renderProgress();
  }catch(e){ console.warn('db unavailable', e); }
}

let pendingRender=false;
function softRender(){
  const ae=document.activeElement;
  if(ae && /textarea|input/i.test(ae.tagName) && ae.closest('#main')){ pendingRender=true; ae.addEventListener('blur',()=>{ if(pendingRender){pendingRender=false; softRender();} },{once:true}); return; }
  const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y});
}

// ---------- customer profile (one choice per design decision) ----------
// profile = {decisionKey: [optionId,...]}; unset decisions fall back to the register default.
let profile = ls.get('profile', {});
const variantView = {};   // `${l2.id}|${decisionKey}` -> optionId the reader is looking at
function activeOpts(key){ const d=DEC[key]; if(!d) return []; const p=profile[key]; return (p && p.length)? p.filter(o=>OPT(key,o)) : [d.default]; }
function profileSet(){ return Object.keys(profile).filter(k=>DEC[k] && profile[k] && profile[k].length); }
function matches(when){ if(!when) return true; return Object.entries(when).every(([k,opts])=>{ if(!profileSet().includes(k)) return true; /* unset decision: everything stays on-path */ const a=activeOpts(k); return !a.length || opts.some(o=>a.includes(o)); }); }
function onPath(l2){ return matches(l2.applies_when); }
function variantsOf(l2,key){ return (l2.variants||[]).filter(v=>v.decision===key); }
function activeVariant(l2,key){
  const vs=variantsOf(l2,key); if(!vs.length) return null;
  const want=variantView[l2.id+'|'+key];
  if(want){ const v=vs.find(x=>x.option===want); if(v) return v; }
  for(const o of activeOpts(key)){ const v=vs.find(x=>x.option===o); if(v) return v; }
  return vs.find(x=>x.option===DEC[key].default) || vs[0];
}
function effective(l2){
  // base record with the active variant of each decision merged over it
  const eff=Object.assign({}, l2); const over={};
  (l2.decisions||[]).forEach(k=>{ const v=activeVariant(l2,k); if(v){ Object.entries(v).forEach(([f,val])=>{ if(f!=='decision'&&f!=='option'){ eff[f]=val; over[f]=k; } }); } });
  eff._over=over; return eff;
}
function condText(when){ return Object.entries(when||{}).map(([k,opts])=>`${DEC[k]?DEC[k].name:k}: ${opts.map(o=>{const x=OPT(k,o);return x?x.name:o;}).join(' / ')}`).join('; '); }
function setProf(){ const n=profileSet().length; const el=$('#prof'); el.classList.toggle('set',n>0); el.innerHTML=`<i></i>Profile: <b>${n?n+' choice'+(n>1?'s':''):'default'}</b>`; }
function saveProfile(){ ls.set('profile',profile); setProf(); }
function rerenderKeep(){ const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y}); }

// ---------- helpers ----------
function prodChips(l2){ return l2.products.map(p=>`<span class="chip prod" data-p="${p}">${p}</span>`).join('') || `<span class="chip prod" data-p="${esc(l2.primary_product)}">${esc(l2.primary_product)}</span>`; }
function flowChips(l2){ return l2.flows.map(f=>`<a class="chip flow" href="#/flow/${f}" title="${esc(FLOW[f].title)}">${f} · ${esc(FLOW[f].name)}</a>`).join(''); }
function np(v){ return v? esc(v) : '<span class="np">Not provided</span>'; }
function link(id){ const l2=L2[id]; return l2?`<a href="#/l0/${l2.l0}/${id}" title="${esc(l2.name)}">${id}</a>`:esc(id); }
function crossref(text){ return esc(text).replace(/\b(\d\d\.\d\.\d)\b/g,(m)=>L2[m]?`<a href="#/l0/${L2[m].l0}/${m}">${m}</a>`:m); }

// ---------- record ----------
function approachRows(l2, eff){
  // one "Approach" row per design decision the record is bound to
  const rows=[];
  (l2.decisions||[]).forEach(k=>{
    const d=DEC[k]; if(!d) return;
    const vs=variantsOf(l2,k); const act=activeVariant(l2,k); const chosen=activeOpts(k);
    if(vs.length){
      const tabs=vs.map(v=>{ const o=OPT(k,v.option); return `<button type="button" data-variant="${l2.id}|${k}|${v.option}" aria-pressed="${act&&act.option===v.option}" class="${chosen.includes(v.option)?'chosen':''}" title="${esc(o?o.summary:'')}">${esc(o?o.name:v.option)}</button>`; }).join('');
      const vname = act && act.name && act.name!==l2.name ? `<p class="vname">Under this approach: <b>${esc(act.name)}</b></p>` : '';
      rows.push(`<div><dt>Approach</dt><dd><div class="tabs"><span class="dk"><a href="#/decisions/${k}" title="${esc(d.question)}">${d.id} ${esc(d.name)}</a></span>${tabs}</div>${vname}${sme()?`<span class="raw">✓ = chosen in the current profile. Fields marked with a green edge come from this approach; the rest are common to every approach.</span>`:''}</dd></div>`);
    } else {
      rows.push(`<div><dt>Approach</dt><dd><span class="cond">Shaped by <a href="#/decisions/${k}">${d.id} ${esc(d.name)}</a></span> <span style="font-size:12.5px;color:var(--ink2)">— ${esc(d.question)}</span></dd></div>`);
    }
  });
  if(l2.applies_when) rows.push(`<div><dt>Applies when</dt><dd><span class="cond">${esc(condText(l2.applies_when))}</span>${onPath(l2)?'':' <span style="font-size:12px;color:var(--s-review)">— not selected in the current profile</span>'}</dd></div>`);
  return rows;
}
const sme = ()=>lens==='sme';
function recordHTML(l2, opts={}){
  const st = statusOf(l2), smeL = lens==='sme';
  const v = review.verdicts[l2.eid];
  const comments = review.comments[l2.eid]||[];
  const e = effective(l2), ov = e._over;
  const V = f => ov[f]?' class="var"':'';           // mark fields supplied by the active variant
  const rows = [];
  rows.push(...approachRows(l2, e));

  }

  const off = !onPath(l2);
  return `<article class="record${opts.target?' target':''}${off?' off':''}" id="rec-${l2.id}" data-eid="${l2.eid}" aria-labelledby="h-${l2.id}">

function filtered(){
  const f=facetState;
  let rows = ALL_L2.filter(x=>
    (!f.l0 || f.l0.startsWith('L0-'+x.l0)) && (!f.product || x.products.includes(f.product)) && (!f.persona || x.persona_list.includes(f.persona)) &&
    (!f.cadence || x.cadence_bucket===f.cadence) && (!f.flow || x.flows.includes(f.flow)) && (!f.framework || x.framework_tags.includes(f.framework)) &&
    (!f.method || x.budgeting_method===f.method) && (!f.decision || (x.decisions||[]).some(k=>f.decision.startsWith(DEC[k].id+' '))) && (!f.status || STATUS[statusOf(x)]===f.status));
  const key = sortKey==='status'? x=>Object.keys(STATUS).indexOf(statusOf(x)) : sortKey==='l1'? x=>x.l1 : x=>x[sortKey];
  rows.sort((a,b)=>{const ka=key(a),kb=key(b);return (ka>kb?1:ka<kb?-1:0)*sortDir;});
  return rows;
}

// ---------- BPMN: layout, SVG rendering, BPMN 2.0 XML export ----------
const BP = {laneHead:150, colW:208, nodeW:162, taskH:74, laneBase:122, slotH:96, padX:28, evR:18, gwR:24};

function bpmnKind(type){
  const t=(type||'').toLowerCase();
  if(t.startsWith('start')) return t.includes('timer')?'startTimer':'start';
  if(t.startsWith('end')) return 'end';
  if(t.includes('gateway')) return t.includes('parallel')?'gwPar':'gwXor';
  if(t.startsWith('user')) return 'user';
  if(t.startsWith('service')) return 'service';
  if(t.startsWith('send')) return 'send';
  if(t.startsWith('sub')) return 'sub';
  return 'task';
}
function bpmnLayout(f){
  const lanes = f.lanes.slice();
  const laneIx = Object.fromEntries(lanes.map((l,i)=>[l,i]));
  const nodes=[], edges=[], byN={};
  let col=-1, group=null, prevStep=null; // group: {base, members:[]}
  const isBranch = n => /^[a-z]?\d+[a-z]$/.test(n);
  const baseOf = n => n.slice(0,-1);
  const slotUse = {}; // `${lane}|${col}` -> count
  const place = (node)=>{ const k=node.lane+'|'+node.col; node.slot=slotUse[k]||0; slotUse[k]=node.slot+1; };
  const steps = f.steps.slice();
  if(!/^start/i.test(steps[0].type)) steps.unshift({n:'',type:'Start event',lane:steps[0].lane,task:'',l2:[],implicit:true});
  if(!/^end/i.test(steps[steps.length-1].type)) steps.push({n:'',type:'End event',lane:steps[steps.length-1].lane,task:'',l2:[],implicit:true});
  steps.forEach((s,i)=>{
    const kind=bpmnKind(s.type);
    const node={id:s.implicit?('n_'+kind+'_implicit'):('n_'+s.n.replace(/[^\w]/g,'_')), n:s.n, kind, label:s.task, lane:laneIx[s.lane]??0, l2:s.l2, note:s.note||'', type:s.type, href:s.href||null};
    // v0.7: profile awareness — a step with `when`, or a group-diagram task whose L2 has applies_when, is off-path when the profile doesn't select it
    const cond = s.when || (s.l2 && s.l2.length===1 && L2[s.l2[0]] && L2[s.l2[0]].applies_when) || null;
    if(cond){ node.cond=cond; node.off=!matches(cond); }
    if(s.decision && DEC[s.decision]){ node.decision=DEC[s.decision]; node.note=(node.note?node.note+' — ':'')+DEC[s.decision].id+' '+DEC[s.decision].name+': '+DEC[s.decision].question; }
    if(isBranch(s.n) && byN[baseOf(s.n)]){
      if(!group || group.base!==baseOf(s.n)){ group={base:baseOf(s.n), members:[]}; col++; }
      node.col=col; group.members.push(node);
    } else {
      col++; node.col=col;
      if(group && group.members.length){ group.members.forEach(m=>edges.push({from:m.id,to:node.id})); group=null; }
      else if(prevStep){ const prev=prevStep; const e={from:prev.id,to:node.id}; if(prev.kind.startsWith('gw')) e.label=prev.yesLabel||'Yes'; edges.push(e); }
    }
    place(node); nodes.push(node); if(s.n) byN[s.n]=node; prevStep=node;
    if(isBranch(s.n) && byN[baseOf(s.n)]){
      const gw=byN[baseOf(s.n)]; const labels=gw.branchLabels||[]; edges.push({from:gw.id,to:node.id,label:labels[group.members.length-1]||''});
    }
    if(kind.startsWith('gw')){
      const m=node.note.match(/(?:^|;\s*)(Yes|No)\s*:\s*([^;]+)/gi)||[];

    else if(n.kind.startsWith('gw')){ n.w=BP.gwR*2; n.h=BP.gwR*2; }

function wrapText(s, maxChars, maxLines){
  const words=String(s).split(/\s+/), lines=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxChars && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ lines.length=maxLines; lines[maxLines-1]=lines[maxLines-1].replace(/.{2}$/,'')+'…'; }
  return lines;
}

  if(kind==='service') return `<g transform="translate(${x},${y})" ${c}><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="6" r="5.2" stroke-dasharray="2 1.6"/></g>`;
  if(kind==='send') return `<g transform="translate(${x},${y})"><rect width="13" height="9" rx="1" fill="currentColor"/><path d="M0.5 1l6 4.5 6-4.5" stroke="var(--surface)" stroke-width="1.2" fill="none"/></g>`;
  return '';

function bpmnSVG(f, laneColor){
  const L=bpmnLayout(f);
  const laneEls = L.lanes.map((name,i)=>{
    const y=L.laneY[i], h=L.laneH[i], lines=wrapText(name,18,3);

    const href = n.href || (n.l2 && n.l2.length && L2[n.l2[0]] ? `#/l0/${L2[n.l2[0]].l0}/${n.l2[0]}` : null);

    if(n.kind==='start'||n.kind==='startTimer'||n.kind==='end'){
      const thick=n.kind==='end'?3:1.5;
      body=`<circle cx="${n.cx}" cy="${n.cy}" r="${BP.evR}" fill="var(--ground)" stroke="currentColor" stroke-width="${thick}"/>`;
      if(n.kind==='startTimer') body+=`<circle cx="${n.cx}" cy="${n.cy}" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M${n.cx} ${n.cy-7}v7h5" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
      const lines=wrapText(n.label,22,2);
      body+=`<text x="${n.cx}" y="${n.cy+BP.evR+13}" text-anchor="middle" font-size="10.5" fill="currentColor">${lines.map((t,k)=>`<tspan x="${n.cx}" dy="${k?12:0}">${esc(t)}</tspan>`).join('')}</text>`;
    } else if(n.kind.startsWith('gw')){

      const lines=wrapText(n.label,24,2);

      body+=`<text x="${n.cx+r+4}" y="${n.cy+r+2}" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="var(--mono)">${esc(n.n)}</text>`;

      if(n.kind==='sub') body+=`<rect x="${n.cx-6}" y="${n.y+n.h-14}" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M${n.cx-3} ${n.y+n.h-8}h6M${n.cx} ${n.y+n.h-11}v6" stroke="currentColor" stroke-width="1.2"/>`;
      if(n.kind==='send') body+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" transform="translate(3,3)" opacity=".5"/>`;
      body+=bpmnIcon(n.kind,n.x+8,n.y+7);

      const ty=n.y+18+(n.h-18)/2+4-(lines.length-1)*6.5;

    const off=(L.byId[e.to]&&L.byId[e.to].off)||(L.byId[e.from]&&L.byId[e.from].off);
    return `<g${off?' opacity=".32"':''}><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#bp-arrow-${f.id})"/>${lab}</g>`;

  const what = f.kind==='l1' ? `Process group ${esc(f.name)} as BPMN 2.0: one lane per persona from the area's default lanes, one task per L2 process in catalog order (person icon = user task, dashed gear = service task, envelope = send task). Click a task to jump to its record.`
             : f.kind==='l0' ? `Area ${esc(f.name)} as BPMN 2.0: each box is a collapsed sub-process (one per process group) placed in the lane of the persona that performs most of its work. Click a box to jump to that group.`
             : `${esc(f.id)} as BPMN 2.0: pool "${esc(f.title)}", one lane per system or role, steps left to right. Rounded boxes are tasks (person icon = user task, dashed gear = service task, envelope = send task across the ADM data highway), diamonds are exclusive gateways, thin circles start the flow and thick circles end it. Click any task to open the catalog process it invokes.`;
  return `<figure class="bpmn"><div class="bpmn-scroll"><svg viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" role="img" aria-label="${esc(aria)}" style="font-family:var(--sans)">
    <defs><marker id="bp-arrow-${f.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
    ${laneEls}${edgeEls}${nodeEls}</svg></div>

    const inner = (doc?`\n      <bpmn:documentation>${x(doc)}</bpmn:documentation>`:'')+(inc[n.id]||[]).map(i=>`\n      <bpmn:incoming>${i}</bpmn:incoming>`).join('')+(out[n.id]||[]).map(o=>`\n      <bpmn:outgoing>${o}</bpmn:outgoing>`).join('')+(n.kind==='startTimer'?`\n      <bpmn:timerEventDefinition />`:'');
    return `    <bpmn:${tag[n.kind]} id="${n.id}" name="${x(n.label)}">${inner}\n    </bpmn:${tag[n.kind]}>`;
  }).join('\n');
  const flowXml = L.edges.map(e=>`    <bpmn:sequenceFlow id="${e.id}" sourceRef="${e.from}" targetRef="${e.to}"${e.label?` name="${x(e.label)}"`:''} />`).join('\n');

    .concat(L.lanes.map((_,i)=>`      <bpmndi:BPMNShape id="Lane_${f.id}_${i}_di" bpmnElement="Lane_${f.id}_${i}" isHorizontal="true"><dc:Bounds x="30" y="${L.laneY[i]}" width="${L.W-30}" height="${L.laneH[i]}" /></bpmndi:BPMNShape>`))
    .concat(L.nodes.map(n=>`      <bpmndi:BPMNShape id="${n.id}_di" bpmnElement="${n.id}"${n.kind==='sub'?' isExpanded="false"':''}><dc:Bounds x="${n.x.toFixed(0)}" y="${n.y.toFixed(0)}" width="${n.w}" height="${n.h}" /></bpmndi:BPMNShape>`))
    .concat(L.edges.map(e=>`      <bpmndi:BPMNEdge id="${e.id}_di" bpmnElement="${e.id}">${e.pts.map(p=>`<di:waypoint x="${p[0].toFixed(0)}" y="${p[1].toFixed(0)}" />`).join('')}</bpmndi:BPMNEdge>`)).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>

  </bpmn:collaboration>

${laneXml}

function diagramsHTML(){
  const card = (f, href, sub) => { const files=diagramFiles(f); return `<div class="card"><h3><a href="${href}">${esc(f.kind?f.name:f.id+' · '+f.name)}</a></h3><div class="sub">${esc(sub)}</div><div class="dl"><a href="${files.bpmn}" download>.bpmn</a><a href="${files.svg}" download>.svg</a><a href="viewer.html#${encodeURIComponent(files.bpmn)}">editor</a></div></div>`; };
  const nA=L0S.filter(l=>l.bpmn).length, nG=Object.values(L1).filter(g=>g.bpmn).length;
  return `<div class="pagehead"><div><p class="eyebrow">BPMN 2.0 diagrams · v${DATA.version}</p><h1>All ${nA+nG+FLOWS.length} diagrams</h1><p class="lede">One swimlane diagram per process area (${nA}), per process group (${nG}) and per cross-tool flow (${FLOWS.length}). Every diagram is generated from the catalog data: the live version is drawn on its page, and the same layout is exported as importable BPMN XML (with diagram interchange) and as an SVG snapshot. Hand-refined models live in <code>diagrams/bpmn/custom/</code> and are listed first in the <a href="viewer.html">editor</a>.</p></div></div>
  <h2 style="margin:0 0 10px">Cross-tool flows</h2><div class="diagrid">${FLOWS.map(f=>card(f,'#/flow/'+f.id,f.title+' · '+f.steps.length+' steps · '+f.lanes.length+' lanes')).join('')}</div>
  <h2 style="margin:24px 0 10px">Process areas</h2><div class="diagrid">${L0S.filter(l=>l.bpmn).map(l=>card(l.bpmn,'#/l0/'+l.id,l.l1s.length+' groups as sub-processes · lanes: '+l.bpmn.lanes.join(', '))).join('')}</div>
  <h2 style="margin:24px 0 10px">Process groups</h2><div class="diagrid">${L0S.flatMap(l=>l.l1s.filter(g=>g.bpmn).map(g=>card(g.bpmn,'#/l0/'+l.id+'/'+g.id,g.l2s.length+' processes · lanes: '+g.bpmn.lanes.join(', ')))).join('')}</div>`;
}
function decisionsHTML(){
  const smeL = lens==='sme';
  const n = profileSet().length;
  const summary = DECISIONS.map(d=>{ const a=activeOpts(d.key); const set=profileSet().includes(d.key); return `<a class="${set?'set':''}" href="#/decisions/${d.key}" title="${esc(d.question)}">${d.id} ${esc(d.name)}: ${esc(a.map(o=>OPT(d.key,o).name).join(' + '))}${set?'':' (default)'}</a>`; }).join('');
  const card = d => {
    const chosen = activeOpts(d.key); const set = profileSet().includes(d.key);
    const mark = id => { const l2=L2[id]; if(!l2) return esc(id); const cls = variantsOf(l2,d.key).length?'v':(l2.applies_when&&l2.applies_when[d.key]?'c':''); const t = cls==='v'?`${variantsOf(l2,d.key).length} variants on record`:cls==='c'?`only under ${condText({[d.key]:l2.applies_when[d.key]})}`:'listed as affected'; return `<a class="${cls}" href="#/l0/${l2.l0}/${id}" title="${esc(l2.name)} — ${esc(t)}">${id}</a>`; };
    const opts = d.options.map(o=>`<label class="opt${chosen.includes(o.id)?' on':''}"><input type="${d.multi?'checkbox':'radio'}" name="prof-${d.key}" value="${o.id}" data-profile="${d.key}"${chosen.includes(o.id)?' checked':''} aria-label="${esc(o.name)}"><div><div class="on-name">${esc(o.name)}${o.id===d.default?'<span class="def">catalog default</span>':''}</div><div class="os">${crossref(o.summary)}</div><div class="of"><b>Fits:</b> ${crossref(o.fit)}</div>${smeL?`<div class="of"><b>Prerequisites:</b> ${crossref(o.prereqs)}</div><div class="of"><b>Trade-offs:</b> ${crossref(o.tradeoffs)}</div><div class="of"><b>Evidence:</b> ${esc(o.evidence)}</div>`:''}</div></label>`).join('');
    return `<section class="deccard" id="${d.key}" aria-labelledby="dh-${d.key}">
      <div class="dh"><span class="id">${d.id}</span><h2 id="dh-${d.key}">${esc(d.name)}</h2><span class="chip">${esc(d.domain)}</span>${d.multi?'<span class="chip" title="A customer can select more than one option, e.g. per team kind or decision unit">pick one or more</span>':'<span class="chip">pick one</span>'}${set?'<span class="status" data-s="confirmed">set in profile</span>':'<span class="status" data-s="draft">default</span>'}</div>
      <p class="q">${esc(d.question)}</p>
      <p class="why">${crossref(d.why)}</p>
      <div class="opts">${opts}</div>
      <div class="aff"><span>Shapes:</span>${d.affects.map(mark).join('')}${d.flows.length?`<span style="margin-left:8px">Flows:</span>${d.flows.map(f=>`<a class="chip flow" href="#/flow/${f}">${f}</a>`).join('')}`:''}${d.related.length?`<span style="margin-left:8px">Related:</span>${d.related.map(k=>`<a href="#/decisions/${k}" style="font-family:var(--sans)">${DEC[k]?DEC[k].id+' '+esc(DEC[k].name):k}</a>`).join('')}`:''}</div>
      <p style="font-size:11.5px;color:var(--ink3);margin:8px 0 0">Solid outline = the process has a variant per option · dashed = the process only exists under some options · plain = listed as affected, no variant text yet.</p>
    </section>`;
  };
  return `<div class="pagehead"><div><p class="eyebrow">Design decisions · v${DATA.version}</p><h1>Decisions &amp; customer profile</h1><p class="lede">A customer makes each of these choices once — usually in discovery — and the choice ripples through several processes and flows. Pick the options that match a customer and the whole catalog renders for that profile: records open on the matching approach, processes that do not apply under the chosen options are dimmed, and off-path steps fade on the diagrams. Decisions you have not set stay neutral — every process and step remains on the path — and nothing is ever filtered away, so the alternatives stay one click away.</p></div>
  <div class="statlist"><div class="stat"><b>${DECISIONS.length}</b><span>decisions</span></div><div class="stat"><b>${DECISIONS.reduce((a,d)=>a+d.options.length,0)}</b><span>options</span></div><div class="stat"><b>${ALL_L2.reduce((a,x)=>a+(x.variants||[]).length,0)}</b><span>variants</span></div><div class="stat"><b>${ALL_L2.filter(x=>x.decisions).length}</b><span>processes shaped</span></div></div></div>
  <div class="profbar"><b>Profile:</b> ${n?`${n} of ${DECISIONS.length} decisions set`:'catalog defaults'} <span style="flex:1"></span><button type="button" data-profile-copy>Copy profile as JSON</button><button type="button" data-profile-paste>Paste profile</button><button type="button" data-profile-reset${n?'':' disabled'}>Reset to defaults</button></div>
  <nav class="decnav" aria-label="Decisions">${summary}</nav>
  ${DECISIONS.map(card).join('')}`;
}
function glossaryHTML(){ return `<div class="pagehead"><div><p class="eyebrow">Glossary</p><h1>Terms &amp; acronyms</h1><p class="lede">Every acronym used in the catalog. Business reviewers should be able to read any record with this page open beside it.</p></div></div><dl class="gloss">${DATA.glossary.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>`; }
function changelogHTML(){ return `<div class="pagehead"><div><p class="eyebrow">Changelog</p><h1>What changed</h1><p class="lede">Versioned major.minor.release. Changes are keyed to hierarchy IDs and, where they matter, permanent element IDs.</p></div></div>${DATA.changelog.map(r=>`<section class="release"><h2>v${r.version} <span class="d">${r.date}</span></h2><ul>${r.items.map(i=>`<li>${crossref(i)}</li>`).join('')}</ul></section>`).join('')}`; }
function printHTML(){ return `<div class="pagehead"><div><p class="eyebrow">Print view · v${DATA.version}</p><h1>Apptio Process Catalog</h1><p class="lede">All areas expanded. Use your browser's print command; each group starts a new page.</p></div></div>${L0S.map(l0=>`<h1 style="margin:32px 0 12px">L0-${l0.id} ${esc(l0.name)}</h1><p style="max-width:70ch;color:var(--ink2)">${esc(l0.description)}</p>${l0.bpmn?diagramBlock(l0.bpmn,{bare:true}):''}${l0.l1s.map(g=>`<section class="group">${gheadHTML(g)}${g.bpmn?diagramBlock(g.bpmn,{bare:true}):''}${g.l2s.map(p=>recordHTML(p)).join('')}</section>`).join('')}`).join('')}`; }

// ---------- routing ----------
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(!parts.length) return {page:'hub'};
  if(parts[0]==='l0' && L0[parts[1]]) return {page:'l0', l0:L0[parts[1]], target:parts[2]||null};
  if(parts[0]==='register') return {page:'register'};
  if(parts[0]==='flow' && FLOW[parts[1]]) return {page:'flow', flow:FLOW[parts[1]]};
  if(parts[0]==='decisions') return {page:'decisions', target:parts[1]||null};
  if(parts[0]==='glossary') return {page:'glossary'};
  if(parts[0]==='diagrams') return {page:'diagrams'};
  if(parts[0]==='changelog') return {page:'changelog'};
  if(parts[0]==='print') return {page:'print'};
  return {page:'hub'};
}
let lastKey='', suppressScroll=false;
function render(){
  const r = route();
  const main = $('#main');
  main.className = 'page' + (r.page==='register'?' wide':'');
  let crumbs = `<a href="#/">Catalog</a>`;
  let title = 'Apptio Process Catalog';
  if(r.page==='hub'){ main.innerHTML = hubHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Landscape</span>`; }
  else if(r.page==='l0'){
    main.innerHTML = l0HTML(r.l0, r.target);
    crumbs += ` <span class="sep">/</span> <a href="#/l0/${r.l0.id}"><span class="id">L0-${r.l0.id}</span> ${esc(r.l0.short)}</a>`;
    if(r.target && L2[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L2[r.target].name)}</span>`;
    else if(r.target && L1[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L1[r.target].name)}</span>`;
    title = `L0-${r.l0.id} ${r.l0.name}`;
    const key = r.l0.id+'/'+(r.target||'');
    if(r.target && key!==lastKey && !suppressScroll){ const el = document.getElementById((L2[r.target]?'rec-':'g-')+r.target+(L2[r.target]?'':'-sec')); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:'start'})); }
    lastKey = key; setupSpy();
  }
  else if(r.page==='register'){ main.innerHTML = registerHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Register</span>`; title='Register'; }
  else if(r.page==='flow'){ main.innerHTML = flowHTML(r.flow); crumbs += ` <span class="sep">/</span> <span>Flows</span> <span class="sep">/</span> <span class="here"><span class="id">${r.flow.id}</span> ${esc(r.flow.name)}</span>`; title=r.flow.id+' '+r.flow.name; }
  else if(r.page==='diagrams'){ main.innerHTML = diagramsHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Diagrams</span>`; title='Diagrams'; }
  else if(r.page==='decisions'){ main.innerHTML = decisionsHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Decisions</span>`; title='Decisions';
    const key = r.page+'/'+(r.target||'');
    if(r.target && DEC[r.target] && key!==lastKey && !suppressScroll){ const el=document.getElementById(r.target); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:'start'})); }
    else if(!r.target && key!==lastKey && !suppressScroll) window.scrollTo({top:0});
    lastKey = key; $('#crumbs').innerHTML = crumbs; document.title = title+' · Apptio Process Catalog'; return; }
  else if(r.page==='glossary'){ main.innerHTML = glossaryHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Glossary</span>`; }
  else if(r.page==='changelog'){ main.innerHTML = changelogHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Changelog</span>`; }
  else if(r.page==='print'){ main.innerHTML = printHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Print view</span>`; }
  $('#crumbs').innerHTML = crumbs;
  document.title = title + ' · Apptio Process Catalog';
  if(r.page!=='l0') { lastKey=''; if(!suppressScroll) window.scrollTo({top:0}); }
}
let spyObs=null;
function setupSpy(){
  if(spyObs) spyObs.disconnect();
  const links = [...document.querySelectorAll('.rail a[data-spy]')];
  if(!links.length) return;
  const byId = Object.fromEntries(links.map(a=>[a.dataset.spy,a]));
  spyObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.remove('on')); const a=byId[e.target.id]; if(a){a.classList.add('on'); } } });
  },{rootMargin:'-70px 0px -70% 0px',threshold:0});
  links.forEach(a=>{const el=document.getElementById(a.dataset.spy); if(el) spyObs.observe(el);});
}

// ---------- search ----------
const INDEX = ALL_L2.map(x=>({id:x.id,eid:x.eid,l0:x.l0,name:x.name,text:(x.id+' '+x.eid+' '+x.name+' '+x.description+' '+(x.config||'')+' '+(x.personas||'')+' '+x.tool+' '+(x.evidence||'')).toLowerCase()}))
  .concat(FLOWS.map(f=>({flow:f.id,name:f.id+' · '+f.name+' — '+f.title,text:(f.id+' '+f.name+' '+f.title+' '+f.summary).toLowerCase()})))
  .concat(Object.values(L1).map(g=>({g:g.id,l0:g.l0,name:g.id+' '+g.name,text:(g.id+' '+g.eid+' '+g.name+' '+(g.original_name||'')).toLowerCase()})))
  .concat(DECISIONS.map(d=>({dec:d.key,name:d.id+' · '+d.name+' — '+d.question,text:(d.id+' '+d.key+' '+d.name+' '+d.question+' '+d.domain+' '+d.options.map(o=>o.id+' '+o.name+' '+o.summary+' '+o.fit).join(' ')).toLowerCase()})));
// variant text is searchable through its parent record
INDEX.forEach(i=>{ if(i.id && L2[i.id] && L2[i.id].variants) i.text += ' ' + L2[i.id].variants.map(v=>(v.name||'')+' '+(v.description||'')+' '+(v.config||'')).join(' ').toLowerCase(); });
let qActive=-1;
function doSearch(){
  const q=$('#q').value.trim().toLowerCase(); const box=$('#qres');
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const terms=q.split(/\s+/);
  const hits=INDEX.filter(i=>terms.every(t=>i.text.includes(t))).slice(0,12);
  box.innerHTML = hits.length? hits.map(h=>h.flow?`<a href="#/flow/${h.flow}"><span class="k">FLOW</span>${esc(h.name)}</a>`:h.dec?`<a href="#/decisions/${h.dec}"><span class="k">DECISION</span>${esc(h.name)}</a>`:h.g?`<a href="#/l0/${h.l0}/${h.g}"><span class="k">GROUP</span>${esc(h.name)}</a>`:`<a href="#/l0/${h.l0}/${h.id}"><span class="k">${h.id}</span>${esc(h.name)}</a>`).join('') : '<a href="#/register">No matches — open the register</a>';
  box.hidden=false; qActive=-1;
}

// ---------- events ----------
document.addEventListener('input', e=>{
  if(e.target.id==='q') doSearch();
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='q'){ const items=[...$('#qres').querySelectorAll('a')]; if(!items.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); qActive=Math.min(items.length-1,qActive+1); } else if(e.key==='ArrowUp'){ e.preventDefault(); qActive=Math.max(0,qActive-1); }
    else if(e.key==='Enter'){ e.preventDefault(); (items[qActive]||items[0]).click(); $('#qres').hidden=true; $('#q').value=''; return; } else if(e.key==='Escape'){ $('#qres').hidden=true; return; }
    items.forEach((a,i)=>a.classList.toggle('active',i===qActive)); }
  if(e.key==='/' && !/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); $('#q').focus(); }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.search')) $('#qres').hidden=true;
  const a=e.target.closest('#qres a'); if(a){ $('#qres').hidden=true; $('#q').value=''; }
  if(e.target.id==='lens-business'||e.target.id==='lens-sme'){ lens=e.target.id==='lens-sme'?'sme':'business'; ls.set('lens',lens); setLens(); render(); }
  if(e.target.closest('#who')){ const n=prompt('Your name, as it should appear on statuses, verdicts and comments:', reviewer||''); if(n!=null){ reviewer=n.trim(); ls.set('reviewer',reviewer); setWho(); } }
  const ex=e.target.closest('[data-expand]'); if(ex){ const id=ex.dataset.expand; expanded.has(id)?expanded.delete(id):expanded.add(id); render(); }
  const th=e.target.closest('th[data-sort]'); if(th){ const k=th.dataset.sort; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} render(); }
  const uf=e.target.closest('[data-unfacet]'); if(uf){ facetState[uf.dataset.unfacet]=''; render(); }
  if(e.target.closest('[data-clearfacets]')){ Object.keys(facetState).forEach(k=>facetState[k]=''); render(); }
  if(e.target.id==='batch-apply'){ const s=$('#batch-status').value; [...selected].forEach(eid=>saveReview(eid,{status:s})); selected.clear(); render(); }
  if(e.target.id==='batch-clear'){ selected.clear(); render(); }
  const vt=e.target.closest('[data-variant]'); if(vt){ const [id,k,o]=vt.dataset.variant.split('|'); variantView[id+'|'+k]=o; const l2=L2[id]; if(l2){ const holder=vt.closest('article.record'); if(holder){ const fresh=document.createElement('div'); fresh.innerHTML=recordHTML(l2,{target:holder.classList.contains('target')}); holder.replaceWith(fresh.firstElementChild); } } }
  if(e.target.closest('[data-profile-reset]')){ profile={}; saveProfile(); rerenderKeep(); }
  if(e.target.closest('[data-profile-copy]')){ const b=e.target.closest('[data-profile-copy]'); const txt=JSON.stringify(Object.fromEntries(DECISIONS.map(d=>[d.key,activeOpts(d.key)])),null,1); const done=()=>{ b.textContent='Copied'; setTimeout(()=>b.textContent='Copy profile as JSON',1500); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>prompt('Profile JSON:',txt)); else prompt('Profile JSON:',txt); }
  if(e.target.closest('[data-profile-paste]')){ const s=prompt('Paste a profile JSON ({"decision-key":["option-id"], ...}):',''); if(s){ try{ const p=JSON.parse(s); const next={}; Object.entries(p).forEach(([k,v])=>{ if(DEC[k]){ const arr=(Array.isArray(v)?v:[v]).filter(o=>OPT(k,o)); if(arr.length) next[k]=DEC[k].multi?arr:[arr[0]]; } }); profile=next; saveProfile(); rerenderKeep(); }catch(_){ alert('That was not valid profile JSON.'); } } }
  const cb=e.target.closest('[data-copy-bpmn]'); if(cb){ const ta=document.getElementById('bpmn-xml-'+cb.dataset.copyBpmn); if(!ta.hidden) ta.select(); const done=()=>{ cb.textContent='Copied'; setTimeout(()=>cb.textContent='Copy XML',1500); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done,()=>{ try{document.execCommand('copy'); done();}catch(_){} }); else { const tmp=document.createElement('textarea'); tmp.value=ta.value; document.body.appendChild(tmp); tmp.select(); try{document.execCommand('copy'); done();}catch(_){} tmp.remove(); } }
});
document.addEventListener('toggle', e=>{ if(e.target.classList&&e.target.classList.contains('gdiag')) ls.set('diagClosed', !e.target.open); }, true);
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.setStatus){ saveReview(t.dataset.setStatus,{status:t.value}); }
  if(t.dataset.verdict){ saveReview(t.dataset.verdict,{verdict:t.value}); }
  if(t.dataset.owner!==undefined){ saveReview(t.dataset.owner,{owner:t.value}); }
  if(t.dataset.facet!==undefined){ facetState[t.dataset.facet]=t.value; render(); }
  if(t.dataset.profile){ const k=t.dataset.profile, d=DEC[k]; if(d){
      if(d.multi){ const cur=new Set(activeOpts(k)); t.checked?cur.add(t.value):cur.delete(t.value); profile[k]=[...cur].filter(o=>OPT(k,o)); if(!profile[k].length) delete profile[k]; }
      else profile[k]=[t.value];
      if(profile[k] && profile[k].length===1 && profile[k][0]===d.default && !d.multi) { /* keep explicit choice even if it equals the default */ }
      saveProfile(); rerenderKeep(); } }
  if(t.id==='compact'){ compact=t.checked; render(); }
  if(t.dataset.sel){ t.checked?selected.add(t.dataset.sel):selected.delete(t.dataset.sel); render(); }
  if(t.id==='selall'){ filtered().forEach(x=>t.checked?selected.add(x.eid):selected.delete(x.eid)); render(); }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('form[data-comment]'); if(!f) return; e.preventDefault();
  const text=f.text.value.trim(); if(!text) return;
  if(!reviewer){ const n=prompt('Your name for this comment:',''); if(n==null) return; reviewer=n.trim(); ls.set('reviewer',reviewer); setWho(); }
  addComment(f.dataset.comment, f.attr.value, text); f.text.value='';
});
window.addEventListener('hashchange', render);
function setLens(){ $('#lens-business').setAttribute('aria-pressed', lens==='business'); $('#lens-sme').setAttribute('aria-pressed', lens==='sme'); }
function setWho(){ $('#who').innerHTML='Reviewing as <b>'+esc(reviewer||'—')+'</b>'; }

setLens(); setWho(); setProf(); renderProgress(); render(); initDb();
})();
</script>
