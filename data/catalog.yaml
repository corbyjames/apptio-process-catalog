  outputs: Decided/scheduled portfolio backlog
  config: Portfolio Epic workflow states, Kanban board views, WIP limits, per-state permissions
  fw: 'SAFe: Portfolio Kanban | SPM: Demand Intake'
  src: SAFe LPM; TP entity workflows
