<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- theme ---------- */
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const applyTheme = () => { document.documentElement.dataset.theme = theme; renderAll(); };
$("#themeBtn").onclick = () => { theme = theme==="dark"?"light":"dark"; applyTheme(); };

/* ---------- data prep ---------- */
const FAMILY = t => /^Targetprocess$/.test(t)?"Targetprocess": /^Costing/.test(t)?"Costing": /^Planning/.test(t)?"Planning": /^Cloudability/.test(t)?"Cloudability":"Cross-tool";
const FAMCOLOR = {"Targetprocess":"--s-tp","Costing":"--s-cost","Planning":"--s-plan","Cloudability":"--s-cld","Cross-tool":"--s-x"};
DATA.rows.forEach(r => r.family = FAMILY(r.tool));
const L0FAM = {}; DATA.l0.forEach(l => { const rows=DATA.rows.filter(r=>r.l0id===l.id); const c={}; rows.forEach(r=>c[r.family]=(c[r.family]||0)+1); l.fam = Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; });
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const l1sOf = id => { const seen=[],m={}; DATA.rows.filter(r=>r.l0id===id).forEach(r=>{ if(!m[r.l1id]){m[r.l1id]=true;seen.push({id:r.l1id,name:r.l1});} }); return seen; };

/* ---------- tiles ---------- */
(function(){
  const nl1 = new Set(DATA.rows.map(r=>r.l1id)).size;
  const hyb = DATA.rows.filter(r=>r.delivery!=="Any").length;
  const t = [["10","L0 process areas"],[nl1,"L1 processes"],[DATA.rows.length,"L2 activities"],["4","Apptio products"],["6","E2E cross-tool flows"],[hyb,"delivery-model-specific L2s"]];
  t.forEach(([v,k]) => $("#tiles").append(el("div","tile",`<div class="v">${v}</div><div class="k">${k}</div>`)));
})();

/* ---------- nav ---------- */
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["map","explorer","flows","bpml","walk","cal","insights"].forEach(v => $("#v-"+v).classList.toggle("hide", v!==b.dataset.v));
});
const gotoExplorer = l0id => { $("#fL0").value = l0id; document.querySelector('#nav button[data-v="explorer"]').click(); renderTree(); };

/* ---------- L0 map ---------- */
const FAMGROUPS = [["Strategic Portfolio Management — Targetprocess",["01","02","03","04"]],["IT Financial Management — Planning & Costing",["05","06","08"]],["FinOps — Cloudability",["07"]],["Integration & Enablement",["09","10"]]];
function renderMap(){
  const g = $("#l0grid"); g.innerHTML="";
  FAMGROUPS.forEach(([label,ids]) => {
    g.append(el("div","fam",esc(label)));
    ids.forEach(id => {
      const l = DATA.l0.find(x=>x.id===id);
      const rows = DATA.rows.filter(r=>r.l0id===id);
      const col = cssv(FAMCOLOR[l.fam]);
      const card = el("div","card",
        `<h3>${l.id} · ${esc(l.name)}</h3><p>${esc(l.desc)}</p>
         <div class="meta"><span class="chip"><span class="dot" style="background:${col}"></span>${esc(l.primary)}</span>
         <span>${l1sOf(id).length} L1 · ${rows.length} L2</span></div>`);
      card.style.borderLeftColor = col;
      card.onclick = () => gotoExplorer(id);
      g.append(card);
    });
  });
}

/* ---------- explorer ---------- */
DATA.l0.forEach(l => $("#fL0").append(new Option(`${l.id} — ${l.name}`, l.id)));
["Targetprocess","Costing","Planning","Cloudability","Cross-tool"].forEach(t => $("#fTool").append(new Option(t,t)));
["fL0","fTool","fDeliv"].forEach(id => $("#"+id).onchange = renderTree);
$("#fQ").oninput = renderTree;
$("#fClr").onclick = () => { ["fL0","fTool","fDeliv"].forEach(id=>$("#"+id).value=""); $("#fQ").value=""; renderTree(); };

function renderTree(){
  const l0=$("#fL0").value, tool=$("#fTool").value, dl=$("#fDeliv").value, q=$("#fQ").value.trim().toLowerCase();
  const hit = r => (!l0||r.l0id===l0) && (!tool||r.family===tool) && (!dl||r.delivery===dl) &&
    (!q || [r.l2,r.l1,r.l0,r.desc,r.config,r.personas,r.fw,r.tool,r.support,r.inputs,r.outputs,r.src].join(" ").toLowerCase().includes(q));
  const rows = DATA.rows.filter(hit);
  $("#fCount").textContent = `${rows.length} of ${DATA.rows.length} L2 activities`;
  const tree = $("#tree"); tree.innerHTML="";
  DATA.l0.forEach(l => {
    const rs = rows.filter(r=>r.l0id===l.id); if(!rs.length) return;
    const blk = el("div","l0blk");
    const hd = el("div","l0hd",`${l.id} · ${esc(l.name)} <span style="color:var(--muted);font-weight:400;font-size:12px">· ${rs.length} L2</span>`);
    hd.style.borderLeftColor = cssv(FAMCOLOR[l.fam]);
    const body = el("div");
    hd.onclick = () => body.classList.toggle("hide");
    blk.append(hd, body);
    let lastL1=null;
    rs.forEach(r => {
      if(r.l1id!==lastL1){ lastL1=r.l1id; body.append(el("div","l1hd",`${r.l1id} ${esc(r.l1)}`)); }
      const col = cssv(FAMCOLOR[r.family]);
      const d = el("div","l2",
        `<div class="row1"><span class="id">${r.l2id}</span><span class="nm">${esc(r.l2)}</span>
         <span class="chip"><span class="dot" style="background:${col}"></span>${esc(r.tool)}</span>
         <span class="chip deliv ${r.delivery}">${r.delivery}</span></div>
         <div class="desc">${esc(r.desc)}</div>`);
      const det = el("dl","detail hide",
        `<dt>Personas / lanes</dt><dd>${esc(r.personas)}</dd>
         <dt>Trigger / cadence</dt><dd>${esc(r.cadence)}</dd>
         <dt>Key inputs</dt><dd>${esc(r.inputs)}</dd>
         <dt>Key outputs</dt><dd>${esc(r.outputs)}</dd>
         <dt>Supporting tools</dt><dd>${esc(r.support||"—")}</dd>
         <dt>Configuration objects</dt><dd>${esc(r.config)}</dd>
         <dt>Framework mapping</dt><dd>${esc(r.fw)}</dd>
         <dt>Evidence</dt><dd>${esc(r.src)}</dd>`);
      d.append(det);
      d.onclick = () => det.classList.toggle("hide");
      body.append(d);
    });
    tree.append(blk);
  });
  if(!rows.length) tree.append(el("p","note","No matches — clear a filter or broaden the search."));
}

/* ---------- E2E flow visualizer ---------- */
const FLOWMETA = {
 UC3:"Finance builds workforce plans & target spend in Planning; targets ride the data highway into Targetprocess; positions round-trip through multi-level approval back into the budget.",
 UC2:"Costing keeps individual rates protected and publishes blended team/ART rates to Targetprocess so work can be costed without exposing compensation.",
 UC1:"Targetprocess sends involvements, job profiles and completed work to Costing; TBM Studio computes team cost & CapEx %, allocates by story points or fixed capacity, and emits SAP-ready actuals.",
 UC4:"Cost actuals roll up to Application TCO with run-vs-change attribution driven by real delivery data.",
 CLD:"Cloudability allocates and ATUM-maps cloud spend, then shares cost & capacity into Costing for hybrid TCO and Bill of IT.",
 INV:"Investments, planned allocations and actual effort flow to Costing/Planning; approved budgets and changes flow back."};
let curFlow = "UC3";
(function(){
  const seen = [];
  DATA.flows.forEach(f => { if(!seen.includes(f.flow)) seen.push(f.flow); });
  seen.forEach(fl => {
    const name = DATA.flows.find(f=>f.flow===fl).name;
    const b = el("button",null,`${fl} — ${esc(name)}`);
    b.onclick = () => { curFlow=fl; renderFlow(); };
    $("#flowchips").append(b);
  });
})();
function renderFlow(){
  document.querySelectorAll("#flowchips button").forEach(b=>b.classList.toggle("on", b.textContent.startsWith(curFlow)));
  $("#flowdesc").textContent = FLOWMETA[curFlow];
  const steps = DATA.flows.filter(f=>f.flow===curFlow);
  const lanes = []; steps.forEach(s=>{ if(!lanes.includes(s.lane)) lanes.push(s.lane); });
  const hasBranch = steps.some(s=>/[ab]$/.test(s.step));
  const laneH = hasBranch?168:122, headW=170, stepW=192, gap=26, padT=16;
  // x positions: branch steps (a/b) share the column after their gateway
  const cols=[]; let ci=-1;
  steps.forEach(s=>{ if(/b$/.test(s.step)) { cols.push(ci); } else { ci++; cols.push(ci); } });
  const ncols = ci+1;
  const W = headW + ncols*(stepW+gap) + 20, H = lanes.length*laneH + padT*2;
  const ink=cssv("--ink"), ink2=cssv("--ink-2"), grid=cssv("--grid"), axis=cssv("--axis"), surf=cssv("--surface-1"), acc=cssv("--accent");
  let svg = `<svg width="${W}" height="${H}" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11">`;
  lanes.forEach((ln,i)=>{
    const y = padT+i*laneH;
    svg += `<rect x="0" y="${y}" width="${W-10}" height="${laneH-8}" fill="${i%2? 'transparent':grid}" opacity="${i%2?0:0.28}" rx="8"/>`;
    svg += `<line x1="${headW-10}" y1="${y}" x2="${headW-10}" y2="${y+laneH-8}" stroke="${axis}" stroke-width="1"/>`;
    const words = ln.split(" "); let l1="",l2="";
    words.forEach(w=>{ if((l1+w).length<16 && !l2) l1+=w+" "; else l2+=w+" "; });
    svg += `<text x="12" y="${y+laneH/2-12}" fill="${ink}" font-weight="600">${esc(l1.trim())}</text>`;
    if(l2) svg += `<text x="12" y="${y+laneH/2+4}" fill="${ink}" font-weight="600">${esc(l2.trim())}</text>`;
  });
  const pos = [];
  steps.forEach((s,i)=>{
    const li = lanes.indexOf(s.lane);
    const bx = headW + cols[i]*(stepW+gap);
    let by = padT + li*laneH + (laneH-8)/2 - 27;
    if(/a$/.test(s.step)) by -= 36; if(/b$/.test(s.step)) by += 36;
    pos.push({x:bx, y:by, w:stepW, h:58, s});
  });
  // connectors
  const isGate = s => /gateway/i.test(s.type);
  const conn = [];
  steps.forEach((s,i)=>{
    if(i===steps.length-1) return;
    const nxt = steps[i+1];
    if(isGate(s) && /a$/.test(nxt.step)){
      const bIdx = steps.findIndex(x=>/b$/.test(x.step));
      const after = steps.findIndex((x,j)=> j>i && !/[ab]$/.test(x.step) && j!==i);
      const afterIdx = steps.findIndex((x,j)=> j>bIdx && !/[ab]$/.test(x.step));
      conn.push([i,i+1,"Yes"]); if(bIdx>0) conn.push([i,bIdx,"No"]);
      if(afterIdx>0){ conn.push([i+1,afterIdx,""]); if(bIdx>0) conn.push([bIdx,afterIdx,""]); }
    } else if(/a$/.test(s.step) || /b$/.test(s.step)) { /* handled above */ }
    else if(!(isGate(steps[i]) )) {
      if(!/[ab]$/.test(nxt.step)) conn.push([i,i+1,""]);
    } else conn.push([i,i+1,""]);
  });
  conn.forEach(([a,b,lbl])=>{
    const A=pos[a], B=pos[b];
    const adm = /ADM/.test(A.s.type) || A.s.lane!==B.s.lane;
    const x1=A.x+A.w, y1=A.y+A.h/2, x2=B.x, y2=B.y+B.h/2;
    const midx=(x1+x2)/2;
    svg += `<path d="M${x1},${y1} L${midx},${y1} L${midx},${y2} L${x2-6},${y2}" fill="none" stroke="${adm?acc:ink2}" stroke-width="1.6" ${A.s.lane!==B.s.lane?'stroke-dasharray="5 4"':''} />`;
    svg += `<path d="M${x2-7},${y2-4} L${x2},${y2} L${x2-7},${y2+4} Z" fill="${adm?acc:ink2}"/>`;
    if(lbl) svg += `<text x="${x1+5}" y="${y1<y2? y1+16 : y1-8}" fill="${ink2}" font-size="10.5">${lbl}</text>`;
  });
  // steps
  pos.forEach(p=>{
    const s=p.s, gate=isGate(s), evt=/event/i.test(s.type), adm=/ADM/.test(s.type);
    if(gate){
      const cx=p.x+p.w/2, cy=p.y+p.h/2;
      svg += `<g class="fstep" data-i="${steps.indexOf(s)}"><path d="M${cx-30},${cy} L${cx},${cy-26} L${cx+30},${cy} L${cx},${cy+26} Z" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+3.5}" text-anchor="middle" fill="${ink}" font-weight="600" font-size="10.5">${esc(s.task.length>14? "X":s.task)}</text></g>`;
      if(s.task.length>14) svg += `<text x="${cx}" y="${cy+40}" text-anchor="middle" fill="${ink2}" font-size="10.5">${esc(s.task)}</text>`;
    } else if(evt){
      const cx=p.x+26, cy=p.y+p.h/2;
      svg += `<g class="fstep" data-i="${steps.indexOf(s)}"><circle cx="${cx}" cy="${cy}" r="15" fill="${surf}" stroke="${/End/i.test(s.type)?ink:axis}" stroke-width="${/End/i.test(s.type)?3:1.5}"/></g>
      <text x="${cx}" y="${cy+30}" text-anchor="middle" fill="${ink2}" font-size="10.5">${esc(s.task.slice(0,28))}</text>`;
    } else {
      const lines=wrap(s.task, 29);
      svg += `<g class="fstep" data-i="${steps.indexOf(s)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7" fill="${surf}" stroke="${adm?acc:axis}" stroke-width="1.5"/>`;
      lines.slice(0,4).forEach((ln,li)=> svg += `<text x="${p.x+9}" y="${p.y+15+li*12.5}" fill="${ink}">${esc(ln)}</text>`);
      svg += `</g>`;
      svg += `<text x="${p.x+2}" y="${p.y-4}" fill="${ink2}" font-size="10">${esc(s.step)}${adm?" · ADM":""}</text>`;
    }
  });
  svg += "</svg>";
  $("#flowsvg").innerHTML = svg;
  // hover tooltips
  document.querySelectorAll(".fstep").forEach(g=>{
    g.addEventListener("mousemove", e=>{
      const s = steps[+g.dataset.i];
      showTip(e, `<b>${esc(s.step)} · ${esc(s.type)}</b>${esc(s.task)}${s.notes? "<br><span style='color:var(--muted)'>"+esc(s.notes)+"</span>":""}<br><span style='color:var(--muted)'>Lane: ${esc(s.lane)}</span>`);
    });
    g.addEventListener("mouseleave", hideTip);
  });
}
function wrap(t, n){ const out=[]; let cur=""; t.split(" ").forEach(w=>{ if((cur+w).length>n){ out.push(cur.trim()); cur=""; } cur+=w+" "; }); if(cur.trim()) out.push(cur.trim()); return out; }

/* ---------- tooltip ---------- */
function showTip(e, html){ const t=$("#tip"); t.innerHTML=html; t.classList.remove("hide");
  const w=t.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-10) x=e.clientX-w-14;
  t.style.left=x+"px"; t.style.top=Math.min(e.clientY+12, innerHeight-t.offsetHeight-10)+"px"; }
function hideTip(){ $("#tip").classList.add("hide"); }

/* ---------- insights ---------- */
function barChart({title, sub, cats, series, colors, legend, tipFn}){
  // horizontal grouped-by-stack bars; series: [{name, values[]}]
  const box = el("div","chartbox",`<h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div>`);
  if(legend){ const lg=el("div","legend"); series.forEach((s,i)=> lg.append(el("span",null,`<span class="dot" style="background:${colors[i]}"></span>${esc(s.name)}`))); box.append(lg); }
  const rowH=30, labW=250, W=880, chartW=W-labW-60;
  const totals = cats.map((_,ci)=> series.reduce((a,s)=>a+s.values[ci],0));
  const max = Math.max(...totals);
  const H = cats.length*rowH+8;
  let svg = `<svg width="${W}" height="${H}" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12">`;
  const ink=cssv("--ink"), ink2=cssv("--ink-2"), grid=cssv("--grid");
  [0.25,0.5,0.75,1].forEach(f=>{ const x=labW+chartW*f; svg+=`<line x1="${x}" y1="0" x2="${x}" y2="${H-6}" stroke="${grid}" stroke-width="1"/>`; });
  cats.forEach((c,ci)=>{
    const y=ci*rowH+5;
    svg += `<text x="${labW-10}" y="${y+14}" text-anchor="end" fill="${ink2}">${esc(c.length>33?c.slice(0,32)+"…":c)}</text>`;
    let x=labW;
    series.forEach((s,si)=>{
      const v=s.values[ci]; if(!v) return;
      const w=Math.max(2, v/max*chartW);
      const isLast = si===series.length-1 || series.slice(si+1).every(t=>!t.values[ci]);
      svg += `<rect class="bseg" data-c="${ci}" data-s="${si}" x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="18" fill="${colors[si]}" rx="${isLast?4:0}" />`;
      x+=w;
    });
    svg += `<text x="${x+6}" y="${y+14}" fill="${ink}" font-weight="600" font-variant-numeric="tabular-nums">${totals[ci]}</text>`;
  });
  svg += "</svg>";
  const wrapEl = el("div"); wrapEl.innerHTML=svg; box.append(wrapEl);
  wrapEl.querySelectorAll(".bseg").forEach(r=>{
    r.addEventListener("mousemove",e=> showTip(e, tipFn(+r.dataset.c, +r.dataset.s)));
    r.addEventListener("mouseleave", hideTip);
  });
  return box;
}
function renderInsights(){
  const root = $("#v-insights"); root.innerHTML="";
  const fams = ["Targetprocess","Costing","Planning","Cloudability","Cross-tool"];
  const cols = fams.map(f=>cssv(FAMCOLOR[f]));
  // chart 1: L2 per L0 stacked by tool family
  const cats = DATA.l0.map(l=>`${l.id} ${l.name}`);
  const series = fams.map(f=>({name:f, values: DATA.l0.map(l=> DATA.rows.filter(r=>r.l0id===l.id && r.family===f).length)}));
  root.append(barChart({title:"L2 activities by process area and product", sub:"How the catalog's 143 L2 activities distribute across the ten L0 areas — segment color = primary product.",
    cats, series, colors:cols, legend:true,
    tipFn:(ci,si)=>`<b>${esc(cats[ci])}</b>${esc(fams[si])}: ${series[si].values[ci]} L2 activities`}));
  // chart 2: delivery model coverage (excluding Any) per L0
  const dls = ["Agile","Hybrid","Traditional"];
  const dcolors = [cssv("--chip-agile"), cssv("--chip-hybrid"), cssv("--chip-trad")];
  const cats2 = DATA.l0.filter(l=> DATA.rows.some(r=>r.l0id===l.id && r.delivery!=="Any")).map(l=>`${l.id} ${l.name}`);
  const series2 = dls.map(d=>({name:d, values: cats2.map(c=> DATA.rows.filter(r=>`${r.l0id} ${r.l0}`===c && r.delivery===d).length)}));
  root.append(barChart({title:"Hybrid vs agile: methodology-specific activities", sub:"L2 activities tagged Agile, Hybrid, or Traditional (the other "+DATA.rows.filter(r=>r.delivery==="Any").length+" are methodology-agnostic). Hybrid = agile + traditional governed together.",
    cats:cats2, series:series2, colors:dcolors, legend:true,
    tipFn:(ci,si)=>`<b>${esc(cats2[ci])}</b>${dls[si]}: ${series2[si].values[ci]} L2 activities`}));
  // table view (relief for light-mode contrast)
  const tb = el("div","chartbox");
  tb.append(el("h3",null,"Table view"));
  const rows = DATA.l0.map(l=>{
    const rs=DATA.rows.filter(r=>r.l0id===l.id);
    return `<tr><td>${l.id} ${esc(l.name)}</td>`+fams.map(f=>`<td>${rs.filter(r=>r.family===f).length||"–"}</td>`).join("")+
      `<td>${rs.filter(r=>r.delivery==="Agile").length||"–"}</td><td>${rs.filter(r=>r.delivery==="Hybrid").length||"–"}</td><td>${rs.filter(r=>r.delivery==="Traditional").length||"–"}</td><td>${rs.length}</td></tr>`;
  }).join("");
  tb.append(el("table","tbl",`<thead><tr><th>L0 area</th>${fams.map(f=>`<th>${f}</th>`).join("")}<th>Agile</th><th>Hybrid</th><th>Trad.</th><th>Total L2</th></tr></thead><tbody>${rows}</tbody>`));
  root.append(tb);
  root.append(el("p","note","Hybrid planning is a first-class dimension of this catalog: Targetprocess governs agile and waterfall work in one portfolio (02.3.4, 03.3.2), funding supports stage-gate and lean models side by side (02.2.3, 02.4.1), capacity is planned both team-based and role/individual-based (04.2.1, 04.3.4), and capitalization supports story points, timesheets, or work-effort units (06.4.5)."));
}

/* ---------- BPML diagrams ---------- */
const L0FLOWLINKS = [
 ["05","02","targets down (UC3)"],["04","05","approved positions (UC3)"],["06","04","blended rates back (UC2)"],
 ["03","06","work + workforce data (UC1)"],["06","08","App TCO & Bill of IT (UC4)"],["07","06","cloud cost to TBM"],
 ["02","05","investment loop"],["01","02","strategy & OKRs"],["02","03","funded work"],["05","06","budget & forecast"]
];
let bpmlSel = "L0";
(function(){
  const s = $("#bpmlSel");
  s.append(new Option("L0 — Process landscape (all areas)","L0"));
  const og1 = document.createElement("optgroup"); og1.label = "L1 — process chains per area";
  DATA.l0.forEach(l => og1.append(new Option(`L1 — ${l.id} ${l.name}`,"L1:"+l.id)));
  s.append(og1);
  const og2 = document.createElement("optgroup"); og2.label = "L2 — BPMN per process";
  const seen={};
  DATA.rows.forEach(r => { if(!seen[r.l1id]){ seen[r.l1id]=1; og2.append(new Option(`L2 — ${r.l1id} ${r.l1}`,"L2:"+r.l1id)); }});
  s.append(og2);
  s.onchange = () => { bpmlSel = s.value; renderBpml(); };
})();

function svgOpen(W,H){ const ink=cssv("--ink");
  return {W,H,parts:[`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" style="color:${ink}">`]}; }
function arrow(p, x1,y1,x2,y2, color, dash, lbl, lblUp){
  const midx=(x1+x2)/2;
  p.parts.push(`<path d="M${x1},${y1} L${midx},${y1} L${midx},${y2} L${x2-6},${y2}" fill="none" stroke="${color}" stroke-width="1.6" ${dash?'stroke-dasharray="5 4"':''}/>`);
  p.parts.push(`<path d="M${x2-7},${y2-4} L${x2},${y2} L${x2-7},${y2+4} Z" fill="${color}"/>`);
  if(lbl) p.parts.push(`<text x="${midx}" y="${(y1+y2)/2 + (lblUp?-6:12)}" text-anchor="middle" fill="${cssv('--ink-2')}" font-size="10">${esc(lbl)}</text>`);
}

/* ----- L0 landscape ----- */
function renderBpmlL0(){
  const surf=cssv("--surface-1"), ink=cssv("--ink"), ink2=cssv("--ink-2"), axis=cssv("--axis"), acc=cssv("--accent"), grid=cssv("--grid");
  const BW=252, BH=64, W=1210, H=560;
  // fixed layout: columns
  const P = {
   "01":[40,40], "02":[40,150], "03":[40,290], "04":[40,400],
   "05":[480,40], "06":[480,220], "08":[480,400],
   "07":[900,220],
   "09":[900,40], "10":[900,400]
  };
  const p = svgOpen(W,H);
  // column headers
  [["Targetprocess — SPM",40],["Planning & Costing — ITFM/TBM",480],["Cloudability · Integration",900]].forEach(([t,x])=>
    p.parts.push(`<text x="${x}" y="24" fill="${ink2}" font-size="11.5" font-weight="600" letter-spacing=".05em">${esc(t.toUpperCase())}</text>`));
  // links first (under boxes)
  const cxy = id => [P[id][0], P[id][1]];
  L0FLOWLINKS.forEach(([a,b,lbl])=>{
    const A=P[a], B=P[b];
    const ax=A[0]+BW, ay=A[1]+BH/2, bx=B[0], by=B[1]+BH/2;
    if (A[0]===B[0]) { // same column: vertical arrow
      const x=A[0]+BW/2, y1=A[1]<B[1]? A[1]+BH : A[1], y2=A[1]<B[1]? B[1] : B[1]+BH;
      p.parts.push(`<path d="M${x},${y1} L${x},${y2-6}" stroke="${ink2}" stroke-width="1.6" fill="none"/>`);
      p.parts.push(`<path d="M${x-4},${y2-7} L${x},${y2} L${x+4},${y2-7} ${A[1]>B[1]?'':''} Z" fill="${ink2}" transform="${A[1]>B[1]? `rotate(180 ${x} ${y2-3.5})`:''}"/>`);
      p.parts.push(`<text x="${x+8}" y="${(y1+y2)/2+3}" fill="${ink2}" font-size="10">${esc(lbl)}</text>`);
    } else if (A[0]<B[0]) arrow(p, ax, ay, bx, by, acc, true, lbl, true);
    else arrow(p, A[0], ay, B[0]+BW, by, acc, true, lbl, false); // leftward: draw from left edge to right edge
  });
  // boxes
  DATA.l0.forEach(l=>{
    const [x,y]=P[l.id]; const col=cssv(FAMCOLOR[l.fam]);
    p.parts.push(`<g class="l0node" data-id="${l.id}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="9" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>
      <rect x="${x}" y="${y}" width="5" height="${BH}" rx="2.5" fill="${col}"/>`);
    const lines = wrap(`${l.id} ${l.name}`, 30);
    lines.slice(0,2).forEach((ln,i)=> p.parts.push(`<text x="${x+16}" y="${y+24+i*15}" fill="${ink}" font-weight="600" font-size="12">${esc(ln)}</text>`));
    p.parts.push(`<text x="${x+16}" y="${y+BH-10}" fill="${ink2}" font-size="10.5">${esc(l.primary)}</text></g>`);
  });
  p.parts.push("</svg>");
  return p.parts.join("");
}

/* ----- L1 chain for one L0 ----- */
function renderBpmlL1(l0id){
  const l = DATA.l0.find(x=>x.id===l0id);
  const l1s = l1sOf(l0id);
  const surf=cssv("--surface-1"), ink=cssv("--ink"), ink2=cssv("--ink-2"), axis=cssv("--axis"), grid=cssv("--grid");
  const BW=196, BH=72, gap=44, headW=46, perRow=4;
  const rows = Math.ceil(l1s.length/perRow);
  const W = headW + perRow*(BW+gap)+40, H = rows*(BH+56)+90;
  const p = svgOpen(W,H);
  p.parts.push(`<rect x="4" y="14" width="${W-16}" height="${H-24}" rx="10" fill="none" stroke="${axis}"/>`);
  p.parts.push(`<text x="22" y="38" fill="${ink}" font-weight="700" font-size="13">${esc(l.id+" · "+l.name)}</text>`);
  p.parts.push(`<text x="22" y="55" fill="${ink2}" font-size="10.5">Lanes when expanded: ${esc(l.lanes)}</text>`);
  const pos=[];
  l1s.forEach((x,i)=>{
    const r=Math.floor(i/perRow), c=i%perRow;
    const bx=headW+ (r%2? (perRow-1-c):c )*(BW+gap), by=78+r*(BH+56); // serpentine
    pos.push([bx,by]);
  });
  // start/end events
  const sx=headW-22, sy=pos[0][1]+BH/2;
  p.parts.push(`<circle cx="${sx}" cy="${sy}" r="13" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>`);
  // connectors serpentine
  for(let i=0;i<l1s.length;i++){
    const [bx,by]=pos[i];
    if(i===0) arrow(p, sx+13, sy, bx, by+BH/2, ink2, false, "");
    if(i<l1s.length-1){
      const [nx,ny]=pos[i+1];
      if(by===ny) { const fwd = nx>bx; arrow(p, fwd?bx+BW:bx, by+BH/2, fwd?nx:nx+BW, ny+BH/2, ink2, false, ""); }
      else { // row change: go down from bottom center to top center
        p.parts.push(`<path d="M${bx+BW/2},${by+BH} L${bx+BW/2},${ny-14} L${nx+BW/2},${ny-14} L${nx+BW/2},${ny-5}" fill="none" stroke="${ink2}" stroke-width="1.6"/>`);
        p.parts.push(`<path d="M${nx+BW/2-4},${ny-7} L${nx+BW/2},${ny} L${nx+BW/2+4},${ny-7} Z" fill="${ink2}"/>`);
      }
    } else {
      const ex=(pos[i][0] + ((Math.floor(i/perRow))%2? -34 : BW+34)), ey=by+BH/2;
      p.parts.push(`<circle cx="${ex}" cy="${ey}" r="13" fill="${surf}" stroke="${ink}" stroke-width="3"/>`);
      arrow(p, (Math.floor(i/perRow))%2? bx : bx+BW, by+BH/2, (Math.floor(i/perRow))%2? ex+13 : ex-13, ey, ink2, false, "");
    }
  }
  l1s.forEach((x,i)=>{
    const [bx,by]=pos[i];
    const n2 = DATA.rows.filter(r=>r.l1id===x.id).length;
    p.parts.push(`<g class="l1node" data-id="${x.id}" style="cursor:pointer">
      <rect x="${bx}" y="${by}" width="${BW}" height="${BH}" rx="9" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>`);
    const lines=wrap(x.name, 26);
    p.parts.push(`<text x="${bx+10}" y="${by+18}" fill="${ink2}" font-size="10">${esc(x.id)} · ${n2} L2</text>`);
    lines.slice(0,2).forEach((ln,li)=> p.parts.push(`<text x="${bx+10}" y="${by+36+li*14}" fill="${ink}" font-weight="600">${esc(ln)}</text>`));
    p.parts.push(`<rect x="${bx+BW/2-8}" y="${by+BH-14}" width="16" height="10" rx="2" fill="none" stroke="${ink2}"/><text x="${bx+BW/2}" y="${by+BH-5.5}" text-anchor="middle" fill="${ink2}" font-size="9">+</text></g>`);
  });
  p.parts.push("</svg>");
  return p.parts.join("");
}

/* ----- L2 BPMN for one L1 ----- */
function laneOf(r){ return (r.personas.split(/[,|]/)[0]||"Process owner").trim().replace(/^Lanes:\s*/,"").replace(/\s*\(automated\)/,""); }
function l2Layout(l1id){
  const rs = DATA.rows.filter(r=>r.l1id===l1id);
  const lanes=[]; rs.forEach(r=>{ const ln=laneOf(r); if(!lanes.includes(ln)) lanes.push(ln); });
  const laneH=104, headW=150, stepW=192, gap=40, padT=14;
  const W = headW + rs.length*(stepW+gap)+120, H = lanes.length*laneH+padT*2;
  const pos = rs.map((r,i)=>({ x: headW+34+i*(stepW+gap), y: padT+lanes.indexOf(laneOf(r))*laneH+(laneH-8)/2-29, w:stepW, h:58, r }));
  return {rs, lanes, laneH, headW, stepW, gap, padT, W, H, pos};
}
function renderBpmlL2(l1id){
  const {rs,lanes,laneH,headW,padT,W,H,pos} = l2Layout(l1id);
  const surf=cssv("--surface-1"), ink=cssv("--ink"), ink2=cssv("--ink-2"), axis=cssv("--axis"), grid=cssv("--grid"), acc=cssv("--accent");
  const p = svgOpen(W,H);
  lanes.forEach((ln,i)=>{
    const y=padT+i*laneH;
    p.parts.push(`<rect x="0" y="${y}" width="${W-10}" height="${laneH-8}" fill="${i%2?'transparent':grid}" opacity="${i%2?0:0.28}" rx="8"/>`);
    p.parts.push(`<line x1="${headW-10}" y1="${y}" x2="${headW-10}" y2="${y+laneH-8}" stroke="${axis}"/>`);
    wrap(ln,16).slice(0,2).forEach((w,li)=> p.parts.push(`<text x="12" y="${y+laneH/2-8+li*15}" fill="${ink}" font-weight="600">${esc(w)}</text>`));
  });
  const sy = pos[0].y+29, ey = pos[pos.length-1].y+29;
  p.parts.push(`<circle cx="${headW+8}" cy="${sy}" r="13" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>`);
  arrow(p, headW+21, sy, pos[0].x, sy, ink2, false, "");
  pos.forEach((q,i)=>{
    if(i<pos.length-1){ const n=pos[i+1]; arrow(p, q.x+q.w, q.y+29, n.x, n.y+29, q.r.family!==n.r.family?acc:ink2, laneOf(q.r)!==laneOf(n.r), ""); }
  });
  const last=pos[pos.length-1];
  p.parts.push(`<circle cx="${last.x+last.w+30}" cy="${ey}" r="13" fill="${surf}" stroke="${ink}" stroke-width="3"/>`);
  arrow(p, last.x+last.w, ey, last.x+last.w+17, ey, ink2, false, "");
  pos.forEach((q,i)=>{
    const col=cssv(FAMCOLOR[q.r.family]);
    p.parts.push(`<g class="l2node" data-id="${q.r.l2id}"><rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="8" fill="${surf}" stroke="${axis}" stroke-width="1.5"/>
      <rect x="${q.x}" y="${q.y}" width="4" height="${q.h}" rx="2" fill="${col}"/>`);
    wrap(q.r.l2, 28).slice(0,3).forEach((ln,li)=> p.parts.push(`<text x="${q.x+12}" y="${q.y+17+li*13}" fill="${ink}">${esc(ln)}</text>`));
    p.parts.push(`</g><text x="${q.x+2}" y="${q.y-4}" fill="${ink2}" font-size="10">${esc(q.r.l2id)} · ${esc(q.r.delivery)}</text>`);
  });
  p.parts.push("</svg>");
  return p.parts.join("");
}

/* ----- BPMN 2.0 XML export for an L1's L2 diagram ----- */
function bpmnXml(l1id){
  const {rs,lanes,laneH,headW,padT,W,H,pos} = l2Layout(l1id);
  const x = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const idify = s => s.replace(/[^A-Za-z0-9]/g,"_");
  const pid = "Process_"+idify(l1id);
  const l1name = rs[0].l1;
  let flowNodes="", flows="", laneXml="", shapes="", edges="";
  const nodeId = r => "Task_"+idify(r.l2id);
  laneXml = lanes.map((ln,i)=>{
    const refs = ["<bpmn:flowNodeRef>StartEvent_1</bpmn:flowNodeRef>","<bpmn:flowNodeRef>EndEvent_1</bpmn:flowNodeRef>"].filter((_,k)=> i===0? k===0 : false).join("");
    const laneRefs = rs.filter(r=>laneOf(r)===ln).map(r=>`<bpmn:flowNodeRef>${nodeId(r)}</bpmn:flowNodeRef>`).join("");
    const extra = (i===0?"<bpmn:flowNodeRef>StartEvent_1</bpmn:flowNodeRef>":"") + (laneOf(rs[rs.length-1])===ln?"<bpmn:flowNodeRef>EndEvent_1</bpmn:flowNodeRef>":"");
    return `<bpmn:lane id="Lane_${i+1}" name="${x(ln)}">${extra}${laneRefs}</bpmn:lane>`;
  }).join("");
  flowNodes += `<bpmn:startEvent id="StartEvent_1" name="Start"><bpmn:outgoing>Flow_0</bpmn:outgoing></bpmn:startEvent>`;
  rs.forEach((r,i)=>{
    flowNodes += `<bpmn:task id="${nodeId(r)}" name="${x(r.l2id+" "+r.l2)}"><bpmn:incoming>Flow_${i}</bpmn:incoming><bpmn:outgoing>Flow_${i+1}</bpmn:outgoing></bpmn:task>`;
  });
  flowNodes += `<bpmn:endEvent id="EndEvent_1" name="End"><bpmn:incoming>Flow_${rs.length}</bpmn:incoming></bpmn:endEvent>`;
  flows += `<bpmn:sequenceFlow id="Flow_0" sourceRef="StartEvent_1" targetRef="${nodeId(rs[0])}"/>`;
  rs.forEach((r,i)=>{ flows += `<bpmn:sequenceFlow id="Flow_${i+1}" sourceRef="${nodeId(r)}" targetRef="${i<rs.length-1? nodeId(rs[i+1]) : "EndEvent_1"}"/>`; });
  // DI
  const laneY = i => padT+i*laneH;
  shapes += `<bpmndi:BPMNShape id="Participant_1_di" bpmnElement="Participant_1" isHorizontal="true"><dc:Bounds x="0" y="0" width="${W}" height="${H}"/></bpmndi:BPMNShape>`;
  lanes.forEach((ln,i)=>{ shapes += `<bpmndi:BPMNShape id="Lane_${i+1}_di" bpmnElement="Lane_${i+1}" isHorizontal="true"><dc:Bounds x="30" y="${laneY(i)}" width="${W-30}" height="${laneH}"/></bpmndi:BPMNShape>`; });
  const sy = pos[0].y+29, ey = pos[pos.length-1].y+29;
  shapes += `<bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1"><dc:Bounds x="${headW-5}" y="${sy-13}" width="26" height="26"/></bpmndi:BPMNShape>`;
  pos.forEach(q=>{ shapes += `<bpmndi:BPMNShape id="${nodeId(q.r)}_di" bpmnElement="${nodeId(q.r)}"><dc:Bounds x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}"/></bpmndi:BPMNShape>`; });
  const last=pos[pos.length-1];
  shapes += `<bpmndi:BPMNShape id="EndEvent_1_di" bpmnElement="EndEvent_1"><dc:Bounds x="${last.x+last.w+17}" y="${ey-13}" width="26" height="26"/></bpmndi:BPMNShape>`;
  const wp = (x1,y1,x2,y2)=>`<di:waypoint x="${x1}" y="${y1}"/><di:waypoint x="${(x1+x2)/2}" y="${y1}"/><di:waypoint x="${(x1+x2)/2}" y="${y2}"/><di:waypoint x="${x2}" y="${y2}"/>`;
  edges += `<bpmndi:BPMNEdge id="Flow_0_di" bpmnElement="Flow_0">${wp(headW+21,sy,pos[0].x,sy)}</bpmndi:BPMNEdge>`;
  pos.forEach((q,i)=>{
    const tx = i<pos.length-1? pos[i+1].x : last.x+last.w+17;
    const ty = i<pos.length-1? pos[i+1].y+29 : ey;
    edges += `<bpmndi:BPMNEdge id="Flow_${i+1}_di" bpmnElement="Flow_${i+1}">${wp(q.x+q.w, q.y+29, tx, ty)}</bpmndi:BPMNEdge>`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Defs_${idify(l1id)}" targetNamespace="http://apptio-process-catalog">
<bpmn:collaboration id="Collab_1"><bpmn:participant id="Participant_1" name="${x(l1id+" "+l1name)}" processRef="${pid}"/></bpmn:collaboration>
<bpmn:process id="${pid}" name="${x(l1name)}" isExecutable="false"><bpmn:laneSet id="LaneSet_1">${laneXml}</bpmn:laneSet>${flowNodes}${flows}</bpmn:process>
<bpmndi:BPMNDiagram id="Diagram_1"><bpmndi:BPMNPlane id="Plane_1" bpmnElement="Collab_1">${shapes}${edges}</bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;
}

function download(name, mime, content){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
$("#dlSvg").onclick = () => download(("apptio-bpml-"+bpmlSel).replace(/[^A-Za-z0-9.-]/g,"_")+".svg","image/svg+xml", $("#bpmlsvg").innerHTML);
$("#dlBpmn").onclick = () => {
  if(bpmlSel.startsWith("L2:")) download("apptio-"+bpmlSel.slice(3)+".bpmn","application/xml", bpmnXml(bpmlSel.slice(3)));
  else if(bpmlSel.startsWith("L1:")){
    const l0=bpmlSel.slice(3);
    const first = l1sOf(l0)[0]; download("apptio-"+first.id+".bpmn","application/xml", bpmnXml(first.id));
  } else alert("Select an L2 diagram (or an L1 chain) to export BPMN XML. The L0 landscape exports as SVG.");
};

function renderBpml(){
  const box=$("#bpmlsvg"), desc=$("#bpmlDesc"), hint=$("#bpmlHint");
  if(bpmlSel==="L0"){
    desc.textContent="Process landscape: the ten L0 areas with the cross-tool feeds that connect them. Click an area to open its L1 chain.";
    hint.textContent="BPMN export available at L1/L2 level";
    box.innerHTML = renderBpmlL0();
    box.querySelectorAll(".l0node").forEach(g=>{
      g.onclick=()=>{ bpmlSel="L1:"+g.dataset.id; $("#bpmlSel").value=bpmlSel; renderBpml(); };
      g.addEventListener("mousemove",e=>{ const l=DATA.l0.find(x=>x.id===g.dataset.id); showTip(e,`<b>${l.id} ${esc(l.name)}</b>${esc(l.desc)}`); });
      g.addEventListener("mouseleave",hideTip);
    });
  } else if(bpmlSel.startsWith("L1:")){
    const l0=bpmlSel.slice(3); const l=DATA.l0.find(x=>x.id===l0);
    desc.textContent=`${l.id} ${l.name} — L1 processes as collapsed sub-processes in lifecycle order. Click one to open its L2 BPMN.`;
    hint.textContent=".bpmn export uses the first L1; pick an L2 diagram for a specific process";
    box.innerHTML = renderBpmlL1(l0);
    box.querySelectorAll(".l1node").forEach(g=>{
      g.onclick=()=>{ bpmlSel="L2:"+g.dataset.id; $("#bpmlSel").value=bpmlSel; renderBpml(); };
      g.addEventListener("mousemove",e=>{ const l1=g.dataset.id; const n=DATA.rows.filter(r=>r.l1id===l1); showTip(e,`<b>${l1} ${esc(n[0].l1)}</b>${n.length} L2 activities · click to open BPMN`); });
      g.addEventListener("mouseleave",hideTip);
    });
  } else {
    const l1=bpmlSel.slice(3); const rs=DATA.rows.filter(r=>r.l1id===l1);
    desc.textContent=`${l1} ${rs[0].l1} — L2 activities as a BPMN task sequence; lanes = lead persona; colored edge = primary product; dashed arrows = lane handoffs.`;
    hint.textContent=`${rs.length} tasks · ${new Set(rs.map(laneOf)).size} lane(s)`;
    box.innerHTML = renderBpmlL2(l1);
    box.querySelectorAll(".l2node").forEach(g=>{
      g.addEventListener("mousemove",e=>{ const r=DATA.rows.find(x=>x.l2id===g.dataset.id);
        showTip(e,`<b>${r.l2id} ${esc(r.l2)}</b>${esc(r.desc)}<br><span style="color:var(--muted)">Tool: ${esc(r.tool)} · ${esc(r.cadence)}</span><br><span style="color:var(--muted)">Config: ${esc(r.config.length>140? r.config.slice(0,139)+"…" : r.config)}</span>`); });
      g.addEventListener("mouseleave",hideTip);
    });
  }
}

/* ---------- Process Walkthrough (customer mode) ---------- */
function walkSteps(sel){
  if(sel==="E2E") return DATA.flows.filter(f=>["UC3","UC2","UC1","UC4"].includes(f.flow));
  if(sel.startsWith("F:")) return DATA.flows.filter(f=>f.flow===sel.slice(2));
  const l1=sel.slice(2);
  return DATA.rows.filter(r=>r.l1id===l1).map(r=>({flow:l1, name:r.l1, step:r.l2id, type:"Task", lane:laneOf(r), task:r.l2id+" "+r.l2, notes:r.desc, r}));
}
let walkSel="E2E", walkIdx=-1;
(function(){
  const s=$("#walkSel");
  s.append(new Option("★ Full E2E — Targets down · Rates back · Actuals in · TCO up","E2E"));
  const og0=document.createElement("optgroup"); og0.label="Cross-tool flows";
  const seen=[]; DATA.flows.forEach(f=>{ if(!seen.includes(f.flow)){ seen.push(f.flow); og0.append(new Option(f.flow+" — "+f.name,"F:"+f.flow)); }});
  s.append(og0);
  const og=document.createElement("optgroup"); og.label="Catalog processes (L1)";
  const seen2={}; DATA.rows.forEach(r=>{ if(!seen2[r.l1id]){ seen2[r.l1id]=1; og.append(new Option(r.l1id+" "+r.l1,"L:"+r.l1id)); }});
  s.append(og);
  s.onchange=()=>{ walkSel=s.value; walkIdx=-1; renderWalk(); };
  $("#wPrev").onclick=()=>{ walkIdx=Math.max(0,(walkIdx<0?0:walkIdx-1)); renderWalk(); };
  $("#wNext").onclick=()=>{ const n=walkSteps(walkSel).length; walkIdx=Math.min(n-1,walkIdx+1); renderWalk(); };
  $("#wAll").onclick=()=>{ walkIdx=-1; renderWalk(); };
  $("#wPresent").onclick=()=>{ document.body.classList.toggle("present"); };
  $("#wPrint").onclick=()=>{ document.querySelectorAll("main > section").forEach(x=>{ if(x.id!=="v-walk") x.classList.add("hide"); }); window.print(); };
  document.addEventListener("keydown",e=>{
    if($("#v-walk").classList.contains("hide")) return;
    if(e.key==="ArrowRight") $("#wNext").click();
    if(e.key==="ArrowLeft") $("#wPrev").click();
    if(e.key==="Escape") document.body.classList.remove("present");
  });
})();
function renderWalk(){
  const steps=walkSteps(walkSel);
  const lanes=[]; steps.forEach(s=>{ if(!lanes.includes(s.lane)) lanes.push(s.lane); });
  const hasBranch=steps.some(s=>/[ab]$/.test(String(s.step)));
  const laneH=hasBranch?168:120, headW=168, stepW=190, gap=26, padT=14;
  const cols=[]; let ci=-1;
  steps.forEach(s=>{ if(/b$/.test(String(s.step))) cols.push(ci); else {ci++; cols.push(ci);} });
  const W=headW+(ci+1)*(stepW+gap)+30, H=lanes.length*laneH+padT*2;
  const ink=cssv("--ink"), ink2=cssv("--ink-2"), grid=cssv("--grid"), axis=cssv("--axis"), surf=cssv("--surface-1"), acc=cssv("--accent");
  let svg=`<svg width="${W}" height="${H}" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11">`;
  lanes.forEach((ln,i)=>{
    const y=padT+i*laneH;
    svg+=`<rect x="0" y="${y}" width="${W-10}" height="${laneH-8}" fill="${i%2?'transparent':grid}" opacity="${i%2?0:0.28}" rx="8"/>`;
    svg+=`<line x1="${headW-10}" y1="${y}" x2="${headW-10}" y2="${y+laneH-8}" stroke="${axis}"/>`;
    wrap(ln,16).slice(0,3).forEach((w,li)=> svg+=`<text x="12" y="${y+laneH/2-14+li*15}" fill="${ink}" font-weight="600">${esc(w)}</text>`);
  });
  const pos=steps.map((s,i)=>{
    const li=lanes.indexOf(s.lane);
    let by=padT+li*laneH+(laneH-8)/2-28;
    if(/a$/.test(String(s.step))) by-=36; if(/b$/.test(String(s.step))) by+=36;
    return {x:headW+cols[i]*(stepW+gap), y:by, w:stepW, h:56, s, i};
  });
  const isGate=s=>/gateway/i.test(s.type);
  const dimOp = i => walkIdx<0 ? 1 : (i===walkIdx?1:0.28);
  // connectors (linear + a/b branch handling as in flow view)
  for(let i=0;i<steps.length-1;i++){
    const s=steps[i], nxt=steps[i+1];
    let pairs=[];
    if(isGate(s)&&/a$/.test(String(nxt.step))){
      const bI=steps.findIndex(x=>/b$/.test(String(x.step)));
      const aftI=steps.findIndex((x,j)=>j>bI&&!/[ab]$/.test(String(x.step)));
      pairs.push([i,i+1]); if(bI>0) pairs.push([i,bI]);
      if(aftI>0){ pairs.push([i+1,aftI]); if(bI>0) pairs.push([bI,aftI]); }
    } else if(/[ab]$/.test(String(s.step))) continue;
    else if(!/[ab]$/.test(String(nxt.step))) pairs.push([i,i+1]);
    pairs.forEach(([a,b])=>{
      const A=pos[a],B=pos[b];
      const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2,midx=(x1+x2)/2;
      const cross=A.s.lane!==B.s.lane;
      const op=walkIdx<0?1:((a===walkIdx||b===walkIdx)?1:0.25);
      svg+=`<g opacity="${op}"><path d="M${x1},${y1} L${midx},${y1} L${midx},${y2} L${x2-6},${y2}" fill="none" stroke="${cross?acc:ink2}" stroke-width="1.6" ${cross?'stroke-dasharray="5 4"':''}/><path d="M${x2-7},${y2-4} L${x2},${y2} L${x2-7},${y2+4} Z" fill="${cross?acc:ink2}"/></g>`;
    });
  }
  pos.forEach(p=>{
    const s=p.s, gate=isGate(s), evt=/event/i.test(s.type), cur=p.i===walkIdx;
    const op=dimOp(p.i), stroke=cur?acc:axis, swd=cur?3:1.5;
    if(gate){
      const cx=p.x+p.w/2, cy=p.y+p.h/2;
      svg+=`<g class="wstep" data-i="${p.i}" opacity="${op}" style="cursor:pointer"><path d="M${cx-30},${cy} L${cx},${cy-26} L${cx+30},${cy} L${cx},${cy+26} Z" fill="${surf}" stroke="${stroke}" stroke-width="${swd}"/><text x="${cx}" y="${cy+40}" text-anchor="middle" fill="${ink2}" font-size="10.5">${esc(s.task)}</text></g>`;
    } else if(evt){
      const cx=p.x+26, cy=p.y+p.h/2;
      svg+=`<g class="wstep" data-i="${p.i}" opacity="${op}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="15" fill="${surf}" stroke="${/End/i.test(s.type)?ink:stroke}" stroke-width="${/End/i.test(s.type)?3:swd}"/><text x="${cx}" y="${cy+30}" text-anchor="middle" fill="${ink2}" font-size="10.5">${esc(s.task.slice(0,26))}</text></g>`;
    } else {
      svg+=`<g class="wstep" data-i="${p.i}" opacity="${op}" style="cursor:pointer"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${surf}" stroke="${stroke}" stroke-width="${swd}"/>`;
      wrap(s.task,29).slice(0,3).forEach((ln,li)=> svg+=`<text x="${p.x+10}" y="${p.y+16+li*13}" fill="${ink}">${esc(ln)}</text>`);
      svg+=`</g><text x="${p.x+2}" y="${p.y-4}" fill="${ink2}" font-size="10" opacity="${op}">${esc(String(s.step))}</text>`;
    }
  });
  svg+="</svg>";
  $("#walksvg").innerHTML=svg;
  document.querySelectorAll(".wstep").forEach(g=>{ g.onclick=()=>{ walkIdx=+g.dataset.i; renderWalk(); }; });
  if(walkIdx>=0){ const q=pos[walkIdx]; const wrapEl=$("#walksvg"); wrapEl.scrollLeft=Math.max(0,q.x-wrapEl.clientWidth/2+q.w/2); }
  // narration panel
  const total=steps.length;
  const title = walkSel==="E2E" ? "Full E2E flow" : (steps[0].name||"");
  $("#walkDesc").textContent = walkIdx<0 ? `${title} — ${total} steps across ${lanes.length} lanes. Click any step, or use Next / arrow keys to walk through it.` : "";
  $("#wPos").textContent = walkIdx<0 ? `${total} steps` : `Step ${walkIdx+1} of ${total}`;
  const pnl=$("#walkPanel");
  if(walkIdx<0){ pnl.innerHTML=`<h3>${esc(title)}</h3><p>Use <b>Next ▶</b> (or →) to start the guided walkthrough. Each step highlights on the diagram while this panel explains what happens, who does it, and in which tool. <b>Present</b> hides the app chrome for customer sessions; <b>Print one-pager</b> produces a leave-behind.</p>`; }
  else {
    const s=steps[walkIdx], r=s.r;
    pnl.innerHTML = `<h3>Step ${walkIdx+1}: ${esc(s.task)}</h3>
      <div class="meta"><span class="chip">${esc(s.lane)}</span><span class="chip">${esc(s.type)}</span>${s.flow?`<span class="chip">${esc(s.flow)}</span>`:""}${r?`<span class="chip deliv ${r.delivery}">${r.delivery}</span>`:""}</div>
      ${s.notes?`<p>${esc(s.notes)}</p>`:""}
      ${r?`<p><b>Tool:</b> ${esc(r.tool)}${r.support?` (+ ${esc(r.support)})`:""} · <b>Cadence:</b> ${esc(r.cadence)}</p><p><b>Inputs:</b> ${esc(r.inputs)} → <b>Outputs:</b> ${esc(r.outputs)}</p><p><b>Configured with:</b> ${esc(r.config)}</p>`:""}`;
  }
  // print step list
  $("#walkSteps").innerHTML = `<h3>${esc(title)} — step list</h3><table><tr><th>#</th><th>Step</th><th>Lane</th><th>Detail</th></tr>` +
    steps.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.task)}</td><td>${esc(s.lane)}</td><td>${esc(s.notes||(s.r? s.r.desc:"")||"")}</td></tr>`).join("") + "</table>";
}

/* ---------- Operating Calendar ---------- */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let fyStart=0; // 0 = January
(function(){
  const s=$("#fyStart");
  MONTHS.forEach((m,i)=> s.append(new Option(m + (i===0?" (calendar year)":""), i)));
  s.onchange=()=>{ fyStart=+s.value; renderCal(); };
})();
function renderCal(){
  const g=$("#calgrid"); g.innerHTML="";
  if(!DATA.calendar){ g.innerHTML="<p class='note'>No calendar data.</p>"; return; }
  const hdr=el("div","calrow hdr","<div class='lbl'></div>"+Array.from({length:12},(_,i)=>`<div class='mh'>${MONTHS[(fyStart+i)%12]}<br><span style='font-weight:400'>FM${i+1}</span></div>`).join(""));
  g.append(hdr);
  DATA.calendar.streams.forEach(st=>{
    const col=cssv(FAMCOLOR[st.family]||"--s-x");
    g.append(el("div","calstream",`<span class="dot" style="background:${col}"></span> ${esc(st.name)}`));
    st.entries.forEach(en=>{
      const cells=Array.from({length:12},(_,i)=>{
        const on=en.fm.includes(i+1);
        return `<div class="calcell${on?" on":""}" ${on?`style="background:${col}" data-e="1"`:""}></div>`;
      }).join("");
      const row=el("div","calrow",`<div class="lbl">${esc(en.name)}<span class="cad">${esc(en.cadence)}</span></div>${cells}`);
      row.querySelectorAll(".calcell.on").forEach(c=>{
        c.addEventListener("mousemove",e=> showTip(e,`<b>${esc(en.name)} · ${esc(en.cadence)}</b>${esc(en.desc)}<br><span style="color:var(--muted)">Catalog: ${esc((en.refs||[]).join(", "))}</span>`));
        c.addEventListener("mouseleave",hideTip);
        c.addEventListener("click",()=>{ $("#fQ").value=(en.refs&&en.refs[0])||en.name; ["fL0","fTool","fDeliv"].forEach(id=>$("#"+id).value=""); document.querySelector('#nav button[data-v="explorer"]').click(); renderTree(); });
      });
      g.append(row);
    });
  });
}

/* ---------- render all ---------- */
function renderAll(){ renderMap(); renderTree(); renderFlow(); renderBpml(); renderWalk(); renderCal(); renderInsights(); }
applyTheme();
</script>
