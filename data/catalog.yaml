- l2id: 01.1.1
  l2: Define strategic themes & business objectives
  l1id: '01.1'
  l1: Strategic Planning & Alignment
  desc: Capture enterprise strategy as strategic themes/objectives that will govern portfolio investment.
  delivery: Any
  tool: Targetprocess
  support: ''
  personas: C-Suite, VP Strategy, Portfolio Mgmt
  cadence: Annual + quarterly refresh
  inputs: Corporate strategy, market context
  outputs: Strategic themes, objective hierarchy
  config: Objective entity (OKR solution), Group/portfolio hierarchy, roadmap views
  fw: 'SPM: Strategic Planning | SAFe: Strategic Themes'
  src: SPM CFD; WFM deck; IBM Docs OKR solution
- l2id: 01.1.2
  l2: Cascade strategy to portfolios & value streams
  l1id: '01.1'
  l1: Strategic Planning & Alignment
  desc: 'Link objectives to portfolios, value streams and ARTs so investment and work align top-down (line of sight).
    Validate the full traceability chain (Strategic Objective > Portfolio Priority > Product/Value Stream > PI Objective
    > Epic > Feature > Story > Delivery > Outcome) and flag breaks: objectives with no execution, work with no strategic
    linkage, delivered work with no outcome.'
  delivery: Any
  tool: Targetprocess
  support: ''
  personas: Portfolio Mgmt, Value Stream owners
  cadence: Annual + on change
  inputs: Strategic themes
  outputs: Objective-portfolio linkage, funded value streams
  config: Portfolio/ART (Group) structure, relations objectives->portfolio epics, OKR cascade (Ultimate>Strategic>Tactical)
  fw: 'SPM: Strategic Planning | SAFe: LPM'
  src: TBMC25 Client Zero OKR cascade; EAP CFD 5-step strategic planning; PI Planning/EVD Agent requirements (IBM,
    anonymized) §6.1
- l2id: 01.1.3
  l2: Monitor strategy execution & re-plan dynamically
  l1id: '01.1'
  l1: Strategic Planning & Alignment
  desc: Track progress of strategy in real time via dashboards and re-plan objectives and allocations as conditions
    change.
  delivery: Any
  tool: Targetprocess
  support: Costing
  personas: C-Suite, Portfolio Mgmt
  cadence: Quarterly + continuous
  inputs: OKR progress, delivery rollups, financials
  outputs: Strategy course corrections
  config: Corporate Strategy Dashboard, OKR hierarchy views, dashboards fed to leadership reporting (CT Leadership
    Review)
  fw: 'SPM: Strategic Planning | SAFe: Measure & Grow'
  src: LFM demo (Value Realization tab); EAP CFD step 4-5
