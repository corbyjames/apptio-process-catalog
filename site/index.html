e position request (role, location, hours, type)","note":"Department link ties request to finance budget line","l2":["04.4.1"]},{"n":"5","type":"User task","lane":"Targetprocess / ATP","task":"Run multi-level approval workflow (HR > Dept > Final, escalations)","l2":["04.4.2"]},{"n":"6","type":"XOR gateway","lane":"Targetprocess / ATP","task":"Approved?","note":"No: end event 'Request rejected'; Yes: continue","l2":["04.4.2"]},{"n":"7","type":"Send task (ADM)","lane":"Targetprocess / ATP","task":"Send approved positions to IT Planning (daily / weekly sync)","note":"Only approved positions cross","l2":["04.4.3"]},{"n":"8","type":"Task","lane":"IT Planning (Finance)","task":"Normalize & budget open + filled positions (auto-updated when filled)","note":"Round-trip: fill event in ATP auto-updates Planning record","l2":["05.4.1","04.4.3"]},{"n":"9","type":"User task","lane":"Targetprocess / ATP","task":"Allocate users / teams / ARTs / solution trains to work (bottom-up demand)","l2":["04.3.1"]},{"n":"10","type":"Task","lane":"Targetprocess / ATP","task":"Compare demand rollup vs. target spend (capacity / FTE reports)","note":"Forward-looking: e.g. 3 months out demand exceeds FTE","l2":["04.2.2","02.4.3"]}],"upstream":[],"downstream":["UC2","INV","ZBB"],"kind":null},{"id":"UC2","name":"Rates back","title":"Work allocation rates","legacy_id":"09.2","products":["Costing","Targetprocess"],"summary":"Costing maintains protected individual rates, computes blended team/ART rates and publishes them to Targetprocess so work allocations can be costed without exposing compensation.","cadence":"Regular cadence","lanes":["Costing / TBM Studio","Targetprocess / ATP"],"steps":[{"n":"11","type":"Service task","lane":"Costing / TBM Studio","task":"Maintain protected rates; compute blended team / ART-level rates","note":"Individual rates never leave Costing","l2":["06.4.1"]},{"n":"12","type":"Send task (ADM)","lane":"Costing / TBM Studio","task":"Send blended rates back to Targetprocess (Costing is source of truth)","note":"Design decision: rate exposure level; true-up pattern","l2":["06.4.2"]},{"n":"13","type":"Task","lane":"Targetprocess / ATP","task":"Cost work allocations with blended rates; feed budget cycle","l2":["04.3.1","02.4.3"]}],"upstream":["UC3"],"downstream":["UC1"],"kind":null},{"id":"UC1","name":"Actuals in","title":"Labor capitalization","legacy_id":"09.3","products":["Targetprocess","Costing"],"summary":"Targetprocess sends involvements, job profiles, mappings and completed work to Costing; TBM Studio computes monthly team cost and blended CapEx %, allocates to work (story points) or towers (fixed capacity), and generates the SAP-ready CapEx/OpEx actuals file that deprecates time writing.","cadence":"Monthly","lanes":["Targetprocess / ATP","Costing / TBM Studio","ERP (SAP)"],"steps":[{"n":"14","type":"Task","lane":"Targetprocess / ATP","task":"Maintain involvements %, job profiles, CapEx/OpEx & IT-tower mappings","note":"Three ingredients: job profiles, involvements, protected rates","l2":["04.1.2","04.1.3"]},{"n":"15","type":"Send task (ADM)","lane":"Targetprocess / ATP","task":"Send workforce & completed work data to Costing (TBM Studio)","l2":["04.5.3","06.4.3"]},{"n":"16","type":"Service task","lane":"Costing / TBM Studio","task":"Calculate monthly team cost & blended CapEx % (protected rates)","l2":["06.4.4"]},{"n":"17","type":"XOR gateway","lane":"Costing / TBM Studio","task":"Team work visible?","note":"Yes: story-point allocation; No: fixed-capacity","l2":["06.4.5"],"decision":"labor-effort-signal"},{"n":"17a","type":"Task","lane":"Costing / TBM Studio","task":"Allocate team costs to completed work (story points, weightage)","note":"Same allocation principles as TBM","l2":["06.4.5"],"when":{"labor-effort-signal":["story-points","story-count","timesheet","work-effort-unit"]}},{"n":"17b","type":"Task","lane":"Costing / TBM Studio","task":"Allocate team costs to IT towers / apps (fixed capacity)","note":"Ops teams without visible backlog (e.g. ServiceNow)","l2":["06.4.5"],"when":{"labor-effort-signal":["fixed-capacity"]}},{"n":"18","type":"Service task","lane":"Costing / TBM Studio","task":"Generate SAP-ready monthly actuals - CapEx / OpEx by user","note":"Deprecates time writing; join gateway before this step","l2":["06.4.6"]}],"upstream":["UC2"],"downstream":["UC4"],"kind":null},{"id":"UC4","name":"TCO up","title":"Cost actuals to application TCO","legacy_id":"09.4","products":["Costing"],"summary":"All cost actuals roll up to Application TCO; because labor arrives attached to work, run vs change attribution is driven by real delivery data rather than a story-level Jira import.","cadence":"Monthly","lanes":["Costing / TBM Studio"],"steps":[{"n":"19","type":"Task","lane":"Costing / TBM Studio","task":"Roll cost actuals up to Application TCO","l2":["06.3.2","06.3.3"]},{"n":"20","type":"Task","lane":"Costing / TBM Studio","task":"Attribute labor cost to run vs. change in App TCO view","note":"Driven by real delivery data, not story-level Jira import","l2":["06.3.3","06.2.3"]},{"n":"end","type":"End event","lane":"Costing / TBM Studio","task":"Finance & App TCO reporting","l2":["06.1.4","08.1.1"]}],"upstream":["UC1","CLD"],"downstream":["ZBB"],"kind":null},{"id":"CLD","name":"Cloud to TBM","title":"Cloud cost into the TBM model","legacy_id":"09.5","products":["Cloudability","Costing"],"summary":"Cloud cost and capacity data flows from Cloudability into the Costing model, ATUM-aligned, so Application TCO and business-unit consumption include cloud.","cadence":"Monthly","lanes":["Cloudability","Costing / TBM Studio"],"steps":[{"n":"c1","type":"Task","lane":"Cloudability","task":"Allocate & ATUM-map cloud spend (towers, services)","l2":["07.2.3","07.2.4"]},{"n":"c2","type":"Send task","lane":"Cloudability","task":"Share cloud cost + capacity data to Costing","note":"Monthly","l2":["07.2.4"]},{"n":"c3","type":"Task","lane":"Costing / TBM Studio","task":"Include cloud in App TCO, BU consumption & Bill of IT","l2":["06.3.3","08.1.1","08.1.2"]}],"upstream":[],"downstream":["UC4"],"kind":null},{"id":"INV","name":"Investment loop","title":"Portfolio-finance investment round-trip","legacy_id":"09.6","products":["Targetprocess","Costing","Planning"],"summary":"Investments, planned allocations and actual effort flow from Targetprocess to Costing/Planning; approved budgets and budget changes flow back - continuous portfolio-finance reconciliation.","cadence":"Continuous","lanes":["Targetprocess / ATP","Costing / TBM Studio","IT Planning (Finance)"],"steps":[{"n":"i1","type":"Send task","lane":"Targetprocess / ATP","task":"Send investments, planned labor allocations, actual effort, budget-change requests to Costing/Planning","l2":["02.2.3","05.7.3"]},{"n":"i2","type":"Task","lane":"Costing / TBM Studio","task":"Reconcile investment spend; update approved budgets","l2":["05.7.1","05.7.3"]},{"n":"i3","type":"Send task","lane":"IT Planning (Finance)","task":"Send approved investment budgets & budget changes to Targetprocess","note":"Budgets, Labor Data, Objectives, Financial Guidance down; Progress, Actuals, Key Results up","l2":["05.7.3","02.4.2"]}],"upstream":["UC3"],"downstream":[],"kind":null},{"id":"ZBB","name":"ZBB re-base","title":"Zero-based re-base to investment uplift","legacy_id":"09.7","products":["Costing","Planning","Targetprocess","Cloudability"],"summary":"The zero-based cycle as a cross-tool flow: Costing supplies the fact base for in-scope decision units; Planning hosts package build, ranking, cut-line and approval; freed run spend rides the existing UC3 target feed to Targetprocess as an uplift; monthly actuals return via UC4 to police package commitments. Reuses UC3 and UC4 - no new integration.","cadence":"Per ZBB cycle (annual, rotational) + monthly monitoring","lanes":["IT Planning (Finance)","Costing / TBM Studio","Budget owners (in Planning)","Targetprocess / ATP"],"steps":[{"n":"z0","type":"Start event (timer)","lane":"IT Planning (Finance)","task":"ZBB cycle opens for this year's rotation slice","note":"Rotational: each decision unit every 2-3 years","l2":["05.8.1"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z1","type":"User task","lane":"IT Planning (Finance)","task":"Select decision units; name cost-category owners x budget owners; define zero base","l2":["05.8.1"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z2","type":"Service task","lane":"Costing / TBM Studio","task":"Build activity & cost-driver fact base per decision unit","note":"Same allocated model as UC4; Cloudability rightsizing sets the cloud zero base","l2":["05.8.2","07.5.1"]},{"n":"z3","type":"Send task","lane":"Costing / TBM Studio","task":"Publish fact base & zero-base floors to Planning (actuals import)","note":"Reuses Costing to Planning actuals integration","l2":["05.3.1"]},{"n":"z4","type":"User task","lane":"Budget owners (in Planning)","task":"Build decision packages at Minimum / Current / Enhanced tiers","note":"Labor positions come from Targetprocess via UC3 steps 7-8","l2":["05.8.3"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z5","type":"User task","lane":"IT Planning (Finance)","task":"Rank packages; compare cumulative cost to target; draw cut-line; pressure-test","note":"One Planning version per cut-line scenario","l2":["05.8.4"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z6","type":"XOR gateway","lane":"IT Planning (Finance)","task":"Cut-line within target?","note":"No: return packages for rework (loop to z4); Yes: continue","l2":["05.8.4"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z7","type":"User task","lane":"IT Planning (Finance)","task":"Approve; merge ZBB units into master plan; snapshot as budget of record & savings baseline","l2":["05.8.5","05.1.4","05.1.5"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z8","type":"Send task (ADM)","lane":"IT Planning (Finance)","task":"Send revised targets incl. freed-spend uplift to Targetprocess","note":"= UC3 step 2, re-run with the post-ZBB target","l2":["05.8.5"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z9","type":"Task","lane":"Targetprocess / ATP","task":"Apply uplift to value-stream / portfolio envelopes; fund change","l2":["02.4.2","02.2.3"],"when":{"budget-build-method":["zbb-rotational","zbb-full"]}},{"n":"z10","type":"Task (monthly)","lane":"Costing / TBM Studio","task":"Actuals vs package commitments; savings realization; block leakage","l2":["05.8.6","06.2.2","05.3.2","08.2.3"]},{"n":"end","type":"End event","lane":"IT Planning (Finance)","task":"Cycle retrospective; next rotation slice selected","l2":["05.8.6"]}],"upstream":["UC3","UC4"],"downstream":["UC3"],"kind":null}],"glossary":[["ADM","Apptio Data Management - the \"data highway\" that moves data between the four products"],["ART","Agile Release Train - a long-lived team of agile teams (SAFe)"],["ATP","Apptio Targetprocess"],["ATUM","Apptio TBM Unified Model - the standard cost taxonomy (cost pools > towers > services)"],["BAU","Business as usual - run work, as opposed to change"],["BU","Business unit"],["CapEx / OpEx","Capital vs operating expenditure - affects how labor and assets are accounted for"],["CFD","Customer-facing deck (internal evidence shorthand)"],["CUD","Committed use discount (Google Cloud)"],["EAP","Enterprise Agile Planning"],["EBM","Enterprise Business Management - extending TBM costing beyond IT"],["FinOps","Cloud financial management practice and framework"],["FOCUS","FinOps Open Cost and Usage Specification - a common billing data format"],["FP&A","Financial planning & analysis"],["FTE","Full-time equivalent"],["GL","General ledger"],["HPM","Hybrid Portfolio Management (Targetprocess solution area)"],["IIP","Integrated Investment Planning (Planning feature)"],["ITFM","IT financial management"],["KPI","Key performance indicator"],["LPM","Lean Portfolio Management (SAFe)"],["OKR","Objectives and key results"],["PI","Planning Interval (formerly Program Increment) - an 8-12 week SAFe planning cadence"],["PMO","Project/portfolio management office"],["RI / SP","Reserved instances / savings plans - cloud commitment discounts"],["ROAM","Resolved, Owned, Accepted, Mitigated - SAFe risk handling"],["RTE","Release Train Engineer"],["SAFe","Scaled Agile Framework"],["SPM","Strategic Portfolio Management"],["TBM","Technology Business Management - the framework for IT cost transparency and value"],["TCO","Total cost of ownership"],["VSM","Value stream management"],["WFM","Workforce management"],["WSJF","Weighted shortest job first - a SAFe prioritization formula"],["ZBB / ZBx","Zero-based budgeting / zero-based mindset as a continuous practice"]],"changelog":[{"version":"0.7.0","date":"2026-09-15","items":["Design-decision register added (decisions[]): 11 choices a customer makes once - labor effort signal (story points / item count / timesheets / work-effort units / fixed capacity), labor rate exposure, budget build method, portfolio funding model, investment governance, prioritization method, capacity basis, demand intake channel, cloud commitment mode, IT cost recovery model and team tool of record - each with options, fit, prerequisites, trade-offs and the L2s and flows it affects.","L2 variants: the same process done a different way under an option of a decision (variants[] on 21 L2s, e.g. 06.4.5 has one variant per labor effort signal). Variant fields override the base record; the base stays method-neutral.","L2 applicability (applies_when) marks processes that only exist under certain options, e.g. 04.5.2 Approve timesheets, 05.8.x under ZBB, 07.5.4 under Savings Automation.","Flow-step conditions (when / decision) on UC1 steps 17-17b and ZBB z0-z9 so gateways are labeled from the register and the profile view dims steps that are off-path.","Site: Decisions page (#/decisions) doubles as a customer-profile picker; records show approach tabs; register gains a Decision facet and an 'Approaches' column; flow pages show step conditions. Docs and the Excel master gain Decisions and Variants outputs.","Base text of 04.5.1, 04.5.3, 06.4.5 and 02.2.2 rewritten method-neutral; the 'alternative' prose moved into variants. budgeting_method tags are retained and now documented by decision D-03."]},{"version":"0.6.0","date":"2026-09-15","items":["Repository build: data/catalog.json is now the single source of truth; the GitHub Pages site, docs, Mermaid, BPMN XML, SVG snapshots and Excel master are all regenerated from it by scripts/generate.py.","BPMN 2.0 swimlane diagrams for every process area (9), every process group (45) and every cross-tool flow (7), both in the site and as importable .bpmn files with SVG snapshots.","Folded in the PI Planning / Enterprise Value Delivery agent requirements that only lived in the old YAML catalog: 03.1 renamed to quarterly planning on the SAFe PI cadence, two new L2s (03.1.5 ROAM & confidence vote, 03.1.6 System demo & Inspect and Adapt), enriched 01.1.2, 01.2.1, 02.1.2, 02.2.1, 02.3.2, 02.3.3, 03.1.1, 03.1.4, 05.7.2, and a new group 10.7 AI-assisted planning & delivery intelligence (10.7.1-10.7.3).","Structure is now 9 L0 · 45 L1 · 149 L2 · 7 flows."]},{"version":"0.5.0","date":"2026-09-15","items":["BPMN 2.0 swimlane diagram on every flow page, generated from the step table, with BPMN XML export."]},{"version":"0.5.0","date":"2026-09-15","items":["BPMN 2.0 swimlane diagram rendered on every flow page (UC3, UC2, UC1, UC4, CLD, INV, ZBB), generated from the step table: lanes per system/role, task types (user, service, send/ADM), exclusive gateways with Yes/No branches, rejection end events and rework loops. Tasks link to the catalog process they invoke.","BPMN 2.0 XML export (with diagram interchange) per flow, copyable for Camunda, bpmn.io, Visio, Signavio or Draw.io."]},{"version":"0.4.0","date":"2026-09-15","items":["L0-09 \"Cross-tool end-to-end flows\" converted from a process area into seven flow overlays (UC3, UC2, UC1, UC4, CLD, INV, ZBB). Its L2 rows 09.1.1-09.7.1 are retired; the flow pages carry their content.","06.7 Investment mix analysis merged into 06.2 (06.7.1 is now 06.2.3).","07.7 Cloud sustainability merged into 07.3 (07.7.1 is now 07.3.4).","08.2 Demand shaping, 08.3 EBM and 08.4 Executive rhythm merged into 08.2 \"Engage the business & steer value\" (08.3.1 is now 08.2.2, 08.4.1 is now 08.2.3).","Permanent element IDs (P-0001 ...) added to every L2; group IDs (G-011 ...) to every L1.","10.4.1 Configure FinOps tooling split into 10.4.1 (data, mappings & views) and 10.4.2 (budgets, alerts, optimization & governance) so 10.4 has two children.","L1 names linted to verb-noun.","Every L2 gains a plain-language outcome line, a normalized persona vocabulary (16 roles), a cadence bucket and a completeness count.","Review layer added: status per L2, verdict per L1, comments anchored to element ID."]},{"version":"0.3.0","date":"2026-09-02","items":["Zero-based budgeting added as a selectable budgeting method (05.8, flow ZBB, Budgeting-method tags)."]},{"version":"0.2.0","date":"2026-08-18","items":["Initial L0-L2 catalog built from framework research, IBM product documentation and the cross-tool E2E BPMN."]}],"decisions":[{"id":"D-01","key":"labor-effort-signal","name":"Labor effort signal","domain":"Labor costing & capitalization","question":"How is labor effort captured and attached to work so it can be costed, capitalized and rolled into App TCO?","why":"Drives which Targetprocess entities carry effort, what crosses the ADM feed to Costing, how team cost is spread over work and towers, and what the auditors see behind the CapEx file. Most customers mix approaches by team kind (e.g. story points for product teams, fixed capacity for ops queues), so this decision is normally made per team type.","multi":true,"default":"story-points","options":[{"id":"story-points","name":"Cost per story point","summary":"Monthly team cost divided by story points completed gives a cost per point; cost lands on epics, features and applications in proportion to the points delivered against them. Effort is never typed in - it comes from the backlog.","fit":"Agile teams with a visible, well-groomed backlog in Targetprocess or a synced Jira/ADO. The Apptio reference pattern ('deprecates time writing').","prereqs":"Involvements % (04.1.2), job profiles with CapEx/OpEx split (04.1.3), protected rates (06.4.1), completed-work feed to Costing (UC1), a capitalization policy signed off with Finance/audit.","tradeoffs":"Points are only comparable within a team - always normalize per team, never enterprise-wide. Un-estimated or carried-over work distorts the month. Needs backlog hygiene and a documented policy for auditors.","evidence":"E2E BPMN g_vis/t_work; e2e script UC1"},{"id":"story-count","name":"Cost per completed work item","summary":"Same mechanism as story points but every completed story/work item weighs the same. Team cost divided by items done.","fit":"Kanban / no-estimates teams, support and enhancement teams whose items are of similar size.","prereqs":"As story points, minus estimation discipline.","tradeoffs":"A one-line fix and a two-week story cost the same; acceptable only where item sizes are homogeneous.","evidence":"Costing labor allocation options (06.4.5 config)"},{"id":"timesheet","name":"Timesheets (hours x rate)","summary":"People log hours against work items or projects in the Time entity; managers approve weekly; approved hours x rate is the labor cost attached to work and the basis for CapEx.","fit":"Traditional and hybrid delivery, professional-services and contractor billing, regulated environments that require hours as the capitalization evidence, or where Finance already runs a timesheet regime.","prereqs":"Time Tracking solution + Timesheet approval workflow (04.5.1-04.5.2), rate source (job-profile or blended rate), timesheet compliance reporting.","tradeoffs":"Highest burden and the classic accuracy decay (end-of-week estimates, 'other' buckets). Needs chasing and compliance metrics. Strongest audit trail.","evidence":"TP Time Tracking; 2026.03 Timesheet with Approval Workflow solution sheet"},{"id":"work-effort-unit","name":"Planned work-effort units (allocation-based)","summary":"Work Allocations (% or man-days per person/team per period) are treated as the effort signal; no hours are recorded. Cost = allocation x rate, trued up periodically against actual completion.","fit":"Hybrid organizations that plan resourcing carefully but will not run timesheets; project-based funding where the plan is the contract.","prereqs":"Demand & Capacity solution with Work Allocations (04.3.1 / 04.3.4), a true-up rule (quarterly or at project close), blended rates (UC2).","tradeoffs":"Planned is not actual - variance hides until true-up. Weaker capitalization evidence than hours; usually paired with a sign-off step.","evidence":"LFM demo (requested man-days); WFM deck"},{"id":"fixed-capacity","name":"Fixed capacity (team to tower/app)","summary":"No work-level attribution at all: the team's monthly cost is allocated to applications or IT towers by a standing rule (team->tower mapping, % splits).","fit":"Run/operations teams without a visible backlog (ServiceNow queues, infrastructure ops, service desk), platform teams charged as shared services.","prereqs":"Team->IT tower / application mapping (04.1.3), allocation strategy in Model Studio (06.1.2).","tradeoffs":"No run-vs-change split from data; capitalization only via a fixed % if policy allows. Simplest to operate.","evidence":"E2E BPMN t_tower; e2e script (ServiceNow example)"}],"affects":["04.1.3","04.5.1","04.5.2","04.5.3","06.4.3","06.4.5","06.4.6"],"flows":["UC1"],"related":["rate-exposure","capacity-basis"]},{"id":"D-02","key":"rate-exposure","name":"Labor rate exposure","domain":"Labor costing & capitalization","question":"Which labor rate is allowed to leave Costing and be used in Targetprocess to cost work?","why":"Individual compensation is sensitive; the level at which rates are blended sets who can see what, how accurate costed allocations are, and whether a true-up is needed between the rate used in the portfolio and actuals in Costing.","multi":false,"default":"blended-team","options":[{"id":"blended-team","name":"Blended team / ART rate","summary":"Costing computes one blended rate per team, ART or solution train from protected individual rates and publishes only that. Portfolio costs work at the team rate.","fit":"Most enterprises; the Apptio reference pattern.","prereqs":"Team structure with involvements (04.1.2), ATP CM Rate Transform (06.4.1), ADM rate feed (06.4.2).","tradeoffs":"Costed allocations drift from actuals when team mix changes - define a true-up (monthly or quarterly).","evidence":"E2E BPMN t_rates/t_send4; e2e script UC2"},{"id":"role-location","name":"Job-profile rate (role x location)","summary":"Standard rate card per job profile (role x location, optionally employment type) published to Targetprocess; individuals inherit their profile's rate.","fit":"Organizations with a mature rate card, project-based estimating, PS/contractor mixes, or where teams are too fluid to blend.","prereqs":"Job Profile entities with rate linkage (04.1.3), rate card governance (annual refresh).","tradeoffs":"More granular than a team rate and still non-identifying, but a rate card needs owning and refreshing.","evidence":"E2E BPMN t_data; Planning labor rate cards (05.7.2)"},{"id":"individual","name":"Individual (actual) rates","summary":"Actual loaded cost per person leaves Costing and is used to cost allocations and time.","fit":"Small IT organizations, PS firms, or where Finance already exposes comp to project accounting.","prereqs":"Restricted-access roles in Targetprocess, HR/works-council approval, field-level permissions.","tradeoffs":"Most accurate, but exposes compensation in a delivery tool; usually blocked by HR/privacy. Not the default.","evidence":"06.4.1 rate-exposure design decision"}],"affects":["04.1.3","06.4.1","06.4.2","04.3.1","02.4.3"],"flows":["UC2"],"related":["labor-effort-signal"]},{"id":"D-03","key":"budget-build-method","name":"Budget build method","domain":"IT financial planning","question":"How is the IT budget built for a given decision unit and cycle?","why":"Sets whether 05.1 or 05.8 is the path for a cost center, tower, service or application, how the baseline is seeded, and whether the ZBB flow runs. Selectable per decision unit and per cycle - a rotation is the normal pattern.","multi":true,"default":"driver-based","options":[{"id":"incremental","name":"Incremental","summary":"Prior-year budget or actuals seeded as the baseline, adjusted line by line for known changes.","fit":"Stable run units between ZBB rotations; low-effort cycles.","prereqs":"Prior plan / actuals import (05.1.1).","tradeoffs":"Carries last year's inefficiencies forward; weakest challenge of the run base.","evidence":"Planning docs (Adjust Baseline Values)"},{"id":"driver-based","name":"Driver-based","summary":"Lines are built from drivers (headcount, contracts, assets, volumes) with rates; the baseline is regenerated from drivers rather than copied.","fit":"The default for most units; pairs with rolling forecasting (05.2).","prereqs":"Driver data (positions, contracts, asset register), driver-based line items in Planning.","tradeoffs":"Needs clean driver feeds; still anchored on current activity levels.","evidence":"Planning docs; Apptio rolling-forecast method"},{"id":"zbb-rotational","name":"Zero-based - rotational","summary":"A subset of decision units is rebuilt from a zero base each cycle (each unit every 2-3 years); the rest run driver-based. Decision packages at Minimum / Current / Enhanced tiers, ranked to a cut-line.","fit":"Organizations that want the challenge of ZBB without the annual burden. The catalog's primary ZBB variant.","prereqs":"Group 05.8, cost-category owners, TBM fact base (06.x), rotation calendar (10.6.1).","tradeoffs":"Two budgeting paths in one cycle; needs the merge step 05.8.5.","evidence":"Gartner; McKinsey; Apptio ZBB blog"},{"id":"zbb-full","name":"Zero-based - all units annually","summary":"Classic ZBB: every decision unit justified from zero every year.","fit":"Turnaround / cost-out programs with executive mandate.","prereqs":"As rotational, at full scale; FP&A facilitation capacity.","tradeoffs":"The historical failure mode (burden, sandbagging); rarely sustained beyond 2-3 cycles.","evidence":"Pyhrr; Kraft Heinz / federal cases"},{"id":"zbx","name":"Zero-based mindset (continuous)","summary":"No annual ZBB event; cost-category owners run a continuous zero-based review inside the monthly rhythm (05.8.6 as an operating cadence).","fit":"Organizations past their first ZBB cycles that want to keep the discipline without the event.","prereqs":"Monthly variance with package-level thresholds (05.3.2 / 06.2.2), owner community.","tradeoffs":"Depends on culture and incentives; without the event the challenge can fade.","evidence":"Accenture ZBx; FinOps Budgeting (Run maturity)"}],"affects":["05.1.1","05.1.3","05.1.4","05.1.5","05.8.1","05.8.2","05.8.3","05.8.4","05.8.5","05.8.6","07.6.1"],"flows":["ZBB"],"related":["funding-model"]},{"id":"D-04","key":"funding-model","name":"Portfolio funding model","domain":"Demand & portfolio investment","question":"Is change work funded per project, per value stream/product, or both during a transition?","why":"Decides the shape of the Budgeting solution in Targetprocess, whether budgets attach to Projects or to Portfolios/ARTs, what the investment loop with Planning carries, and how top-down targets are applied.","multi":false,"default":"hybrid","options":[{"id":"project-based","name":"Project-based funding","summary":"Money is approved per project/initiative with a business case and a defined scope; actuals are tracked per project.","fit":"Traditional and regulated PMOs, capital-project cultures, organizations early on the SPM journey.","prereqs":"Project entities with budgets, stage-gate governance (D-05), investment tags in Planning (05.7.1).","tradeoffs":"Re-planning is slow; funding follows projects rather than capacity; encourages large batches.","evidence":"EAP CFD (annual -> continuous); TP Budgeting"},{"id":"value-stream","name":"Value-stream / product funding (Lean Budgets)","summary":"Capacity is funded per value stream, ART or product with guardrails; epics are approved inside the envelope, not funded individually.","fit":"SAFe / LPM organizations, product operating models.","prereqs":"Value streams as Portfolios/Groups (03.4.1), Lean Budget guardrails (02.4.1), participatory budgeting forums.","tradeoffs":"Finance must accept capacity-based accounting; capitalization moves to the labor model (D-01).","evidence":"SAFe Lean Budgets; TP Budgeting solution"},{"id":"hybrid","name":"Hybrid (both, side by side)","summary":"Project-based and value-stream funding coexist - typically during a multi-year transition or where some domains stay project-shaped.","fit":"Most large enterprises today.","prereqs":"Common categorization (BAU vs change, CapEx/OpEx) across both (02.3.4), Hybrid Portfolio Management solution.","tradeoffs":"Two governance paths to keep consistent; reporting must reconcile both.","evidence":"WFM deck (hybrid programs); Customer PowerUp"}],"affects":["02.4.1","02.4.2","02.2.3","05.7.1","05.7.2","05.7.3"],"flows":["INV","UC3"],"related":["investment-governance","budget-build-method"]},{"id":"D-05","key":"investment-governance","name":"Investment approval governance","domain":"Demand & portfolio investment","question":"How does an investment get approved - phase gates, lean portfolio flow, or both?","why":"Shapes entity workflows and per-state permissions in Targetprocess, which forums decide, and whether Portfolio Kanban states or gate reviews are the control points.","multi":false,"default":"hybrid","options":[{"id":"stage-gate","name":"Stage-gate","summary":"Initiatives pass formal gates (concept, business case, design, build, deploy) with documented approvals and criteria at each.","fit":"Traditional PMOs, regulated change, capital projects.","prereqs":"Entity states as gates with role permissions, milestone entities, gate evidence fields (03.3.3).","tradeoffs":"Predictable control, slow flow; encourages big up-front business cases.","evidence":"Traditional PM solution; stage-gate research"},{"id":"lean-lpm","name":"Lean portfolio flow (Portfolio Kanban)","summary":"Epics move Funnel > Reviewing > Analyzing > Backlog > Implementing with WIP limits; approval is the move to Backlog within the value-stream guardrails.","fit":"SAFe / LPM organizations with value-stream funding.","prereqs":"Portfolio Epic workflow, WSJF or scoring (D-06), Lean Budgets (D-04).","tradeoffs":"Needs trust in guardrails; auditors may want an explicit approval artifact.","evidence":"SAFe LPM; TP entity workflows (02.1.3)"},{"id":"hybrid","name":"Hybrid","summary":"Gates for large/regulated initiatives, lean flow for value-stream work - one governed portfolio view over both.","fit":"Enterprises running agile and traditional delivery together.","prereqs":"Hybrid Portfolio Management solution, common categorization (02.3.4).","tradeoffs":"Clear rules needed for which path an item takes.","evidence":"WFM deck; Customer PowerUp (hybrid)"}],"affects":["02.1.3","02.2.3","03.3.3"],"flows":["INV"],"related":["funding-model","prioritization-method"]},{"id":"D-06","key":"prioritization-method","name":"Prioritization method","domain":"Demand & portfolio investment","question":"How is the portfolio backlog ranked?","why":"Determines which custom and calculated fields exist on epics, what the ranking views show and how ZBB packages are ranked when 05.8 runs.","multi":false,"default":"wsjf","options":[{"id":"wsjf","name":"WSJF","summary":"Cost of delay (business value + time criticality + risk reduction/opportunity enablement) divided by job size, as a calculated field.","fit":"SAFe organizations; fast, relative ranking.","prereqs":"Numeric custom fields BV/TC/RR-OE/size, calculated field or metric, prioritized list views (02.2.2).","tradeoffs":"Relative, gameable, weak for compliance/mandatory work.","evidence":"SAFe WSJF; TP calculated fields"},{"id":"weighted-scoring","name":"Weighted objective scoring","summary":"Configurable criteria (strategic alignment, value, risk, cost, compliance) with weights; a score per item; often per portfolio.","fit":"Hybrid and traditional portfolios; organizations that must show a defensible model to a board.","prereqs":"Scoring custom fields, Portfolio Epic Score report, objective-scoring configuration.","tradeoffs":"Weights need governance; can become a spreadsheet exercise.","evidence":"WFM deck prioritization; TP Portfolio Epic Score"},{"id":"manual","name":"Manual / forum ranking","summary":"A governance forum ranks items by hand (drag-order or rank field) informed by business cases.","fit":"Small portfolios, early maturity.","prereqs":"Rank/order field, prioritized list views.","tradeoffs":"Opaque; depends on who is in the room.","evidence":"SPM maturity model (Foundational)"}],"affects":["02.2.2","05.8.4"],"flows":[],"related":["investment-governance"]},{"id":"D-07","key":"capacity-basis","name":"Capacity planning basis","domain":"Workforce & resource management","question":"Is capacity planned and allocated per team, per role/named individual, or both?","why":"Decides whether Work Allocations attach to teams or people, how demand is expressed (team % vs role man-days) and which capacity views and reports are configured.","multi":false,"default":"both","options":[{"id":"team-based","name":"Team-based","summary":"Long-lived teams are the unit of capacity; work is allocated to teams and ARTs by % or PI capacity.","fit":"Agile at scale; value-stream funding.","prereqs":"Team entities with involvements (04.1.2), team allocation views.","tradeoffs":"Named-resource requests (specialists) have no home.","evidence":"E2E BPMN t_alloc; SAFe capacity"},{"id":"role-individual","name":"Role / individual-based","summary":"Demand is expressed as roles and man-days; named individuals are assigned to projects with availability checks.","fit":"Project-based PMOs, PS organizations, shared specialist pools.","prereqs":"Role-based demand requests, Work Allocations at person level, availability / vacation integration (04.3.4).","tradeoffs":"Heavier to maintain; utilization chasing.","evidence":"LFM demo (requested man-days)"},{"id":"both","name":"Both (one capacity model)","summary":"Team-based for agile work and role/individual-based for project work in the same capacity model.","fit":"Hybrid organizations - the common case.","prereqs":"Both configurations plus a rule for which work type uses which.","tradeoffs":"Double-counting risk where a person is both in a team and on a project - involvements must sum to 100%.","evidence":"WFM deck; 04.2.1 / 04.3.4"}],"affects":["04.2.1","04.2.2","04.3.1","04.3.4","05.7.2"],"flows":["UC3"],"related":["labor-effort-signal"]},{"id":"D-08","key":"demand-intake-channel","name":"Demand intake channel","domain":"Demand & portfolio investment","question":"Where do ideas and requests enter - the Targetprocess Service Desk, a ServiceNow front end, or email/forms?","why":"Sets which portal is configured, whether an integration is needed, and where triage happens.","multi":true,"default":"tp-service-desk","options":[{"id":"tp-service-desk","name":"Targetprocess Service Desk portal","summary":"Requesters use the built-in portal; Request entities and request types with voting.","fit":"Organizations standardizing on Targetprocess for intake.","prereqs":"Service Desk portal, Request entity + types, automation rules for routing (02.1.1-02.1.2).","tradeoffs":"Another portal for business users if ServiceNow already exists.","evidence":"TP guide Service Desk"},{"id":"servicenow","name":"ServiceNow ideation / demand front end","summary":"Ideas are raised in ServiceNow; an integration creates Requests/epics in Targetprocess for qualification.","fit":"ServiceNow-centric enterprises.","prereqs":"ServiceNow integration (10.1.5), field mapping, status sync.","tradeoffs":"Two systems of record for the early lifecycle; sync rules matter.","evidence":"WFM deck (ServiceNow ideation front-end)"},{"id":"email-forms","name":"Email / forms","summary":"Requests arrive by email or a form and are created by automation or a triage team.","fit":"Small volumes, interim state.","prereqs":"Email integration, automation rules.","tradeoffs":"Low structure; manual triage.","evidence":"TP email integration"}],"affects":["02.1.1","02.1.2","10.1.5"],"flows":[],"related":[]},{"id":"D-09","key":"cloud-commitment-mode","name":"Cloud commitment management mode","domain":"Cloud financial management","question":"Are reserved-instance / savings-plan / CUD commitments managed by hand, assisted by recommendations, or automated?","why":"Decides whether 07.5.3 or 07.5.4 is the operating process, what guardrails and roles are configured, and how Finance approves commitments.","multi":false,"default":"assisted","options":[{"id":"manual","name":"Manual (vendor consoles)","summary":"Commitments are bought in the cloud vendor consoles on a periodic review; Cloudability reports coverage.","fit":"Small cloud spend; early FinOps maturity (Crawl).","prereqs":"Commitment Overview reports.","tradeoffs":"Under-coverage and expiry misses are common.","evidence":"FinOps Framework Rate Optimization (Crawl)"},{"id":"assisted","name":"Assisted (recommendations + approval)","summary":"Cloudability generates purchase/exchange recommendations; FinOps and Finance approve and execute.","fit":"Most organizations (Walk).","prereqs":"Commitment Recommendations, approval forum, procurement alignment (07.5.3).","tradeoffs":"Human latency; coverage typically 70-85%.","evidence":"IBM Docs commitments"},{"id":"automated","name":"Automated (Savings Automation)","summary":"Commitment portfolio managed on autopilot within per-account / per-region guardrails; savings-share billing.","fit":"Large, steady AWS/Azure estates (Run).","prereqs":"RateOptimizationFullAccess role, guardrail configuration (07.5.4 / 10.4.2), Finance sign-off on savings-share.","tradeoffs":"Governance shifts to guardrails; commercial model to accept.","evidence":"IBM Docs Savings Automation"}],"affects":["07.5.3","07.5.4","10.4.2"],"flows":[],"related":[]},{"id":"D-10","key":"cost-recovery-model","name":"IT cost recovery model","domain":"Consumption & chargeback","question":"Does IT show costs back, charge them back at allocated cost, or charge priced services with over/under recovery?","why":"Sets whether the Billing product is needed, whether a price list and O/U recovery process exist, and how BU conversations are framed.","multi":false,"default":"showback","options":[{"id":"showback","name":"Showback","summary":"BUs receive a Bill of IT for information; no journal entries.","fit":"First years of TBM; where BU budgets do not carry IT cost.","prereqs":"BU allocation (08.1.1), Bill of IT reports (08.1.2).","tradeoffs":"Influences behavior less than real charges.","evidence":"TBM assessment (showback at service level)"},{"id":"chargeback-cost","name":"Chargeback at allocated cost","summary":"Allocated cost is journaled to BU cost centers each period; full recovery by construction.","fit":"Organizations with BU P&L accountability.","prereqs":"Billing product or GL journal export, agreed drivers, dispute process.","tradeoffs":"Charges fluctuate with allocation changes; BUs contest drivers.","evidence":"Apptio Billing"},{"id":"chargeback-priced","name":"Chargeback at service prices","summary":"Services are priced (unit rates from 06.3.4); BUs are charged consumption x price; IT manages over/under recovery.","fit":"Mature TBM with a service catalog; shared-service models.","prereqs":"Service unit costs, pricing strategy and what-if modeling, O/U recovery management (08.1.3).","tradeoffs":"Pricing governance and recovery variance to manage; strongest demand shaping.","evidence":"Apptio Billing (pricing, O/U recovery)"}],"affects":["07.2.3","08.1.1","08.1.2","08.1.3","08.2.1"],"flows":["UC4","CLD"],"related":[]},{"id":"D-11","key":"team-of-record","name":"Team tool of record","domain":"Agile program & delivery","question":"Do teams work in Targetprocess natively, or in Jira / Azure DevOps synced into Targetprocess as the aggregation layer?","why":"Decides which connectors exist, where iteration planning happens and what completed-work data is available for the labor model.","multi":true,"default":"synced","options":[{"id":"native","name":"Targetprocess native","summary":"Teams plan iterations and execute stories in Targetprocess boards.","fit":"Greenfield or consolidating tool estates.","prereqs":"Team boards, story/bug/task workflows (03.2.1).","tradeoffs":"Migration of team habits and history.","evidence":"TP entity model"},{"id":"synced","name":"Jira / ADO synced","summary":"Teams stay in Jira or Azure DevOps; native bi-directional connectors keep Targetprocess as the aggregation layer for portfolio and finance.","fit":"Most enterprises with established engineering tooling.","prereqs":"Native connectors, area/iteration path mapping, hierarchy rules (03.2.4).","tradeoffs":"Mapping governance; do not import story-level detail into cost systems.","evidence":"TP integrations; e2e script anti-pattern"}],"affects":["03.2.1","03.2.4","02.3.4"],"flows":["UC1"],"related":["labor-effort-signal"]}]}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const L0S = DATA.l0s, FLOWS = DATA.flows;
const L0 = Object.fromEntries(L0S.map(l=>[l.id,l]));
const L1 = {}, L2 = {}, L2BYEID = {};
L0S.forEach(l0=>l0.l1s.forEach(l1=>{L1[l1.id]=l1; l1.l0=l0.id; l1.l2s.forEach(l2=>{L2[l2.id]=l2; L2BYEID[l2.eid]=l2; l2.l1=l1.id; l2.l0=l0.id;});}));
const ALL_L2 = Object.values(L2);
const FLOW = Object.fromEntries(FLOWS.map(f=>[f.id,f]));
const DECISIONS = DATA.decisions||[];
const DEC = Object.fromEntries(DECISIONS.map(d=>[d.key,d]));
const OPT = (key,id)=>{ const d=DEC[key]; return d && d.options.find(o=>o.id===id); };
const STATUS ={draft:'Draft',review:'In review',changes:'Changes requested',confirmed:'Confirmed'};
const VERDICT = {'':'No verdict yet',confirmed:'Confirmed',updated:'Updated',flagged:'Flagged'};
const PCOLOR = {Targetprocess:'var(--tp)',Costing:'var(--co)',Planning:'var(--pl)',Cloudability:'var(--cl)','All four':'var(--all)'};
const BUSINESS_FIELDS = ['inputs','description','outcome','who','where','cadence'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,el=document)=>el.querySelector(s);
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- review state (shared via db when available, local otherwise) ----------
const review = {statuses:{}, verdicts:{}, owners:{}, comments:{}};   // by element id
let db = null, dbReady = false, shared = false;
let lens = ls.get('lens','business');
let reviewer = ls.get('reviewer','');
const localReview = ls.get('review',{statuses:{},verdicts:{},owners:{},comments:{}});
Object.assign(review, localReview);

function reviewDocName(eid){ return eid; }
async function saveReview(eid, patch){
  const cur = Object.assign({}, review.statuses[eid]?{status:review.statuses[eid]}:{}, review.verdicts[eid]||{}, review.owners[eid]?{owner:review.owners[eid]}:{});
  const body = Object.assign(cur, patch, {by:reviewer||'anonymous', at:new Date().toISOString()});
  applyReviewDoc(eid, body);
  if(db){ try{ await db.doc('review/'+eid).set(body);}catch(e){ console.warn('db write failed',e); } }
  else { ls.set('review', review); }
  renderProgress(); refreshInline(eid);
}
function applyReviewDoc(eid, d){
  if(!d) return;
  if(d.status) review.statuses[eid]=d.status;
  if('verdict' in d) review.verdicts[eid]={verdict:d.verdict||'',note:d.note||'',by:d.by,at:d.at};
  if('owner' in d) review.owners[eid]=d.owner||'';
}
async function addComment(eid, attr, text){
  const c = {by:reviewer||'anonymous', at:new Date().toISOString(), attr:attr||'', text};
  const list = (review.comments[eid]||[]).concat([c]);
  review.comments[eid]=list;
  if(db){ try{ await db.doc('comments/'+eid).set({items:list}); }catch(e){ console.warn(e);} }
  else ls.set('review', review);
  refreshInline(eid);
}
function refreshInline(eid){
  document.querySelectorAll('[data-eid="'+eid+'"]').forEach(el=>{
    const l2 = L2BYEID[eid];
    if(l2){ const holder=el; const fresh=document.createElement('div'); fresh.innerHTML=recordHTML(l2); holder.replaceWith(fresh.firstElementChild); }
    else if(el.classList.contains('ghead')){ const l1=Object.values(L1).find(g=>g.eid===eid); if(l1){const f=document.createElement('div'); f.innerHTML=gheadHTML(l1); el.replaceWith(f.firstElementChild);} }
  });
  document.querySelectorAll('.tile').forEach(t=>{ const l0=L0[t.dataset.l0]; if(l0) t.querySelector('.bar2').innerHTML=barHTML(l0); });
}
function statusOf(l2){ return review.statuses[l2.eid]||'draft'; }
function counts(l2s){ const c={draft:0,review:0,changes:0,confirmed:0}; l2s.forEach(x=>c[statusOf(x)]++); return c; }
function barHTML(l0){
  const l2s = l0.l1s.flatMap(g=>g.l2s), c=counts(l2s), n=l2s.length;
  return ['confirmed','changes','review','draft'].map(k=>`<i style="width:${(c[k]/n*100).toFixed(1)}%;background:var(--s-${k})" title="${STATUS[k]}: ${c[k]}"></i>`).join('');
}
function renderProgress(){
  const c=counts(ALL_L2), n=ALL_L2.length;
  $('#progress').innerHTML = `<span>${c.confirmed}/${n} confirmed</span><span class="track">${['confirmed','changes','review','draft'].map(k=>`<i style="width:${(c[k]/n*100).toFixed(1)}%;background:var(--s-${k})"></i>`).join('')}</span>${shared?'<span title="Statuses, verdicts and comments are shared with everyone who opens this page">shared</span>':'<span title="Not connected to shared review state — saved in this browser only">local</span>'}`;
}

// ---------- db wiring ----------
async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
    if(!db) return;
    shared = true;
    db.collection('review').onSnapshot(snap=>{
      snap.docs.forEach(d=>applyReviewDoc(d.id, d.data()));
      dbReady = true; renderProgress(); softRender();
    }, e=>{ console.warn('review subscription ended', e); });
    db.collection('comments').onSnapshot(snap=>{
      snap.docs.forEach(d=>{ review.comments[d.id]=(d.data()||{}).items||[]; });
      softRender();
    }, e=>{ console.warn('comments subscription ended', e); });
    renderProgress();
  }catch(e){ console.warn('db unavailable', e); }
}

let pendingRender=false;
function softRender(){
  const ae=document.activeElement;
  if(ae && /textarea|input/i.test(ae.tagName) && ae.closest('#main')){ pendingRender=true; ae.addEventListener('blur',()=>{ if(pendingRender){pendingRender=false; softRender();} },{once:true}); return; }
  const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y});
}

// ---------- customer profile (one choice per design decision) ----------
// profile = {decisionKey: [optionId,...]}; unset decisions fall back to the register default.
let profile = ls.get('profile', {});
const variantView = {};   // `${l2.id}|${decisionKey}` -> optionId the reader is looking at
function activeOpts(key){ const d=DEC[key]; if(!d) return []; const p=profile[key]; return (p && p.length)? p.filter(o=>OPT(key,o)) : [d.default]; }
function profileSet(){ return Object.keys(profile).filter(k=>DEC[k] && profile[k] && profile[k].length); }
function matches(when){ if(!when) return true; return Object.entries(when).every(([k,opts])=>{ if(!profileSet().includes(k)) return true; /* unset decision: everything stays on-path */ const a=activeOpts(k); return !a.length || opts.some(o=>a.includes(o)); }); }
function onPath(l2){ return matches(l2.applies_when); }
function variantsOf(l2,key){ return (l2.variants||[]).filter(v=>v.decision===key); }
function activeVariant(l2,key){
  const vs=variantsOf(l2,key); if(!vs.length) return null;
  const want=variantView[l2.id+'|'+key];
  if(want){ const v=vs.find(x=>x.option===want); if(v) return v; }
  for(const o of activeOpts(key)){ const v=vs.find(x=>x.option===o); if(v) return v; }
  return vs.find(x=>x.option===DEC[key].default) || vs[0];
}
function effective(l2){
  // base record with the active variant of each decision merged over it
  const eff=Object.assign({}, l2); const over={};
  (l2.decisions||[]).forEach(k=>{ const v=activeVariant(l2,k); if(v){ Object.entries(v).forEach(([f,val])=>{ if(f!=='decision'&&f!=='option'){ eff[f]=val; over[f]=k; } }); } });
  eff._over=over; return eff;
}
function condText(when){ return Object.entries(when||{}).map(([k,opts])=>`${DEC[k]?DEC[k].name:k}: ${opts.map(o=>{const x=OPT(k,o);return x?x.name:o;}).join(' / ')}`).join('; '); }
function setProf(){ const n=profileSet().length; const el=$('#prof'); el.classList.toggle('set',n>0); el.innerHTML=`<i></i>Profile: <b>${n?n+' choice'+(n>1?'s':''):'default'}</b>`; }
function saveProfile(){ ls.set('profile',profile); setProf(); }
function rerenderKeep(){ const y=window.scrollY; suppressScroll=true; render(); suppressScroll=false; window.scrollTo({top:y}); }

// ---------- helpers ----------
function prodChips(l2){ return l2.products.map(p=>`<span class="chip prod" data-p="${p}">${p}</span>`).join('') || `<span class="chip prod" data-p="${esc(l2.primary_product)}">${esc(l2.primary_product)}</span>`; }
function flowChips(l2){ return l2.flows.map(f=>`<a class="chip flow" href="#/flow/${f}" title="${esc(FLOW[f].title)}">${f} · ${esc(FLOW[f].name)}</a>`).join(''); }
function np(v){ return v? esc(v) : '<span class="np">Not provided</span>'; }
function link(id){ const l2=L2[id]; return l2?`<a href="#/l0/${l2.l0}/${id}" title="${esc(l2.name)}">${id}</a>`:esc(id); }
function crossref(text){ return esc(text).replace(/\b(\d\d\.\d\.\d)\b/g,(m)=>L2[m]?`<a href="#/l0/${L2[m].l0}/${m}">${m}</a>`:m); }

// ---------- record ----------
function approachRows(l2, eff){
  // one "Approach" row per design decision the record is bound to
  const rows=[];
  (l2.decisions||[]).forEach(k=>{
    const d=DEC[k]; if(!d) return;
    const vs=variantsOf(l2,k); const act=activeVariant(l2,k); const chosen=activeOpts(k);
    if(vs.length){
      const tabs=vs.map(v=>{ const o=OPT(k,v.option); return `<button type="button" data-variant="${l2.id}|${k}|${v.option}" aria-pressed="${act&&act.option===v.option}" class="${chosen.includes(v.option)?'chosen':''}" title="${esc(o?o.summary:'')}">${esc(o?o.name:v.option)}</button>`; }).join('');
      const vname = act && act.name && act.name!==l2.name ? `<p class="vname">Under this approach: <b>${esc(act.name)}</b></p>` : '';
      rows.push(`<div><dt>Approach</dt><dd><div class="tabs"><span class="dk"><a href="#/decisions/${k}" title="${esc(d.question)}">${d.id} ${esc(d.name)}</a></span>${tabs}</div>${vname}${sme()?`<span class="raw">✓ = chosen in the current profile. Fields marked with a green edge come from this approach; the rest are common to every approach.</span>`:''}</dd></div>`);
    } else {
      rows.push(`<div><dt>Approach</dt><dd><span class="cond">Shaped by <a href="#/decisions/${k}">${d.id} ${esc(d.name)}</a></span> <span style="font-size:12.5px;color:var(--ink2)">— ${esc(d.question)}</span></dd></div>`);
    }
  });
  if(l2.applies_when) rows.push(`<div><dt>Applies when</dt><dd><span class="cond">${esc(condText(l2.applies_when))}</span>${onPath(l2)?'':' <span style="font-size:12px;color:var(--s-review)">— not selected in the current profile</span>'}</dd></div>`);
  return rows;
}
const sme = ()=>lens==='sme';
function recordHTML(l2, opts={}){
  const st = statusOf(l2), smeL = lens==='sme';
  const v = review.verdicts[l2.eid];
  const comments = review.comments[l2.eid]||[];
  const e = effective(l2), ov = e._over;
  const V = f => ov[f]?' class="var"':'';           // mark fields supplied by the active variant
  const rows = [];
  rows.push(...approachRows(l2, e));
  rows.push(`<div><dt${V('inputs')||V('outputs')}>Inputs → outputs</dt><dd${V('inputs')||V('outputs')}><div class="io"><div><span class="lbl">Inputs</span>${np(e.inputs)}</div><span class="arr">→</span><div><span class="lbl">Outputs</span>${np(e.outputs)}</div></div></dd></div>`);
  rows.push(`<div><dt${V('description')}>What happens</dt><dd${V('description')}>${crossref(e.description)}</dd></div>`);
  rows.push(`<div><dt${V('personas')}>Who</dt><dd${V('personas')}><div class="chips">${l2.persona_list.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div>${smeL?`<span class="raw">Source text: ${esc(e.personas)}</span>`:''}</dd></div>`);
  rows.push(`<div><dt>Where</dt><dd><div class="chips">${prodChips(l2)}</div>${smeL?`<span class="raw">${esc(e.tool)}</span>`:''}</dd></div>`);
  if(smeL) rows.push(`<div><dt${V('config')}>Configuration objects</dt><dd${V('config')}>${np(e.config)}</dd></div>`);
  rows.push(`<div><dt${V('cadence')}>When</dt><dd${V('cadence')}><span class="chip">${esc(l2.cadence_bucket)}</span> <span style="color:var(--ink2);font-size:13px;margin-left:6px">${esc(e.cadence)}</span></dd></div>`);
  if(l2.flows.length) rows.push(`<div><dt>Part of flows</dt><dd><div class="chips">${flowChips(l2)}</div></dd></div>`);
  if(smeL){
    rows.push(`<div><dt>Frameworks</dt><dd><div class="chips">${l2.frameworks.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></dd></div>`);
    rows.push(`<div><dt>Delivery model</dt><dd>${esc(l2.delivery_model)}${l2.budgeting_method?` · <span style="color:var(--ink2)">Budgeting method: ${esc(l2.budgeting_method)}</span>`:''}${ov.bpmn_type?` · <span class="var" style="border:0;padding:0;margin:0;color:var(--accent)">BPMN task type under this approach: ${esc(e.bpmn_type)}</span>`:''}</dd></div>`);
    rows.push(`<div><dt${V('evidence')}>Evidence</dt><dd class="evidence${ov.evidence?' var':''}">${np(e.evidence)}</dd></div>`);
  }
  const verdictRow = v && v.verdict ? `<span>Group verdict: <b>${esc(VERDICT[v.verdict])}</b></span>`:'';
  const off = !onPath(l2);
  return `<article class="record${opts.target?' target':''}${off?' off':''}" id="rec-${l2.id}" data-eid="${l2.eid}" aria-labelledby="h-${l2.id}">
    <div class="rhead">
      <div class="ttl">
        <h3 id="h-${l2.id}"><span class="id">${l2.id}</span><span>${esc(l2.name)}</span><a class="perma" href="#/l0/${l2.l0}/${l2.id}" aria-label="Permalink to ${l2.id}">#</a></h3>
        <div class="eid">${l2.eid}${l2.legacy_id?` · was ${esc(l2.legacy_id)}`:''}${smeL?` · ${esc(L1[l2.l1].name)}`:''}${(l2.variants||[]).length?` · ${l2.variants.length} approaches`:''}</div>
      </div>
      <div class="ctl">
        <span class="status" data-s="${st}">${STATUS[st]}</span>
        <select class="status-sel" data-set-status="${l2.eid}" aria-label="Set review status for ${l2.id}">
          ${Object.entries(STATUS).map(([k,n])=>`<option value="${k}"${k===st?' selected':''}>${n}</option>`).join('')}
        </select>
      </div>
    </div>
    <p class="outcome"><b>What you get:</b> ${esc(l2.outcome||'Not provided')}</p>
    <dl class="sl">${rows.join('')}</dl>
    <details class="comments"${comments.length?' open':''}>
      <summary>${comments.length? comments.length+' comment'+(comments.length>1?'s':'') : 'Add a comment'} <span style="font-family:var(--mono);font-size:11px;color:var(--ink3)">anchored to ${l2.eid}</span></summary>
      <div class="list">${comments.map(c=>`<div class="comment"><div class="ch"><b>${esc(c.by)}</b><span>${esc((c.at||'').slice(0,10))}</span>${c.attr?`<span class="at">${esc(c.attr)}</span>`:''}</div>${esc(c.text)}</div>`).join('')}</div>
      <form class="cform" data-comment="${l2.eid}">
        <select name="attr" aria-label="Attribute this comment is about"><option value="">Whole record</option>${['description','inputs','outputs','who','where','config','cadence','frameworks','evidence','outcome'].map(a=>`<option>${a}</option>`).join('')}</select>
        <textarea name="text" rows="1" placeholder="Comment as ${esc(reviewer||'anonymous')}…" required aria-label="Comment text"></textarea>
        <button type="submit">Post</button>
      </form>
    </details>
    <div class="foot">
      <span class="comp">Completeness <i><b style="width:${(l2.completeness/l2.completeness_of*100).toFixed(0)}%"></b></i> ${l2.completeness}/${l2.completeness_of}</span>
      ${verdictRow}
      <span>${review.statuses[l2.eid]?'':'No review recorded yet'}</span>
    </div>
  </article>`;
}

}

const facetState = {product:'',persona:'',cadence:'',flow:'',framework:'',status:'',l0:'',method:'',decision:'',q:''};
let sortKey='id', sortDir=1, compact=false; const expanded=new Set(), selected=new Set();
function registerHTML(){
  const opts=(name,vals,label)=>`<select data-facet="${name}" aria-label="${label}"><option value="">${label}: all</option>${vals.map(v=>`<option value="${esc(v)}"${facetState[name]===v?' selected':''}>${esc(v)}</option>`).join('')}</select>`;

  return `<div class="pagehead"><div><p class="eyebrow">Register</p><h1>All processes</h1><p class="lede">One row per L2. Filter by any overlay, sort a column, expand a row to see the full record, tick rows to change status in batch.</p></div></div>
  <div class="facets">

  <div class="tablewrap"><table class="reg${compact?' compact':''}"><thead><tr><th style="cursor:default"><input type="checkbox" id="selall" aria-label="Select all shown"></th><th style="cursor:default"></th>${th('id','ID')}${th('name','Process')}${th('l1','Group')}${th('primary_product','Product')}${th('cadence_bucket','Cadence')}<th style="cursor:default">Who</th><th style="cursor:default" title="Design decisions that shape this process; number = variants on record">Approaches</th>${th('status','Status')}</tr></thead><tbody>
  ${rows.map(x=>`<tr data-row="${x.id}"${onPath(x)?'':' class="off"'}><td><input type="checkbox" data-sel="${x.eid}"${selected.has(x.eid)?' checked':''} aria-label="Select ${x.id}"></td><td class="exp"><button data-expand="${x.id}" aria-expanded="${expanded.has(x.id)}" aria-label="Expand ${x.id}">${expanded.has(x.id)?'▾':'▸'}</button></td><td class="id"><a href="#/l0/${x.l0}/${x.id}">${x.id}</a></td><td>${esc(x.name)}</td><td style="font-size:12.5px;color:var(--ink2)">${x.l1} ${esc(L1[x.l1].name)}</td><td><div class="chips">${prodChips(x)}</div></td><td>${esc(x.cadence_bucket)}</td><td><div class="chips">${x.persona_list.slice(0,2).map(p=>`<span class="chip">${esc(p)}</span>`).join('')}${x.persona_list.length>2?`<span class="chip">+${x.persona_list.length-2}</span>`:''}</div></td><td><div class="chips">${(x.decisions||[]).map(k=>`<a class="chip flow" href="#/decisions/${k}" title="${esc(DEC[k].name)}">${DEC[k].id}${variantsOf(x,k).length?' · '+variantsOf(x,k).length:''}</a>`).join('')}${x.applies_when?`<span class="chip" title="${esc(condText(x.applies_when))}">conditional</span>`:''}</div></td><td><span class="status" data-s="${statusOf(x)}">${STATUS[statusOf(x)]}</span></td></tr>${expanded.has(x.id)?`<tr class="detail"><td colspan="10">${recordHTML(x)}</td></tr>`:''}`).join('')}
  </tbody></table></div>`;
}
function filtered(){
  const f=facetState;
  let rows = ALL_L2.filter(x=>
    (!f.l0 || f.l0.startsWith('L0-'+x.l0)) && (!f.product || x.products.includes(f.product)) && (!f.persona || x.persona_list.includes(f.persona)) &&
    (!f.cadence || x.cadence_bucket===f.cadence) && (!f.flow || x.flows.includes(f.flow)) && (!f.framework || x.framework_tags.includes(f.framework)) &&
    (!f.method || x.budgeting_method===f.method) && (!f.decision || (x.decisions||[]).some(k=>f.decision.startsWith(DEC[k].id+' '))) && (!f.status || STATUS[statusOf(x)]===f.status));
  const key = sortKey==='status'? x=>Object.keys(STATUS).indexOf(statusOf(x)) : sortKey==='l1'? x=>x.l1 : x=>x[sortKey];
  rows.sort((a,b)=>{const ka=key(a),kb=key(b);return (ka>kb?1:ka<kb?-1:0)*sortDir;});
  return rows;
}

// ---------- BPMN: layout, SVG rendering, BPMN 2.0 XML export ----------
const BP = {laneHead:150, colW:208, nodeW:162, taskH:74, laneBase:122, slotH:96, padX:28, evR:18, gwR:24};

function bpmnKind(type){
  const t=(type||'').toLowerCase();
  if(t.startsWith('start')) return t.includes('timer')?'startTimer':'start';
  if(t.startsWith('end')) return 'end';
  if(t.includes('gateway')) return t.includes('parallel')?'gwPar':'gwXor';
  if(t.startsWith('user')) return 'user';
  if(t.startsWith('service')) return 'service';
  if(t.startsWith('send')) return 'send';
  if(t.startsWith('sub')) return 'sub';
  return 'task';
}
function bpmnLayout(f){
  const lanes = f.lanes.slice();
  const laneIx = Object.fromEntries(lanes.map((l,i)=>[l,i]));
  const nodes=[], edges=[], byN={};

  if(lines.length>maxLines){ lines.length=maxLines; lines[maxLines-1]=lines[maxLines-1].replace(/.{2}$/,'')+'…'; }

}

  if(kind==='service') return `<g transform="translate(${x},${y})" ${c}><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="6" r="5.2" stroke-dasharray="2 1.6"/></g>`;

function bpmnSVG(f, laneColor){

      if(n.kind==='startTimer') body+=`<circle cx="${n.cx}" cy="${n.cy}" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M${n.cx} ${n.cy-7}v7h5" fill="none" stroke="currentColor" stroke-width="1.4"/>`;

  }).join('\n');

      <p style="font-size:11.5px;color:var(--ink3);margin:8px 0 0">Solid outline = the process has a variant per option · dashed = the process only exists under some options · plain = listed as affected, no variant text yet.</p>

  <div class="statlist"><div class="stat"><b>${DECISIONS.length}</b><span>decisions</span></div><div class="stat"><b>${DECISIONS.reduce((a,d)=>a+d.options.length,0)}</b><span>options</span></div><div class="stat"><b>${ALL_L2.reduce((a,x)=>a+(x.variants||[]).length,0)}</b><span>variants</span></div><div class="stat"><b>${ALL_L2.filter(x=>x.decisions).length}</b><span>processes shaped</span></div></div></div>

// ---------- routing ----------
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(!parts.length) return {page:'hub'};
  if(parts[0]==='l0' && L0[parts[1]]) return {page:'l0', l0:L0[parts[1]], target:parts[2]||null};
  if(parts[0]==='register') return {page:'register'};
  if(parts[0]==='flow' && FLOW[parts[1]]) return {page:'flow', flow:FLOW[parts[1]]};
  if(parts[0]==='decisions') return {page:'decisions', target:parts[1]||null};
  if(parts[0]==='glossary') return {page:'glossary'};
  if(parts[0]==='diagrams') return {page:'diagrams'};
  if(parts[0]==='changelog') return {page:'changelog'};
  if(parts[0]==='print') return {page:'print'};
  return {page:'hub'};
}
let lastKey='', suppressScroll=false;

  const r = route();

  else if(r.page==='l0'){
    main.innerHTML = l0HTML(r.l0, r.target);
    crumbs += ` <span class="sep">/</span> <a href="#/l0/${r.l0.id}"><span class="id">L0-${r.l0.id}</span> ${esc(r.l0.short)}</a>`;
    if(r.target && L2[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L2[r.target].name)}</span>`;
    else if(r.target && L1[r.target]) crumbs += ` <span class="sep">/</span> <span class="here"><span class="id">${r.target}</span> ${esc(L1[r.target].name)}</span>`;
    title = `L0-${r.l0.id} ${r.l0.name}`;

  }
  else if(r.page==='register'){ main.innerHTML = registerHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Register</span>`; title='Register'; }
  else if(r.page==='flow'){ main.innerHTML = flowHTML(r.flow); crumbs += ` <span class="sep">/</span> <span>Flows</span> <span class="sep">/</span> <span class="here"><span class="id">${r.flow.id}</span> ${esc(r.flow.name)}</span>`; title=r.flow.id+' '+r.flow.name; }

  else if(r.page==='decisions'){ main.innerHTML = decisionsHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Decisions</span>`; title='Decisions';
    const key = r.page+'/'+(r.target||'');
    if(r.target && DEC[r.target] && key!==lastKey && !suppressScroll){ const el=document.getElementById(r.target); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:'start'})); }
    else if(!r.target && key!==lastKey && !suppressScroll) window.scrollTo({top:0});
    lastKey = key; $('#crumbs').innerHTML = crumbs; document.title = title+' · Apptio Process Catalog'; return; }
  else if(r.page==='glossary'){ main.innerHTML = glossaryHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Glossary</span>`; }
  else if(r.page==='changelog'){ main.innerHTML = changelogHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Changelog</span>`; }
  else if(r.page==='print'){ main.innerHTML = printHTML(); crumbs += ` <span class="sep">/</span> <span class="here">Print view</span>`; }
  $('#crumbs').innerHTML = crumbs;
  document.title = title + ' · Apptio Process Catalog';
  if(r.page!=='l0') { lastKey=''; if(!suppressScroll) window.scrollTo({top:0}); }

let spyObs=null;
function setupSpy(){
  if(spyObs) spyObs.disconnect();
  const links = [...document.querySelectorAll('.rail a[data-spy]')];
  if(!links.length) return;
  const byId = Object.fromEntries(links.map(a=>[a.dataset.spy,a]));
  spyObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.remove('on')); const a=byId[e.target.id]; if(a){a.classList.add('on'); } } });
  },{rootMargin:'-70px 0px -70% 0px',threshold:0});
  links.forEach(a=>{const el=document.getElementById(a.dataset.spy); if(el) spyObs.observe(el);});
}

const INDEX = ALL_L2.map(x=>({id:x.id,eid:x.eid,l0:x.l0,name:x.name,text:(x.id+' '+x.eid+' '+x.name+' '+x.description+' '+(x.config||'')+' '+(x.personas||'')+' '+x.tool+' '+(x.evidence||'')).toLowerCase()}))
  .concat(FLOWS.map(f=>({flow:f.id,name:f.id+' · '+f.name+' — '+f.title,text:(f.id+' '+f.name+' '+f.title+' '+f.summary).toLowerCase()})))
  .concat(Object.values(L1).map(g=>({g:g.id,l0:g.l0,name:g.id+' '+g.name,text:(g.id+' '+g.eid+' '+g.name+' '+(g.original_name||'')).toLowerCase()})))
  .concat(DECISIONS.map(d=>({dec:d.key,name:d.id+' · '+d.name+' — '+d.question,text:(d.id+' '+d.key+' '+d.name+' '+d.question+' '+d.domain+' '+d.options.map(o=>o.id+' '+o.name+' '+o.summary+' '+o.fit).join(' ')).toLowerCase()})));
// variant text is searchable through its parent record
INDEX.forEach(i=>{ if(i.id && L2[i.id] && L2[i.id].variants) i.text += ' ' + L2[i.id].variants.map(v=>(v.name||'')+' '+(v.description||'')+' '+(v.config||'')).join(' ').toLowerCase(); });
let qActive=-1;
function doSearch(){
  const q=$('#q').value.trim().toLowerCase(); const box=$('#qres');
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const terms=q.split(/\s+/);
  const hits=INDEX.filter(i=>terms.every(t=>i.text.includes(t))).slice(0,12);
  box.innerHTML = hits.length? hits.map(h=>h.flow?`<a href="#/flow/${h.flow}"><span class="k">FLOW</span>${esc(h.name)}</a>`:h.dec?`<a href="#/decisions/${h.dec}"><span class="k">DECISION</span>${esc(h.name)}</a>`:h.g?`<a href="#/l0/${h.l0}/${h.g}"><span class="k">GROUP</span>${esc(h.name)}</a>`:`<a href="#/l0/${h.l0}/${h.id}"><span class="k">${h.id}</span>${esc(h.name)}</a>`).join('') : '<a href="#/register">No matches — open the register</a>';
  box.hidden=false; qActive=-1;
}

document.addEventListener('toggle', e=>{ if(e.target.classList&&e.target.classList.contains('gdiag')) ls.set('diagClosed', !e.target.open); }, true);

  if(t.dataset.owner!==undefined){ saveReview(t.dataset.owner,{owner:t.value}); }
  if(t.dataset.facet!==undefined){ facetState[t.dataset.facet]=t.value; render(); }
  if(t.dataset.profile){ const k=t.dataset.profile, d=DEC[k]; if(d){
      if(d.multi){ const cur=new Set(activeOpts(k)); t.checked?cur.add(t.value):cur.delete(t.value); profile[k]=[...cur].filter(o=>OPT(k,o)); if(!profile[k].length) delete profile[k]; }
      else profile[k]=[t.value];
      if(profile[k] && profile[k].length===1 && profile[k][0]===d.default && !d.multi) { /* keep explicit choice even if it equals the default */ }
      saveProfile(); rerenderKeep(); } }
  if(t.id==='compact'){ compact=t.checked; render(); }

document.addEventListener('submit', e=>{
  const f=e.target.closest('form[data-comment]'); if(!f) return; e.preventDefault();
  const text=f.text.value.trim(); if(!text) return;
  if(!reviewer){ const n=prompt('Your name for this comment:',''); if(n==null) return; reviewer=n.trim(); ls.set('reviewer',reviewer); setWho(); }
  addComment(f.dataset.comment, f.attr.value, text); f.text.value='';
});
window.addEventListener('hashchange', render);
function setLens(){ $('#lens-business').setAttribute('aria-pressed', lens==='business'); $('#lens-sme').setAttribute('aria-pressed', lens==='sme'); }
function setWho(){ $('#who').innerHTML='Reviewing as <b>'+esc(reviewer||'—')+'</b>'; }

setLens(); setWho(); setProf(); renderProgress(); render(); initDb();
})();
</script>
