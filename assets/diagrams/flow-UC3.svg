<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2674 340" width="2674" height="340" role="img" aria-label="BPMN swimlane diagram of Targets down: 2 lanes, 11 steps"><title>Targets down</title><style>
svg{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E2422}
.lane0{fill:#FFFFFF}.lane1{fill:#EBEDE8}.ground{fill:#F3F4F1}.gw{fill:#FAF0DC}.env{fill:#FFFFFF}
@media (prefers-color-scheme: dark){svg{color:#E8EAE6}.lane0{fill:#202423}.lane1{fill:#2A2F2D}.ground{fill:#181B1A}.gw{fill:#3A2F17}.env{fill:#202423}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g><rect x="0" y="0" width="2674" height="122" class="lane0" stroke="currentColor" stroke-opacity=".35"/><rect x="0" y="0" width="6" height="122" fill="#5B6E1F"/><text x="78.0" y="54.0" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="78.0" dy="0">IT Planning</tspan><tspan x="78.0" dy="14">(Finance)</tspan></text><line x1="150" y1="0" x2="150" y2="122" stroke="currentColor" stroke-opacity=".35"/></g><g><rect x="0" y="122" width="2674" height="218" class="lane1" stroke="currentColor" stroke-opacity=".35"/><rect x="0" y="122" width="6" height="218" fill="#3A6EA5"/><text x="78.0" y="224.0" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="78.0" dy="0">Targetprocess /</tspan><tspan x="78.0" dy="14">ATP</tspan></text><line x1="150" y1="122" x2="150" y2="340" stroke="currentColor" stroke-opacity=".35"/></g><path d="M277 61L386 61" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 61L594 61" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M756 61L779 61L779 183L802 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M964 183L1010 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1172 183L1218 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1380 183L1483 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1507 207L1507 261" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1514" y="238" font-size="10" font-weight="600" fill="currentColor" text-anchor="start">No</text><path d="M1531 183L1634 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1582" y="177" font-size="10" font-weight="600" fill="currentColor" text-anchor="middle">Yes</text><path d="M1796 183L1819 183L1819 61L1842 61" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M2004 61L2027 61L2027 183L2050 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M2212 183L2258 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M2420 183L2529 183" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><g class="bn"><title>start · Planning cycle begins (Start event)</title><circle cx="259.0" cy="61.0" r="18" class="ground" stroke="currentColor" stroke-width="1.5"/><text x="259.0" y="92.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="259.0" dy="0">Planning cycle begins</tspan></text></g><g class="bn"><title>1 · Create workforce plan &amp; top-down target spend by department (Task) — At whatever level you budget: department, cost center, ART, solution train</title><rect x="386.0" y="24.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><text x="541.0" y="37.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">1</text><text x="467.0" y="61.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="467.0" dy="0">Create workforce plan &amp;</tspan><tspan x="467.0" dy="13">top-down target spend by</tspan><tspan x="467.0" dy="13">department</tspan></text></g><g class="bn"><title>2 · Send portfolio spend targets to Targetprocess (data highway) (Send task (ADM)) — Lane crossing: ADM</title><rect x="594.0" y="24.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><rect x="597.0" y="27.0" width="162" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/><g transform="translate(602.0,31.0)"><rect width="13" height="9" rx="1" fill="currentColor"/><path d="M0.5 1l6 4.5 6-4.5" class="env" stroke="#fff" stroke-width="1.2" fill="none"/></g><text x="749.0" y="37.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">2 · ADM</text><text x="675.0" y="61.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="675.0" dy="0">Send portfolio spend</tspan><tspan x="675.0" dy="13">targets to Targetprocess</tspan><tspan x="675.0" dy="13">(data highway)</tspan></text></g><g class="bn"><title>3 · Create top-down budget / target artifacts (Task)</title><rect x="802.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><text x="957.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">3</text><text x="883.0" y="189.5" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="883.0" dy="0">Create top-down budget /</tspan><tspan x="883.0" dy="13">target artifacts</tspan></text></g><g class="bn"><title>4 · Create position request (role, location, hours, type) (User task) — Department link ties request to finance budget line</title><rect x="1010.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><g transform="translate(1018.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="1165.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">4</text><text x="1091.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1091.0" dy="0">Create position request</tspan><tspan x="1091.0" dy="13">(role, location, hours,</tspan><tspan x="1091.0" dy="13">type)</tspan></text></g><g class="bn"><title>5 · Run multi-level approval workflow (HR &gt; Dept &gt; Final, escalations) (User task)</title><rect x="1218.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><g transform="translate(1226.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="1373.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">5</text><text x="1299.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1299.0" dy="0">Run multi-level approval</tspan><tspan x="1299.0" dy="13">workflow (HR &gt; Dept &gt;</tspan><tspan x="1299.0" dy="13">Final, escalations)</tspan></text></g><g class="bn"><title>6 · Approved? (XOR gateway) — No: end event &#x27;Request rejected&#x27;; Yes: continue</title><path d="M1507.0 159.0L1531.0 183.0L1507.0 207.0L1483.0 183.0Z" class="gw" stroke="currentColor" stroke-width="1.5"/><path d="M1500.0 176.0l14 14M1514.0 176.0l-14 14" stroke="currentColor" stroke-width="2.2"/><text x="1507.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="currentColor"><tspan x="1507.0" dy="0">Approved?</tspan></text><text x="1535.0" y="209.0" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">6</text></g><g class="bn"><title>Request rejected (End event)</title><circle cx="1507.0" cy="279.0" r="18" class="ground" stroke="currentColor" stroke-width="3"/><text x="1507.0" y="310.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1507.0" dy="0">Request rejected</tspan></text></g><g class="bn"><title>7 · Send approved positions to IT Planning (daily / weekly sync) (Send task (ADM)) — Only approved positions cross</title><rect x="1634.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><rect x="1637.0" y="149.0" width="162" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/><g transform="translate(1642.0,153.0)"><rect width="13" height="9" rx="1" fill="currentColor"/><path d="M0.5 1l6 4.5 6-4.5" class="env" stroke="#fff" stroke-width="1.2" fill="none"/></g><text x="1789.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">7 · ADM</text><text x="1715.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1715.0" dy="0">Send approved positions to</tspan><tspan x="1715.0" dy="13">IT Planning (daily /</tspan><tspan x="1715.0" dy="13">weekly sync)</tspan></text></g><g class="bn"><title>8 · Normalize &amp; budget open + filled positions (auto-updated when filled) (Task) — Round-trip: fill event in ATP auto-updates Planning record</title><rect x="1842.0" y="24.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><text x="1997.0" y="37.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">8</text><text x="1923.0" y="61.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="1923.0" dy="0">Normalize &amp; budget open +</tspan><tspan x="1923.0" dy="13">filled positions</tspan><tspan x="1923.0" dy="13">(auto-updated when filled)</tspan></text></g><g class="bn"><title>9 · Allocate users / teams / ARTs / solution trains to work (bottom-up demand) (User task)</title><rect x="2050.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><g transform="translate(2058.0,153.0)" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="6" cy="4" r="3"/><path d="M0 13c0-4 12-4 12 0"/></g><text x="2205.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">9</text><text x="2131.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="2131.0" dy="0">Allocate users / teams /</tspan><tspan x="2131.0" dy="13">ARTs / solution trains to</tspan><tspan x="2131.0" dy="13">work (bottom-up demand)</tspan></text></g><g class="bn"><title>10 · Compare demand rollup vs. target spend (capacity / FTE reports) (Task) — Forward-looking: e.g. 3 months out demand exceeds FTE</title><rect x="2258.0" y="146.0" width="162" height="74" rx="8" class="ground" stroke="currentColor" stroke-width="1.5"/><text x="2413.0" y="159.0" text-anchor="end" font-size="9.5" fill="currentColor" fill-opacity=".6" font-family="monospace">10</text><text x="2339.0" y="183.0" text-anchor="middle" font-size="10.5" fill="currentColor"><tspan x="2339.0" dy="0">Compare demand rollup vs.</tspan><tspan x="2339.0" dy="13">target spend (capacity /</tspan><tspan x="2339.0" dy="13">FTE reports)</tspan></text></g><g class="bn"><title> (End event)</title><circle cx="2547.0" cy="183.0" r="18" class="ground" stroke="currentColor" stroke-width="3"/><text x="2547.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor"></text></g></svg>