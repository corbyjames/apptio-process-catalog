- l2id: 02.1.2
  l2: Triage, categorize & qualify demand
  l1id: '02.1'
  l1: Demand Intake & Qualification
  desc: Route, categorize (work item taxonomy, BAU vs change, CapEx/OpEx) and qualify requests against strategy
    before they enter the portfolio funnel. Includes detecting materially similar or duplicate demand (overlapping
    investments, teams pursuing similar outcomes) beyond title matching.
  delivery: Any
  tool: Targetprocess
  support: ''
  personas: PMO, Portfolio Mgmt
  cadence: Weekly cadence
  inputs: Demand records
  outputs: Qualified demand in funnel
  config: Request workflow states, triage boards, automation rules (routing/auto-reply/linked entities), work-intake
    taxonomy (categories, CapEx/OpEx, non-labor categories); duplicate/overlap detection across descriptions, outcomes,
    journeys, capabilities
  fw: 'SPM: Demand Intake'
  src: SPM journey map (work-intake model taxonomy); TP guide; PI Planning/EVD Agent requirements (IBM, anonymized)
    §6.2, §8.3
